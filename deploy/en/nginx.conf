include /etc/nginx/chat-agent-runtime.conf;

server {
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    include mime.types;
    default_type application/octet-stream;
    types {
        text/markdown md mdx mdwn;
    }

    listen       80;
    listen  [::]:80;
    server_name  localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /api/chat {
        proxy_pass http://docs_agent/api/chat/stream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Accept text/event-stream;
        proxy_set_header Authorization "";
        proxy_set_header Content-Type application/json;
        proxy_set_header X-Conversation-ID $http_x_conversation_id;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/chat/interrupt {
        proxy_pass http://docs_agent/api/chat/interrupt;
        proxy_http_version 1.1;
        proxy_set_header Authorization "";
        proxy_set_header Content-Type application/json;
        proxy_set_header X-Conversation-ID $http_x_conversation_id;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        resolver 10.255.0.10 valid=30s ipv6=off;
        set $chat_proxy_upstream chat-proxy.zdocs.svc.cluster.local:9000;
        proxy_pass http://$chat_proxy_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri.html =404;
    }

    location = / {
        return 301 /docs/home;
    }

    location = /docs {
        return 301 /docs/home;
    }

    location = /docs/migration-guides {
        return 301 /docs/migrations;
    }

