# Zilliz Cloud CMS live data: the `.md` artifacts carry SSI block(stub)+include
# pairs baked by embed-markdown; /api/cloud-data/ resolves them at request time
# from the CMS JSON (njs renderer, same modules as the build). The 1m
# subrequest buffer must stay >= the CMS JSON size — too small yields an empty
# 200 with zero bytes instead of a stub fallback (ssi-local-test).
js_path /etc/nginx/njs;
js_import cloudData from /etc/nginx/njs/cloud.js;
subrequest_output_buffer_size 1m;
proxy_cache_path /var/cache/nginx/cloud_data levels=1:2 keys_zone=cloud_data:1m max_size=16m inactive=10m use_temp_path=off;

include /etc/nginx/chat-agent-runtime.conf;

server {
    # NEXT-channel route gate generated at container start by 40-zdoc-env.sh.
    include /etc/nginx/release-channel-gate/*.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    include mime.types;
    default_type application/octet-stream;
    types {
        text/markdown md mdx mdwn;
    }

    # SSI processes `.md` responses only (ssi_types); text/html is untouched.
    ssi on;
    ssi_types text/markdown;

    listen       80;
    listen  [::]:80;
    server_name  localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /api/chat {
        proxy_pass http://docs_agent/api/chat/stream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Accept text/event-stream;
        proxy_set_header Authorization "";
        proxy_set_header Content-Type application/json;
        proxy_set_header X-Conversation-ID $http_x_conversation_id;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/chat/interrupt {
        proxy_pass http://docs_agent/api/chat/interrupt;
        proxy_http_version 1.1;
        proxy_set_header Authorization "";
        proxy_set_header Content-Type application/json;
        proxy_set_header X-Conversation-ID $http_x_conversation_id;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Cloud-data SSI chain ────────────────────────────────────────────────
    # include → /api/cloud-data/ (proxy loopback; an njs location cannot be an
    # SSI include target directly) → /_njs/fragment.md (njs renders the CMS
    # JSON) → /api/cloud-json/* (CMS proxy, 60s cache, stale-on-error).
    # Upstream errors must be intercepted: a Strapi 5xx JSON body would
    # otherwise be spliced into the markdown page; the empty 200 makes SSI use
    # the snapshot stub block instead.
    location = /api/cloud-json/regions {
        proxy_pass https://cms.zilliz.cc/api/cloud-regions;
        proxy_ssl_server_name on;
        proxy_cache cloud_data;
        proxy_cache_valid 200 60s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_intercept_errors on;
        error_page 400 401 403 404 429 500 502 503 504 = @cloud_json_failed;
    }

    location = /api/cloud-json/features {
        proxy_pass https://cms.zilliz.cc/api/cloud-features;
        proxy_ssl_server_name on;
        proxy_cache cloud_data;
        proxy_cache_valid 200 60s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_intercept_errors on;
        error_page 400 401 403 404 429 500 502 503 504 = @cloud_json_failed;
    }

    location @cloud_json_failed {
        return 503 "";
    }

    location /api/cloud-data/ {
        proxy_pass http://127.0.0.1:80/_njs/;
        proxy_intercept_errors on;
        error_page 400 401 403 404 429 500 502 503 504 = @cloud_fragment_failed;
    }

    location @cloud_fragment_failed {
        return 200 "";
    }

    location = /_njs/fragment.md {
        js_content cloudData.fragment;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri.html =404;
    }

    location = / {
        return 301 /docs/home;
    }

    location = /docs {
        return 301 /docs/home;
    }

