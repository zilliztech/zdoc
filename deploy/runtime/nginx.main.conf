# Main-context nginx configuration shipped instead of the stock image's
# /etc/nginx/nginx.conf. Same directives as the stock file of nginx:1.28-alpine,
# plus one addition: `load_module`. The cloud-data SSI renderer needs
# ngx_http_js_module, and `load_module` is only valid in the main context —
# the site-owned conf.d include lives in the http context, so there is no way
# to load the module from deploy/<site>/nginx.conf. Keep this file in
# lockstep with the base image's stock main config (verify on base-image
# updates; the container contract test asserts the load-bearing lines).

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

load_module /etc/nginx/modules/ngx_http_js_module.so;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
