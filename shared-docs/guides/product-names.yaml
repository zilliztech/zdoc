  - 'Milvus 2.0 @ Scale! #AI #Vector_Databasé'
  - "['Milvus', '2', '0', 'Scale', 'AI', 'Vector']"
  # Preserve the analyzer sample text shared by cnalphanumonly and cncharonly.
  - 'Milvus 是 LF AI & Data Foundation 下的一个开源项目，以 Apache 2.0 许可发布。'
  - "['Milvus', '是', 'LF', 'AI', 'Data', 'Foundation', '下', '的', '一个', '开源', '项目', '以', 'Apache', '2.0', '许可', '发布']"
  # Preserve the sample dense vector description text on the Dense Vector page.
  - 'Milvus is an efficient vector database'
  # Preserve the explicit engine version in the StructArray availability statements.
  - Nullable vector arrays, element-level null values, scalar `ARRAY` subfields, and adding or dropping StructArray subfields are supported on Dedicated Clusters compatible with Milvus v3.0.x.
  - Nullable vector arrays are supported on Dedicated Clusters compatible with Milvus v3.0.x; see the additional capabilities below.
  - Element-level null values, scalar `ARRAY` subfields, and adding or dropping subfields of an existing StructArray field are supported on Dedicated Clusters compatible with Milvus v3.0.x.
  - Element-level null values are supported on Dedicated Clusters compatible with Milvus v3.0.x but not yet available on On-Demand Clusters.
  # Preserve the version-scoped Go SDK limitation for StructArray hybrid grouping.
  - The Go client source shipped with Milvus 3.0.2 does not expose final hybrid grouping through `NewHybridSearchOption`.
  # Preserve the engine-version-scoped REST availability note in Linear Decay.
  - The RESTful API does not expose the decay/rerank operation as of Milvus v3.0.x.
  # Preserve the IS NULL/IS NOT NULL vector-field availability statement.
  - Starting in Milvus 3.0.3, the operators also support ordinary vector fields
  # Preserve the ARRAY_APPEND/ARRAY_REMOVE engine-version availability notes.
  - Available in Milvus v2.6.17 and later.
  # Preserve the C# connection credentials used by the Random Sampling examples.
  - 'Password = "Milvus"'
  # Preserve analyzer sample text and expected tokens used by the analyzer pages.
  - Milvus is a vector database built for scale!
  - Milvus 是一个高性能、可扩展的向量数据库！
  - '[''Milvus'', ''是'', ''一个'', ''高性'', ''性能'', ''高性能'', ''可'', ''扩展'', ''的'', ''向量'', ''数据'', ''据库'', ''数据库'']'
  - Milvus 向量数据库专为大规模应用而设计
  # Preserve engine-version statements on the JSON indexing pages; the version names the engine, not the product.
  - Starting in Milvus 3.0.0, whole-object JSON indexing (`json_cast_type="JSON"`), also known as JSON flat indexing, is deprecated. Existing indexes and new index-creation requests remain supported for compatibility, but this mode is no longer recommended for new workloads.
  - '| `JSON` | An entire JSON object or sub-object. Whole-object JSON indexing is deprecated starting in Milvus 3.0.0. | `{"supplier": {"country": "USA"}}` |'
  - When in doubt, start with `AUTOINDEX` for scalar paths. Use `INVERTED` explicitly for array cast types and text-match queries. Whole-object JSON indexing with either `INVERTED` or `AUTOINDEX` remains supported, but it is deprecated starting in Milvus 3.0.0.
  - '`AUTOINDEX` behavior depends on the `json_cast_type` you specify. In Milvus 3.0, `AUTOINDEX` no longer always resolves to `INVERTED` for JSON path indexes.'
  - '| `JSON` | Uses `INVERTED` for whole-object or sub-object indexing. This mode is deprecated starting in Milvus 3.0.0. |'
  - '**Behavior change in Milvus 3.0**. In earlier versions, `AUTOINDEX` on JSON paths always built an `INVERTED` index. From Milvus 3.0, `AUTOINDEX` picks between `BITMAP` and `STL_SORT` for scalar cast types. For `JSON`, `AUTOINDEX` still uses `INVERTED`, although whole-object JSON indexing is deprecated. For array cast types and text-match queries, specify `INVERTED` explicitly.'
  - '| `JSON` | An entire JSON object or sub-object with automatic type inference and flattening. Deprecated starting in Milvus 3.0.0. | any nested object | Yes (deprecated) | Yes (deprecated) | No | No |'
  - '- You''re maintaining an existing whole-object JSON index. Both `INVERTED` and `AUTOINDEX` remain supported for compatibility, but whole-object JSON indexing is deprecated starting in Milvus 3.0.0.'
  # Scalar index pages: SDK client comment, 3-gram sample word, engine-version note.
