name: translate docs content group

on:
  workflow_call:
    inputs:
      group: { required: true, type: string }
      target: { required: true, type: string }
      tooling_sha: { required: true, type: string }
      source_baseline_sha: { required: true, type: string }
      source_checkpoint_sha: { required: true, type: string }
      target_baseline_sha: { required: false, type: string, default: '' }
      should_translate: { required: true, type: boolean }
      max_files: { required: false, type: string, default: '500' }
      batch_index: { required: false, type: number, default: -1 }
      batch_number: { required: false, type: number, default: 0 }
      batch_count: { required: false, type: number, default: 0 }
      batch_size: { required: false, type: number, default: 0 }
      pending_count: { required: false, type: number, default: 0 }
      pending_set_sha256: { required: false, type: string, default: '' }
      artifact_retention_days: { required: false, type: number, default: 3 }
      recovery_run_id: { required: false, type: string, default: '' }
      recovery_bundle_artifact_name: { required: false, type: string, default: '' }
      recovery_plan_sha256: { required: false, type: string, default: '' }
      allow_full_retranslate: { required: false, type: boolean, default: false }
      mode: { required: false, type: string, default: auto }
      bootstrap_group: { required: false, type: string, default: '' }
      legacy_without_publication_selection: { required: false, type: boolean, default: false }
      publication_selection_artifact_name: { required: false, type: string, default: '' }
      publication_selection_sha256: { required: false, type: string, default: '' }
      publication_unit_key: { required: false, type: string, default: '' }
    outputs:
      status: { value: '${{ jobs.translate.outputs.status }}' }
      artifact_name: { value: '${{ jobs.translate.outputs.artifact_name }}' }
      baseline_artifact_name: { value: '${{ jobs.translate.outputs.baseline_artifact_name }}' }
      translated_count: { value: '${{ jobs.translate.outputs.translated_count }}' }
      failed_count: { value: '${{ jobs.translate.outputs.failed_count }}' }
      remaining_count: { value: '${{ jobs.translate.outputs.remaining_count }}' }
      reconciliation_plan_sha256: { value: '${{ jobs.translate.outputs.reconciliation_plan_sha256 }}' }
      reconciliation_result_sha256: { value: '${{ jobs.translate.outputs.reconciliation_result_sha256 }}' }
    secrets:
      TRANSLATION_AGENT_API_KEY: { required: true }
      REVIEW_AGENT_API_KEY: { required: true }

permissions:
  actions: read
  contents: read

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      status: ${{ steps.result.outputs.status }}
      artifact_name: ${{ steps.result.outputs.artifact_name }}
      baseline_artifact_name: ${{ steps.result.outputs.baseline_artifact_name }}
      translated_count: ${{ steps.result.outputs.translated_count }}
      failed_count: ${{ steps.result.outputs.failed_count }}
      remaining_count: ${{ steps.result.outputs.remaining_count }}
      reconciliation_plan_sha256: ${{ steps.result.outputs.reconciliation_plan_sha256 }}
      reconciliation_result_sha256: ${{ steps.result.outputs.reconciliation_result_sha256 }}
    env:
      GROUP: ${{ inputs.group }}
      BOOTSTRAP_GROUP: ${{ inputs.bootstrap_group || inputs.group }}
      TRANSLATION_TARGET: ${{ inputs.target }}
      SOURCE_BASELINE_SHA: ${{ inputs.source_baseline_sha }}
      SOURCE_CHECKPOINT_SHA: ${{ inputs.source_checkpoint_sha }}
      TARGET_BASELINE_SHA: ${{ inputs.target_baseline_sha || inputs.source_checkpoint_sha }}
      TOOLING_SHA: ${{ inputs.tooling_sha }}
      PUBLICATION_UNIT_KEY: ${{ inputs.publication_unit_key }}
    steps:
      - name: Initialize temporary paths
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${RUNNER_TEMP:-}" && "$RUNNER_TEMP" == /* ]] || { echo "RUNNER_TEMP must be a non-empty absolute path" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/publication-ready"
          printf '%s\n' \
            "BASELINE_DIR=$RUNNER_TEMP/translation-source-baseline" \
            "CHECKPOINT_DIR=$RUNNER_TEMP/translation-artifact/checkpoint-group" \
            "BASELINE_CHECKPOINT_DIR=$RUNNER_TEMP/baseline-artifact/checkpoint-group" \
            "CHECKPOINT_UPLOAD_DIR=$RUNNER_TEMP/checkpoint" \
            "BASELINE_UPLOAD_DIR=$RUNNER_TEMP/baseline" \
            "PUBLICATION_SELECTION=$RUNNER_TEMP/publication-selection/publication-selection.json" \
            "RECOVERY_DOWNLOAD_DIR=$RUNNER_TEMP/translation-recovery-download" \
            "RECOVERY_ANALYSIS=$RUNNER_TEMP/recovery-analysis.json" \
            "RECOVERY_OUTPUT_DIR=$RUNNER_TEMP/translation-recovery-output" >> "$GITHUB_ENV"
          suffix=
          if (( ${{ inputs.batch_number }} > 0 )); then suffix="-batch-${{ inputs.batch_number }}"; fi
          echo "ARTIFACT_SUFFIX=$suffix" >> "$GITHUB_ENV"

      - name: Validate immutable inputs
        run: node -e 'if(!["ja-JP","zh-CN-reference"].includes(process.env.TRANSLATION_TARGET))throw new Error("invalid translation target");for(const [n,v] of Object.entries({tooling_sha:process.env.TOOLING_SHA,source_baseline_sha:process.env.SOURCE_BASELINE_SHA,source_checkpoint_sha:process.env.SOURCE_CHECKPOINT_SHA,target_baseline_sha:process.env.TARGET_BASELINE_SHA}))if(!/^[0-9a-f]{40}$/.test(v))throw new Error(n+" must be a lowercase 40-character Git SHA")'
      - name: Check out immutable master tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tooling_sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22.6', cache: pnpm }
      - name: Install current master tooling
        run: pnpm install --frozen-lockfile
      - name: Download translation publication selection
        if: ${{ !inputs.legacy_without_publication_selection }}
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.publication_selection_artifact_name }}
          path: ${{ runner.temp }}/publication-selection
      - name: Validate translation publication selection identity
        if: ${{ !inputs.legacy_without_publication_selection }}
        env:
          PUBLICATION_SELECTION_SHA256: ${{ inputs.publication_selection_sha256 }}
        run: |
          set -euo pipefail
          node scripts/docs-workflow/publication-contracts.js validate-selection "$PUBLICATION_SELECTION"
          node - <<'NODE'
          const fs = require('node:fs')
          const selection = JSON.parse(fs.readFileSync(process.env.PUBLICATION_SELECTION, 'utf8'))
          if (selection.selectionSha256 !== process.env.PUBLICATION_SELECTION_SHA256) throw new Error('publication selection checksum input mismatch')
          const selected = selection.units.find(unit => unit.unitKey === process.env.PUBLICATION_UNIT_KEY)
          if (!selected) throw new Error('publication unit is not selected')
          if (selected.target !== process.env.TRANSLATION_TARGET || selected.group !== process.env.GROUP ||
              selected.toolingSha !== process.env.TOOLING_SHA || selected.sourceBaselineSha !== process.env.SOURCE_BASELINE_SHA ||
              selected.sourceCheckpointSha !== process.env.SOURCE_CHECKPOINT_SHA) throw new Error('selected publication unit identity mismatch')
          if (process.env.ARTIFACT_SUFFIX === '') {
            const checkpoint = `translation-checkpoint-${selected.target}-${selected.group}-${selection.runId}`
            const baseline = `translation-baseline-${selected.target}-${selected.group}-${selection.runId}`
            if (selected.artifacts.checkpoint !== checkpoint || selected.artifacts.baseline !== baseline) throw new Error('selected publication aggregate artifact identity mismatch')
          }
          NODE
      - name: Materialize source checkpoint and baseline
        if: ${{ inputs.should_translate }}
        run: |
          for sha in "$SOURCE_BASELINE_SHA" "$SOURCE_CHECKPOINT_SHA" "$TARGET_BASELINE_SHA"; do git fetch --no-tags origin "$sha"; done
          git merge-base --is-ancestor "$SOURCE_BASELINE_SHA" "$SOURCE_CHECKPOINT_SHA"
          git worktree add --detach "$BASELINE_DIR" "$TARGET_BASELINE_SHA"
          bash scripts/restore-generated-state.sh --exact --ref "$SOURCE_CHECKPOINT_SHA"

      - name: Materialize target baseline translation state
        if: ${{ inputs.should_translate }}
        run: |
          node scripts/translation/materialize-translation-baseline.js \
            --repository "$GITHUB_WORKSPACE" \
            --baseline "$BASELINE_DIR" \
            --target "$TRANSLATION_TARGET" \
            --group "$GROUP"
          case "$TRANSLATION_TARGET" in
            ja-JP) state=.translation-cache/ja-JP.json; empty='{"files":{}}' ;;
            zh-CN-reference) state=generated/zh-CN/manifests/reference-translations.json; empty='{"schemaVersion":1,"records":[]}' ;;
            *) exit 2 ;;
          esac
          mkdir -p "$(dirname "$state")" "$BASELINE_DIR/$(dirname "$state")"
          test -f "$state" || printf '%s\n' "$empty" > "$state"
          test -f "$BASELINE_DIR/$state" || cp "$state" "$BASELINE_DIR/$state"
      - name: Prepare and apply translation reconciliation
        id: source_delta
        if: ${{ inputs.should_translate }}
        run: |
          set -euo pipefail
          mkdir -p tmp
          node scripts/translation/sourceDelta.js --repository "$GITHUB_WORKSPACE" --source-baseline-sha "$SOURCE_BASELINE_SHA" --source-checkpoint-sha "$SOURCE_CHECKPOINT_SHA" --target "$TRANSLATION_TARGET" --group "$GROUP" --output tmp/source-delta.json
          node scripts/translation/prepare-reconciliation-plan.js \
            --repository "$GITHUB_WORKSPACE" --target "$TRANSLATION_TARGET" --group "$GROUP" \
            --tooling-sha "$TOOLING_SHA" --source-baseline-sha "$SOURCE_BASELINE_SHA" \
            --source-checkpoint-sha "$SOURCE_CHECKPOINT_SHA" --target-baseline-sha "$TARGET_BASELINE_SHA" \
            --plan-output tmp/reconciliation-plan.json --review-output tmp/translation-reconciliation-review.json
          node scripts/translation/apply-reconciliation-plan.js \
            --plan tmp/reconciliation-plan.json --result tmp/reconciliation-result.json \
            --workspace "$GITHUB_WORKSPACE" --source-repository "$GITHUB_WORKSPACE" \
            --target-baseline "$BASELINE_DIR" --source-checkpoint-sha "$SOURCE_CHECKPOINT_SHA" \
            --target-baseline-sha "$TARGET_BASELINE_SHA"
          echo "has_mutation=$(node -p "require('./tmp/reconciliation-result.json').status === 'applied' ? 'true' : 'false'")" >> "$GITHUB_OUTPUT"
      - name: Resolve effective translation mode
        id: mode
        if: ${{ inputs.should_translate }}
        env:
          REQUESTED_TRANSLATION_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          effective_mode=$(node scripts/translation/bootstrap-state.js resolve --target "$TRANSLATION_TARGET" --group "$BOOTSTRAP_GROUP" --mode "$REQUESTED_TRANSLATION_MODE" --summary-file tmp/bootstrap-decision.json)
          echo "EFFECTIVE_TRANSLATION_MODE=$effective_mode" >> "$GITHUB_ENV"
          echo "effective_mode=$effective_mode" >> "$GITHUB_OUTPUT"
          echo "bootstrap_status=$(node -p "require('./tmp/bootstrap-decision.json').status")" >> "$GITHUB_OUTPUT"
          node - <<'NODE'
          const fs = require('node:fs')
          const decision = JSON.parse(fs.readFileSync('tmp/bootstrap-decision.json', 'utf8'))
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            `## Translation bootstrap: ${decision.target}/${decision.group}`, '',
            `- Requested mode: ${decision.requestedMode}`,
            `- Effective mode: ${decision.mode}`,
            `- Decision: ${decision.status}`,
            `- Pending records: ${decision.pendingCount || 0}`,
            `- Detail: ${decision.summary}`,
            '',
          ].join('\n'))
          NODE
      - name: Build group translation manifest
        id: manifest
        if: ${{ inputs.should_translate }}
        run: |
          batch_args=()
          reconciliation_args=(--reconciliation-plan tmp/reconciliation-plan.json --reconciliation-plan-artifact "translation-reconciliation-plan-$TRANSLATION_TARGET-$GROUP-${{ github.run_id }}$ARTIFACT_SUFFIX")
          if (( ${{ inputs.batch_number }} > 0 )); then
            batch_args=(--batch-index "${{ inputs.batch_index }}" --batch-size "${{ inputs.batch_size }}" --expected-pending-set-sha256 "${{ inputs.pending_set_sha256 }}")
          fi
          node scripts/translation/manifest.js --target "$TRANSLATION_TARGET" --output tmp/translation-manifest.json --retirement-report tmp/translation-retirement-review.json --max-files "${{ inputs.max_files }}" --group "$GROUP" --source-checkpoint-sha "$SOURCE_CHECKPOINT_SHA" --source-delta tmp/source-delta.json --mode "$EFFECTIVE_TRANSLATION_MODE" "${batch_args[@]}" "${reconciliation_args[@]}"
          echo "count=$(node -p "require('./tmp/translation-manifest.json').items.length")" >> "$GITHUB_OUTPUT"
          if (( ${{ inputs.batch_number }} > 0 )) && [[ "$GROUP" == guides ]]; then
            plan_input_args=()
            plan_input_args=(--plan tmp/reconciliation-plan.json)
            node scripts/docs-workflow/translation-batch-input.js create \
              --manifest tmp/translation-manifest.json \
              "${plan_input_args[@]}" \
              --output tmp/translation-batch-input.json
          fi
      - name: Upload translation retirement review
        if: ${{ always() && inputs.should_translate }}
        uses: actions/upload-artifact@v6
        with:
          name: 'translation-retirement-review-${{ inputs.target }}-${{ inputs.group }}-${{ github.run_id }}-${{ inputs.batch_number }}'
          path: |
            tmp/translation-retirement-review.json
            tmp/translation-reconciliation-review.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Download requested recovery artifacts
        if: ${{ inputs.should_translate && inputs.recovery_bundle_artifact_name == '' && inputs.recovery_run_id != '' && steps.manifest.outputs.count != '0' }}
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: 'translation-recovery-${{ inputs.target }}-${{ inputs.group }}-${{ inputs.recovery_run_id }}-*'
          path: '${{ runner.temp }}/translation-recovery-download'
          github-token: '${{ github.token }}'
          repository: '${{ github.repository }}'
          run-id: '${{ inputs.recovery_run_id }}'
      - name: Download authenticated recovery bundle
        if: ${{ inputs.should_translate && inputs.recovery_bundle_artifact_name != '' && steps.manifest.outputs.count != '0' }}
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.recovery_bundle_artifact_name }}
          path: ${{ runner.temp }}/translation-recovery-bundle
      - name: Authenticate recovery bundle unit
        if: ${{ inputs.should_translate && inputs.recovery_bundle_artifact_name != '' && steps.manifest.outputs.count != '0' }}
        env:
          EXPECTED_RECOVERY_PLAN_SHA256: ${{ inputs.recovery_plan_sha256 }}
        run: |
          node - <<'NODE'
          const crypto = require('node:crypto')
          const fs = require('node:fs')
          const path = require('node:path')
          const root = `${process.env.RUNNER_TEMP}/translation-recovery-bundle`
          const planFile = path.join(root, 'recovery-plan.json')
          const bytes = fs.readFileSync(planFile)
          const digest = crypto.createHash('sha256').update(bytes).digest('hex')
          if (digest !== process.env.EXPECTED_RECOVERY_PLAN_SHA256) throw new Error('recovery plan checksum mismatch')
          const plan = JSON.parse(bytes)
          if (plan.schemaVersion !== 2 || plan.provenance?.schemaVersion !== 2) throw new Error('recovery plan schema identity mismatch')
          if (plan.provenance?.executionToolingSha !== process.env.TOOLING_SHA) throw new Error('recovery plan execution tooling identity mismatch')
          const identity = `${process.env.TRANSLATION_TARGET}/${process.env.GROUP}`
          const selected = plan.recoveryMap?.[identity]
          if (!selected || selected.unitToken !== identity.replaceAll('/', '-') || !Array.isArray(selected.artifacts)) throw new Error('recovery artifact identity is not selected in recoveryMap')
          if (selected.artifacts.length === 0) throw new Error('authenticated recovery artifacts are missing for pending work; stopping before model invocation')
          fs.rmSync(process.env.RECOVERY_DOWNLOAD_DIR, {recursive: true, force: true})
          fs.mkdirSync(process.env.RECOVERY_DOWNLOAD_DIR, {recursive: true})
          for (const artifact of selected.artifacts) {
            if (!Number.isSafeInteger(artifact.artifactId) || artifact.artifactId < 1 || !/^sha256:[0-9a-f]{64}$/.test(artifact.artifactDigest || '') || !Number.isSafeInteger(artifact.batchNumber) || artifact.batchNumber < 0) throw new Error('recovery artifact identity is invalid')
            const source = path.join(root, 'artifacts', selected.unitToken, `batch-${artifact.batchNumber}`)
            const destination = path.join(process.env.RECOVERY_DOWNLOAD_DIR, `artifact-${artifact.artifactId}`)
            const stat = fs.lstatSync(source)
            if (!stat.isDirectory() || stat.isSymbolicLink()) throw new Error('recovery artifact identity payload is missing')
            fs.cpSync(source, destination, {recursive: true, dereference: false, errorOnExist: true})
          }
          NODE
      - name: Resolve current recovery compatibility
        if: ${{ inputs.should_translate && (inputs.recovery_bundle_artifact_name != '' || inputs.recovery_run_id != '') && steps.manifest.outputs.count != '0' }}
        env:
          TRANSLATION_AGENT_MODEL: ${{ vars.TRANSLATION_AGENT_MODEL }}
          TRANSLATION_CHUNK_TARGET_CHARS: ${{ inputs.group == 'guides' && '8000' || '16000' }}
          TRANSLATION_CHUNK_MAX_CHARS: ${{ inputs.group == 'guides' && '12000' || '24000' }}
        run: |
          set -euo pipefail
          node scripts/translation/recovery-preflight.js \
            --manifest tmp/translation-manifest.json \
            --recovery-dir "$RECOVERY_DOWNLOAD_DIR" \
            --output "$RECOVERY_ANALYSIS" \
            --execution-tooling-sha "$TOOLING_SHA" \
            --allow-full-retranslate "${{ inputs.allow_full_retranslate }}"
          node - <<'NODE'
          const fs = require('node:fs')
          const analysis = JSON.parse(fs.readFileSync(process.env.RECOVERY_ANALYSIS, 'utf8'))
          const reasons = analysis.rejected.length
            ? analysis.rejected.map(item => `- ${item.sourcePath}: ${item.reason}`)
            : ['- None']
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            `## Recovery compatibility: ${analysis.target}/${analysis.group}`, '',
            `- Current candidates: ${analysis.candidateCount}`,
            `- Recovered now: ${analysis.recoveredCount}`,
            `- Pending provider work: ${analysis.pendingCount}`,
            `- Rejected retained records: ${analysis.rejectedCount}`,
            `- Resumable files: ${analysis.resumableFileCount}`,
            `- Recovered chunks: ${analysis.recoveredChunkCount}`,
            `- Rejected chunks: ${analysis.rejectedChunkCount}`,
            `- Full retranslation: ${analysis.fullRetranslation}`,
            '', '### Compatibility reasons', ...reasons, '',
          ].join('\n'))
          NODE
      - name: Run translation agents
        id: agents
        if: ${{ inputs.should_translate && steps.manifest.outputs.count != '0' }}
        run: |
          set -euo pipefail
          args=(--manifest tmp/translation-manifest.json --report tmp/translation-report.json)
          if [[ -f "$RECOVERY_ANALYSIS" ]]; then
            args+=(--recovery-analysis "$RECOVERY_ANALYSIS")
          elif [[ -d "$RECOVERY_DOWNLOAD_DIR" ]]; then
            args+=(--recovery-dir "$RECOVERY_DOWNLOAD_DIR")
          fi
          node scripts/translation/agentRunner.js "${args[@]}"
        env:
          TRANSLATION_AGENT_API_KEY: ${{ secrets.TRANSLATION_AGENT_API_KEY }}
          TRANSLATION_AGENT_BASE_URL: ${{ vars.TRANSLATION_AGENT_BASE_URL }}
          TRANSLATION_AGENT_MODEL: ${{ vars.TRANSLATION_AGENT_MODEL }}
          REVIEW_AGENT_API_KEY: ${{ secrets.REVIEW_AGENT_API_KEY }}
          REVIEW_AGENT_BASE_URL: ${{ vars.REVIEW_AGENT_BASE_URL }}
          REVIEW_AGENT_MODEL: ${{ vars.REVIEW_AGENT_MODEL }}
          TRANSLATION_ALLOW_PARTIAL: "true"
          TRANSLATION_CONCURRENCY: ${{ inputs.group == 'guides' && '1' || inputs.target == 'zh-CN-reference' && '2' || '4' }}
          TRANSLATION_CHUNK_TARGET_CHARS: ${{ inputs.group == 'guides' && '8000' || '16000' }}
          TRANSLATION_CHUNK_MAX_CHARS: ${{ inputs.group == 'guides' && '12000' || '24000' }}
      - name: Create per-file recovery artifact
        if: ${{ always() && inputs.should_translate && steps.manifest.outputs.count != '0' }}
        run: >-
          node scripts/translation/recovery-artifact.js create
          --report tmp/translation-report.json
          --output "$RECOVERY_OUTPUT_DIR"
          --target "$TRANSLATION_TARGET"
          --group "$GROUP"
          --source-sha "$SOURCE_CHECKPOINT_SHA"
          --tooling-sha "$TOOLING_SHA"
          --model "$TRANSLATION_AGENT_MODEL"
        env:
          TRANSLATION_AGENT_MODEL: ${{ vars.TRANSLATION_AGENT_MODEL }}
      - name: Upload per-file recovery artifact
        if: ${{ always() && inputs.should_translate && steps.manifest.outputs.count != '0' }}
        uses: actions/upload-artifact@v6
        with:
          name: 'translation-recovery-${{ inputs.target }}-${{ inputs.group }}-${{ github.run_id }}-${{ inputs.batch_number }}'
          path: '${{ runner.temp }}/translation-recovery-output'
          if-no-files-found: error
          retention-days: 30
      - name: Validate unbatched translated group
        id: unbatched_validation
        if: ${{ inputs.should_translate && inputs.batch_number == 0 && ((steps.agents.outputs.translated_count || '0') != '0' || (steps.agents.outputs.failed_count || '0') != '0' || steps.source_delta.outputs.has_mutation == 'true' || steps.mode.outputs.bootstrap_status == 'safe_repair') }}
        env:
          AGENTS_OUTCOME: ${{ steps.agents.outcome }}
          TRANSLATED_COUNT: ${{ steps.agents.outputs.translated_count || '0' }}
          FAILED_COUNT: ${{ steps.agents.outputs.failed_count || '0' }}
          REMAINING_COUNT: ${{ steps.agents.outputs.remaining_count || '0' }}
          ZDOC_PROVENANCE_CANDIDATE_TARGET: ${{ inputs.target }}
          ZDOC_PROVENANCE_CANDIDATE_TOOLING_SHA: ${{ inputs.tooling_sha }}
          ZDOC_PROVENANCE_CANDIDATE_SOURCE_SHA: ${{ inputs.source_checkpoint_sha }}
        run: |
          set -euo pipefail
          node scripts/docs-workflow/validate-unbatched-translation-outputs.js \
            --manifest tmp/translation-manifest.json \
            --report tmp/translation-report.json \
            --workspace "$GITHUB_WORKSPACE" \
            --baseline "$BASELINE_DIR" \
            --agents-outcome "$AGENTS_OUTCOME" \
            --translated-count "$TRANSLATED_COUNT" \
            --failed-count "$FAILED_COUNT" \
            --remaining-count "$REMAINING_COUNT"
          if [[ "$TRANSLATION_TARGET" == ja-JP && "$FAILED_COUNT" != 0 ]]; then
            node scripts/translation/validate-group.js --target "$TRANSLATION_TARGET" --group "$GROUP" --allow-pending
          else
            node scripts/translation/validate-group.js --target "$TRANSLATION_TARGET" --group "$GROUP"
          fi
      - name: Validate translated batch outputs
        if: ${{ inputs.should_translate && inputs.group == 'guides' && inputs.batch_number > 0 && ((steps.agents.outputs.translated_count || '0') != '0' || (steps.agents.outputs.failed_count || '0') != '0' || steps.source_delta.outputs.has_mutation == 'true') }}
        env:
          AGENTS_OUTCOME: ${{ steps.agents.outcome }}
          TRANSLATED_COUNT: ${{ steps.agents.outputs.translated_count || '0' }}
          FAILED_COUNT: ${{ steps.agents.outputs.failed_count || '0' }}
          REMAINING_COUNT: ${{ steps.agents.outputs.remaining_count || '0' }}
        run: |
          set -euo pipefail
          node scripts/docs-workflow/translation-batch-input.js validate --input tmp/translation-batch-input.json
          node scripts/docs-workflow/validate-translation-batch-outputs.js \
            --manifest tmp/translation-manifest.json \
            --report tmp/translation-report.json \
            --batch-input tmp/translation-batch-input.json \
            --workspace "$GITHUB_WORKSPACE" \
            --baseline "$BASELINE_DIR" \
            --agents-outcome "$AGENTS_OUTCOME" \
            --translated-count "$TRANSLATED_COUNT" \
            --failed-count "$FAILED_COUNT" \
            --remaining-count "$REMAINING_COUNT"
      - name: Mark completed translation bootstrap
        if: ${{ inputs.should_translate && inputs.batch_number == 0 && (steps.mode.outputs.effective_mode == 'full' || steps.mode.outputs.bootstrap_status == 'safe_repair') && (steps.agents.outputs.remaining_count || '0') == '0' && steps.unbatched_validation.outcome == 'success' && inputs.target != 'ja-JP' }}
        run: node scripts/translation/bootstrap-state.js mark --target "$TRANSLATION_TARGET" --group "$BOOTSTRAP_GROUP"
      - name: Regenerate selected Chinese Reference sidebar
        if: ${{ inputs.should_translate && inputs.target == 'zh-CN-reference' && inputs.batch_number == 0 && (steps.agents.outputs.failed_count || '0') == '0' && (steps.agents.outputs.remaining_count || '0') == '0' && steps.agents.outcome == 'success' }}
        run: pnpm docs-tooling reference-sidebar --group "$GROUP" --write
      - name: Create validated translation checkpoints
        id: checkpoint
        if: ${{ inputs.should_translate && ((inputs.batch_number == 0 && (steps.agents.outcome == 'success' || steps.agents.outcome == 'skipped')) || (steps.agents.outputs.translated_count || '0') != '0' || (steps.agents.outputs.failed_count || '0') != '0' || steps.source_delta.outputs.has_mutation == 'true') }}
        run: |
          batch_args=()
          batch_input_args=()
          if (( ${{ inputs.batch_number }} > 0 )); then
            batch_args=(--batch-index "${{ inputs.batch_index }}" --batch-number "${{ inputs.batch_number }}" --batch-count "${{ inputs.batch_count }}" --batch-size "${{ inputs.batch_size }}" --pending-count "${{ inputs.pending_count }}" --pending-set-sha256 "${{ inputs.pending_set_sha256 }}")
            if [[ "$GROUP" == guides ]]; then batch_input_args=(--batch-input tmp/translation-batch-input.json); fi
          fi
          identity_args=(--translation-target "$TRANSLATION_TARGET" --source-site en --target-site "$([[ "$TRANSLATION_TARGET" == ja-JP ]] && echo en || echo zh-CN)" --source-checkpoint-sha "$SOURCE_CHECKPOINT_SHA" --tooling-sha "$TOOLING_SHA")
          baseline_reconciliation_args=(--reconciliation-plan "$GITHUB_WORKSPACE/tmp/reconciliation-plan.json")
          checkpoint_reconciliation_args=(--reconciliation-plan "$GITHUB_WORKSPACE/tmp/reconciliation-plan.json" --reconciliation-result "$GITHUB_WORKSPACE/tmp/reconciliation-result.json")
          node scripts/docs-workflow/create-checkpoint-artifact.js --group "$GROUP" --master-sha "$TOOLING_SHA" --dev-baseline-sha "$SOURCE_CHECKPOINT_SHA" --baseline-dir "$BASELINE_DIR" --workspace "$BASELINE_DIR" --output "$BASELINE_CHECKPOINT_DIR" --include-translation-cache "${identity_args[@]}" "${batch_args[@]}" "${batch_input_args[@]}" "${baseline_reconciliation_args[@]}"
          node scripts/docs-workflow/create-checkpoint-artifact.js --group "$GROUP" --master-sha "$TOOLING_SHA" --dev-baseline-sha "$SOURCE_CHECKPOINT_SHA" --baseline-dir "$BASELINE_DIR" --workspace "$GITHUB_WORKSPACE" --output "$CHECKPOINT_DIR" --include-translation-cache "${identity_args[@]}" "${batch_args[@]}" "${batch_input_args[@]}" "${checkpoint_reconciliation_args[@]}"
          node scripts/docs-workflow/validate-checkpoint-artifact.js --artifact "$BASELINE_CHECKPOINT_DIR" --group "$GROUP" --master-sha "$TOOLING_SHA" --dev-baseline-sha "$SOURCE_CHECKPOINT_SHA" --translation-target "$TRANSLATION_TARGET" --source-checkpoint-sha "$SOURCE_CHECKPOINT_SHA" --tooling-sha "$TOOLING_SHA"
          node scripts/docs-workflow/validate-checkpoint-artifact.js --artifact "$CHECKPOINT_DIR" --group "$GROUP" --master-sha "$TOOLING_SHA" --dev-baseline-sha "$SOURCE_CHECKPOINT_SHA" --translation-target "$TRANSLATION_TARGET" --source-checkpoint-sha "$SOURCE_CHECKPOINT_SHA" --tooling-sha "$TOOLING_SHA"
          if (( ${{ inputs.batch_number }} > 0 )) && [[ "$GROUP" == guides ]]; then
            node scripts/docs-workflow/validate-translation-batch.js \
              --artifact "$CHECKPOINT_DIR" \
              --baseline "$BASELINE_CHECKPOINT_DIR" \
              --batch-number "${{ inputs.batch_number }}" \
              --batch-count "${{ inputs.batch_count }}"
          fi
          mkdir -p "$CHECKPOINT_UPLOAD_DIR" "$BASELINE_UPLOAD_DIR"
          tar --dereference -cf "$CHECKPOINT_UPLOAD_DIR/checkpoint-group.tar" -C "$(dirname "$CHECKPOINT_DIR")" "$(basename "$CHECKPOINT_DIR")"
          tar --dereference -cf "$BASELINE_UPLOAD_DIR/checkpoint-group.tar" -C "$(dirname "$BASELINE_CHECKPOINT_DIR")" "$(basename "$BASELINE_CHECKPOINT_DIR")"
          cp "$CHECKPOINT_DIR/manifest.json" "$CHECKPOINT_UPLOAD_DIR/manifest.json"
          cp "$BASELINE_CHECKPOINT_DIR/manifest.json" "$BASELINE_UPLOAD_DIR/manifest.json"
      - name: Upload translation report
        if: ${{ always() }}
        run: node scripts/translation/reportSummary.js --manifest tmp/translation-manifest.json --report tmp/translation-report.json --output tmp/translation-report.md
        continue-on-error: true
      - name: Archive translation report
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with: { name: 'translation-report-${{ inputs.target }}-${{ inputs.group }}-${{ github.run_id }}${{ env.ARTIFACT_SUFFIX }}', path: 'tmp/translation-report*', if-no-files-found: ignore }
      - name: Upload translation checkpoint
        id: translation_upload
        if: ${{ steps.checkpoint.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with: { name: 'translation-checkpoint-${{ inputs.target }}-${{ inputs.group }}-${{ github.run_id }}${{ env.ARTIFACT_SUFFIX }}', path: '${{ runner.temp }}/checkpoint/checkpoint-group.tar', retention-days: '${{ inputs.artifact_retention_days }}' }
      - name: Upload translation baseline
        id: baseline_upload
        if: ${{ steps.checkpoint.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with: { name: 'translation-baseline-${{ inputs.target }}-${{ inputs.group }}-${{ github.run_id }}${{ env.ARTIFACT_SUFFIX }}', path: '${{ runner.temp }}/baseline/checkpoint-group.tar', retention-days: '${{ inputs.artifact_retention_days }}' }
      - name: Create immutable Translation ready descriptor
        id: publication_ready
        if: ${{ !inputs.legacy_without_publication_selection && inputs.batch_number == 0 && steps.translation_upload.outcome == 'success' && steps.baseline_upload.outcome == 'success' }}
        run: |
          set -euo pipefail
          unit_token=${PUBLICATION_UNIT_KEY//\//-}
          node scripts/docs-workflow/translation-publication-selection.js ready \
            --selection "$RUNNER_TEMP/publication-selection/publication-selection.json" \
            --unit-key "$PUBLICATION_UNIT_KEY" \
            --checkpoint-archive "$RUNNER_TEMP/checkpoint/checkpoint-group.tar" \
            --checkpoint-manifest "$RUNNER_TEMP/checkpoint/manifest.json" \
            --baseline-archive "$RUNNER_TEMP/baseline/checkpoint-group.tar" \
            --baseline-manifest "$RUNNER_TEMP/baseline/manifest.json" \
            --output "$RUNNER_TEMP/publication-ready/publication-ready.json"
          echo "artifact_name=publication-ready-translation-$unit_token-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Upload immutable Translation ready descriptor
        if: ${{ !inputs.legacy_without_publication_selection && inputs.batch_number == 0 && steps.translation_upload.outcome == 'success' && steps.baseline_upload.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.publication_ready.outputs.artifact_name }}
          path: ${{ runner.temp }}/publication-ready/publication-ready.json
          if-no-files-found: error
      - name: Emit translation result
        id: result
        if: ${{ always() }}
        run: |
          status=failed; artifact_name=; baseline_artifact_name=; candidate_count="${{ steps.manifest.outputs.count || '0' }}"; translated_count="${{ steps.agents.outputs.translated_count || '0' }}"; failed_count="${{ steps.agents.outputs.failed_count || '0' }}"; remaining_count="${{ steps.agents.outputs.remaining_count || '0' }}"
          if [[ "${{ inputs.should_translate }}" != true ]]; then status=no_changes
          elif [[ ( "${{ steps.agents.outcome }}" == success || "${{ steps.agents.outcome }}" == skipped ) && "${{ steps.translation_upload.outcome }}" == success && "${{ steps.baseline_upload.outcome }}" == success && "$candidate_count" =~ ^(0|[1-9][0-9]*)$ && "$translated_count" =~ ^(0|[1-9][0-9]*)$ && "$failed_count" =~ ^(0|[1-9][0-9]*)$ && "$remaining_count" =~ ^(0|[1-9][0-9]*)$ ]] && (( remaining_count == 0 && translated_count + failed_count == candidate_count )); then status=translation_ready; artifact_name="translation-checkpoint-$TRANSLATION_TARGET-$GROUP-${{ github.run_id }}$ARTIFACT_SUFFIX"; baseline_artifact_name="translation-baseline-$TRANSLATION_TARGET-$GROUP-${{ github.run_id }}$ARTIFACT_SUFFIX"; fi
          reconciliation_plan_sha256=; reconciliation_result_sha256=
          if [[ -f tmp/reconciliation-plan.json ]]; then reconciliation_plan_sha256=$(node -p "require('./tmp/reconciliation-plan.json').planSha256"); fi
          if [[ -f tmp/reconciliation-result.json ]]; then reconciliation_result_sha256=$(node -p "require('./tmp/reconciliation-result.json').resultSha256"); fi
          printf 'status=%s\nartifact_name=%s\nbaseline_artifact_name=%s\ntranslated_count=%s\nfailed_count=%s\nremaining_count=%s\nreconciliation_plan_sha256=%s\nreconciliation_result_sha256=%s\n' "$status" "$artifact_name" "$baseline_artifact_name" "$translated_count" "$failed_count" "$remaining_count" "$reconciliation_plan_sha256" "$reconciliation_result_sha256" >> "$GITHUB_OUTPUT"
      - name: Fail unsuccessful translation
        if: ${{ always() && steps.result.outputs.status == 'failed' }}
        run: exit 1
