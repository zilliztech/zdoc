name: translate docs content group

on:
  workflow_call:
    inputs:
      group: { required: true, type: string }
      source_commit_sha: { required: true, type: string }
      master_sha: { required: true, type: string }
      should_translate: { required: true, type: boolean }
      max_files: { required: false, type: string, default: '500' }
      batch_index: { required: false, type: number, default: -1 }
      batch_number: { required: false, type: number, default: 0 }
      batch_count: { required: false, type: number, default: 0 }
      batch_size: { required: false, type: number, default: 0 }
      pending_count: { required: false, type: number, default: 0 }
      pending_set_sha256: { required: false, type: string, default: '' }
      artifact_retention_days: { required: false, type: number, default: 3 }
    outputs:
      status: { value: '${{ jobs.translate.outputs.status }}' }
      artifact_name: { value: '${{ jobs.translate.outputs.artifact_name }}' }
      baseline_artifact_name: { value: '${{ jobs.translate.outputs.baseline_artifact_name }}' }
      translated_count: { value: '${{ jobs.translate.outputs.translated_count }}' }
      failed_count: { value: '${{ jobs.translate.outputs.failed_count }}' }
      remaining_count: { value: '${{ jobs.translate.outputs.remaining_count }}' }
    secrets:
      TRANSLATION_AGENT_API_KEY: { required: true }
      REVIEW_AGENT_API_KEY: { required: true }

permissions:
  actions: read
  contents: read

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      status: ${{ steps.result.outputs.status }}
      artifact_name: ${{ steps.result.outputs.artifact_name }}
      baseline_artifact_name: ${{ steps.result.outputs.baseline_artifact_name }}
      translated_count: ${{ steps.result.outputs.translated_count }}
      failed_count: ${{ steps.result.outputs.failed_count }}
      remaining_count: ${{ steps.result.outputs.remaining_count }}
    env:
      GROUP: ${{ inputs.group }}
      SOURCE_COMMIT_SHA: ${{ inputs.source_commit_sha }}
      MASTER_SHA: ${{ inputs.master_sha }}
    steps:
      - name: Initialize temporary paths
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${RUNNER_TEMP:-}" && "$RUNNER_TEMP" == /* ]] || { echo "RUNNER_TEMP must be a non-empty absolute path" >&2; exit 1; }
          printf '%s\n' \
            "BASELINE_DIR=$RUNNER_TEMP/translation-source-baseline" \
            "CHECKPOINT_DIR=$RUNNER_TEMP/translation-artifact/checkpoint-group" \
            "BASELINE_CHECKPOINT_DIR=$RUNNER_TEMP/baseline-artifact/checkpoint-group" >> "$GITHUB_ENV"
          suffix=
          if (( ${{ inputs.batch_number }} > 0 )); then suffix="-batch-${{ inputs.batch_number }}"; fi
          echo "ARTIFACT_SUFFIX=$suffix" >> "$GITHUB_ENV"

      - name: Validate immutable inputs
        run: node -e 'for(const [n,v] of Object.entries({master_sha:process.env.MASTER_SHA,source_commit_sha:process.env.SOURCE_COMMIT_SHA}))if(!/^[0-9a-f]{40}$/.test(v))throw new Error(`${n} must be a lowercase 40-character Git SHA`)'
      - name: Check out immutable master tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.master_sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: pnpm }
      - name: Install current master tooling
        run: pnpm install --frozen-lockfile
      - name: Materialize source checkpoint and baseline
        if: ${{ inputs.should_translate }}
        run: |
          git fetch --no-tags origin "$SOURCE_COMMIT_SHA"
          git worktree add --detach "$BASELINE_DIR" "$SOURCE_COMMIT_SHA"
          bash scripts/restore-generated-state.sh --exact --ref "$SOURCE_COMMIT_SHA"
          git cat-file -e "$SOURCE_COMMIT_SHA^" 2>/dev/null || git fetch --no-tags --depth=2 origin "$SOURCE_COMMIT_SHA"
          git cat-file -e "$SOURCE_COMMIT_SHA^"
          mkdir -p .translation-cache "$BASELINE_DIR/.translation-cache"
          test -f .translation-cache/ja-JP.json || printf '{"files":{}}\n' > .translation-cache/ja-JP.json
          test -f "$BASELINE_DIR/.translation-cache/ja-JP.json" || cp .translation-cache/ja-JP.json "$BASELINE_DIR/.translation-cache/ja-JP.json"
      - name: Apply source translation delta
        id: source_delta
        if: ${{ inputs.should_translate }}
        run: |
          set -euo pipefail
          mkdir -p tmp
          git diff --name-status "$SOURCE_COMMIT_SHA^" "$SOURCE_COMMIT_SHA" > tmp/source-name-status.txt
          node scripts/translation/sourceDelta.js --group "$GROUP" --name-status tmp/source-name-status.txt --output tmp/source-delta.json
          node scripts/translation/applySourceDelta.js --delta tmp/source-delta.json --report tmp/source-delta-report.json
          echo "has_mutation=$(node -p "require('./tmp/source-delta-report.json').hasTranslationMutation ? 'true' : 'false'")" >> "$GITHUB_OUTPUT"
      - name: Build group translation manifest
        id: manifest
        if: ${{ inputs.should_translate }}
        run: |
          batch_args=()
          if (( ${{ inputs.batch_number }} > 0 )); then
            batch_args=(--batch-index "${{ inputs.batch_index }}" --batch-size "${{ inputs.batch_size }}" --expected-pending-set-sha256 "${{ inputs.pending_set_sha256 }}")
          fi
          node scripts/translation/manifest.js --locale ja-JP --output tmp/translation-manifest.json --max-files "${{ inputs.max_files }}" --group "$GROUP" --source-checkpoint-sha "$SOURCE_COMMIT_SHA" --source-delta tmp/source-delta.json "${batch_args[@]}"
          echo "count=$(node -p "require('./tmp/translation-manifest.json').items.length")" >> "$GITHUB_OUTPUT"
          if (( ${{ inputs.batch_number }} > 0 )) && [[ "$GROUP" == guides ]]; then
            node scripts/docs-workflow/translation-batch-input.js create \
              --manifest tmp/translation-manifest.json \
              --output tmp/translation-batch-input.json
          fi
      - name: Run translation agents
        id: agents
        if: ${{ inputs.should_translate && steps.manifest.outputs.count != '0' }}
        run: node scripts/translation/agentRunner.js --manifest tmp/translation-manifest.json --report tmp/translation-report.json
        env:
          TRANSLATION_AGENT_API_KEY: ${{ secrets.TRANSLATION_AGENT_API_KEY }}
          TRANSLATION_AGENT_BASE_URL: ${{ vars.TRANSLATION_AGENT_BASE_URL }}
          TRANSLATION_AGENT_MODEL: ${{ vars.TRANSLATION_AGENT_MODEL }}
          REVIEW_AGENT_API_KEY: ${{ secrets.REVIEW_AGENT_API_KEY }}
          REVIEW_AGENT_BASE_URL: ${{ vars.REVIEW_AGENT_BASE_URL }}
          REVIEW_AGENT_MODEL: ${{ vars.REVIEW_AGENT_MODEL }}
          TRANSLATION_ALLOW_PARTIAL: "true"
      - name: Validate unbatched translated group
        if: ${{ inputs.should_translate && inputs.batch_number == 0 && ((steps.agents.outputs.translated_count || '0') != '0' || (steps.agents.outputs.failed_count || '0') != '0' || steps.source_delta.outputs.has_mutation == 'true') }}
        run: |
          case "$GROUP" in
            guides) for d in i18n/ja-JP/docusaurus-plugin-content-docs/current/tutorials i18n/ja-JP/docusaurus-plugin-content-docs-byoc/current/tutorials; do test ! -d "$d" || npx docusaurus mdx-parse -d "$d"; done ;;
            *) test ! -d i18n/ja-JP/docusaurus-plugin-content-docs-reference/current || npx docusaurus mdx-parse -d i18n/ja-JP/docusaurus-plugin-content-docs-reference/current ;;
          esac
          node scripts/validate-translated-coverage.js --group "$GROUP"
          pnpm run build
      - name: Validate translated batch outputs
        if: ${{ inputs.should_translate && inputs.group == 'guides' && inputs.batch_number > 0 && ((steps.agents.outputs.translated_count || '0') != '0' || (steps.agents.outputs.failed_count || '0') != '0' || steps.source_delta.outputs.has_mutation == 'true') }}
        env:
          AGENTS_OUTCOME: ${{ steps.agents.outcome }}
          TRANSLATED_COUNT: ${{ steps.agents.outputs.translated_count || '0' }}
          FAILED_COUNT: ${{ steps.agents.outputs.failed_count || '0' }}
          REMAINING_COUNT: ${{ steps.agents.outputs.remaining_count || '0' }}
        run: |
          set -euo pipefail
          node scripts/docs-workflow/translation-batch-input.js validate --input tmp/translation-batch-input.json
          node scripts/docs-workflow/validate-translation-batch-outputs.js \
            --manifest tmp/translation-manifest.json \
            --report tmp/translation-report.json \
            --batch-input tmp/translation-batch-input.json \
            --workspace "$GITHUB_WORKSPACE" \
            --agents-outcome "$AGENTS_OUTCOME" \
            --translated-count "$TRANSLATED_COUNT" \
            --failed-count "$FAILED_COUNT" \
            --remaining-count "$REMAINING_COUNT"
      - name: Create validated translation checkpoints
        id: checkpoint
        if: ${{ inputs.should_translate && ((steps.agents.outputs.translated_count || '0') != '0' || (steps.agents.outputs.failed_count || '0') != '0' || steps.source_delta.outputs.has_mutation == 'true') }}
        run: |
          batch_args=()
          batch_input_args=()
          validation_args=()
          if (( ${{ inputs.batch_number }} > 0 )); then
            batch_args=(--batch-index "${{ inputs.batch_index }}" --batch-number "${{ inputs.batch_number }}" --batch-count "${{ inputs.batch_count }}" --batch-size "${{ inputs.batch_size }}" --pending-count "${{ inputs.pending_count }}" --pending-set-sha256 "${{ inputs.pending_set_sha256 }}")
            if [[ "$GROUP" == guides ]]; then batch_input_args=(--batch-input tmp/translation-batch-input.json); fi
          fi
          if (( ${{ inputs.batch_number }} == 0 )); then validation_args=(--validation-command "pnpm run build"); fi
          node scripts/docs-workflow/create-checkpoint-artifact.js --group "$GROUP" --master-sha "$MASTER_SHA" --dev-baseline-sha "$SOURCE_COMMIT_SHA" --baseline-dir "$BASELINE_DIR" --workspace "$BASELINE_DIR" --output "$BASELINE_CHECKPOINT_DIR" --include-translation-cache "${batch_args[@]}" "${batch_input_args[@]}"
          node scripts/docs-workflow/create-checkpoint-artifact.js --group "$GROUP" --master-sha "$MASTER_SHA" --dev-baseline-sha "$SOURCE_COMMIT_SHA" --baseline-dir "$BASELINE_DIR" --workspace "$GITHUB_WORKSPACE" --output "$CHECKPOINT_DIR" --include-translation-cache "${batch_args[@]}" "${batch_input_args[@]}" "${validation_args[@]}"
          node scripts/docs-workflow/validate-checkpoint-artifact.js --artifact "$BASELINE_CHECKPOINT_DIR" --group "$GROUP" --master-sha "$MASTER_SHA" --dev-baseline-sha "$SOURCE_COMMIT_SHA"
          node scripts/docs-workflow/validate-checkpoint-artifact.js --artifact "$CHECKPOINT_DIR" --group "$GROUP" --master-sha "$MASTER_SHA" --dev-baseline-sha "$SOURCE_COMMIT_SHA"
          if (( ${{ inputs.batch_number }} > 0 )) && [[ "$GROUP" == guides ]]; then
            node scripts/docs-workflow/validate-translation-batch.js \
              --artifact "$CHECKPOINT_DIR" \
              --baseline "$BASELINE_CHECKPOINT_DIR" \
              --batch-number "${{ inputs.batch_number }}" \
              --batch-count "${{ inputs.batch_count }}"
          fi
          mkdir -p "$RUNNER_TEMP/baseline-upload" "$RUNNER_TEMP/translation-upload"
          tar --dereference -cf "$RUNNER_TEMP/baseline-upload/checkpoint-group.tar" -C "$(dirname "$BASELINE_CHECKPOINT_DIR")" "$(basename "$BASELINE_CHECKPOINT_DIR")"
          tar --dereference -cf "$RUNNER_TEMP/translation-upload/checkpoint-group.tar" -C "$(dirname "$CHECKPOINT_DIR")" "$(basename "$CHECKPOINT_DIR")"
      - name: Upload baseline checkpoint
        id: baseline_upload
        if: ${{ steps.checkpoint.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with: { name: 'translation-baseline-${{ inputs.group }}-${{ github.run_id }}${{ env.ARTIFACT_SUFFIX }}', path: '${{ runner.temp }}/baseline-upload/checkpoint-group.tar', retention-days: '${{ inputs.artifact_retention_days }}' }
      - name: Upload translation checkpoint
        id: translation_upload
        if: ${{ steps.checkpoint.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with: { name: 'translation-checkpoint-${{ inputs.group }}-${{ github.run_id }}${{ env.ARTIFACT_SUFFIX }}', path: '${{ runner.temp }}/translation-upload/checkpoint-group.tar', retention-days: '${{ inputs.artifact_retention_days }}' }
      - name: Upload translation report
        if: ${{ always() }}
        run: node scripts/translation/reportSummary.js --manifest tmp/translation-manifest.json --report tmp/translation-report.json --output tmp/translation-report.md
        continue-on-error: true
      - name: Archive translation report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with: { name: 'translation-report-${{ inputs.group }}-${{ github.run_id }}${{ env.ARTIFACT_SUFFIX }}', path: 'tmp/translation-report*', if-no-files-found: ignore }
      - name: Emit translation result
        id: result
        if: ${{ always() }}
        run: |
          status=failed; artifact_name=; baseline_artifact_name=; translated_count="${{ steps.agents.outputs.translated_count || '0' }}"; failed_count="${{ steps.agents.outputs.failed_count || '0' }}"; remaining_count="${{ steps.agents.outputs.remaining_count || '0' }}"
          if [[ "${{ inputs.should_translate }}" != true || ( "${{ steps.manifest.outputs.count || '0' }}" == 0 && "${{ steps.source_delta.outputs.has_mutation || 'false' }}" != true ) ]]; then status=no_changes
          elif [[ "${{ steps.translation_upload.outcome }}" == success && "${{ steps.baseline_upload.outcome }}" == success ]]; then status=translation_ready; artifact_name="translation-checkpoint-$GROUP-${{ github.run_id }}$ARTIFACT_SUFFIX"; baseline_artifact_name="translation-baseline-$GROUP-${{ github.run_id }}$ARTIFACT_SUFFIX"; fi
          printf 'status=%s\nartifact_name=%s\nbaseline_artifact_name=%s\ntranslated_count=%s\nfailed_count=%s\nremaining_count=%s\n' "$status" "$artifact_name" "$baseline_artifact_name" "$translated_count" "$failed_count" "$remaining_count" >> "$GITHUB_OUTPUT"
      - name: Fail unsuccessful translation
        if: ${{ always() && steps.result.outputs.status == 'failed' }}
        run: exit 1
