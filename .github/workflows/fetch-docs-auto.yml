name: "fetch lark docs (auto)"
on:
  schedule:
  - cron: "0 2,10,18 * * *"  # Every day at 2, 10, and 18 hours UTC
  push:
    branches:
      - "dev"
    paths:
      - ".github/workflows/fetch-docs-auto.yml"

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      DOCS_BUILD_ENV: uat
      DOCS_PUBLISH_URL: https://docs.cloud-uat3.zilliz.com
      LINK_CHECKS_REMOTE_BASE_URL: https://docs.zilliz.com
    outputs:
      card_id: ${{ steps.card.outputs.card_id }}
      card_started_at: ${{ steps.card.outputs.card_started_at }}
      card_stages: ${{ steps.card.outputs.card_stages }}
      card_title: ${{ steps.card.outputs.card_title }}
    steps:
    - name: get current date
      id: date
      run: echo "::set-output name=date::$(date +'%Y%m%d')"
    - name: checkout repo
      uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 9
    - name: set up Environment
      uses: actions/setup-node@v4.0.1
      with:
        node-version: lts/*
        cache: 'pnpm'
    - name: install deps & create progress card
      id: card
      run: |
        pnpm install --frozen-lockfile
        npx docusaurus report-to-lark --card-create \
          --title "Global Docs Build" \
          --stages "Fetch EN docs,Build and check EN docs,Fetch SDK refs,Build and check SDK docs"
      env:
        APP_ID: ${{ secrets.APP_ID }}
        APP_SECRET: ${{ secrets.APP_SECRET }}
        FEISHU_HOST: ${{ vars.FEISHU_HOST }}
    - name: fetch english docs
      id: fetch_en_docs
      run: |
        npx docusaurus fetch-lark-docs -man guides -tar zilliz.saas -s3 --incremental --buildEnv uat --auditCanonicalLinks
        npx docusaurus fetch-lark-docs -man guides -tar zilliz.saas -post -skipS
        npx docusaurus fetch-lark-docs -man guides -tar zilliz.paas -s3 -skipS
        npx docusaurus fetch-lark-docs -man guides -tar zilliz.paas -post -skipS
        npx docusaurus fetch-lark-docs -man agents -tar zilliz -s3
        npx docusaurus report-to-lark --card-advance
      env:
        APP_ID: ${{ secrets.APP_ID }}
        APP_SECRET: ${{ secrets.APP_SECRET }}
        FEISHU_HOST: ${{ vars.FEISHU_HOST }}
        SPACE_ID: ${{ secrets.SPACE_ID }}
        FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
        MODEL_API_BASE_URL: ${{ vars.MODEL_API_BASE_URL }}
        MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        MODEL_ID: ${{ vars.MODEL_ID }}
        AWS_BUCKET: ${{ vars.AWS_BUCKET }}
        AWS_REGION: ${{ vars.AWS_REGION }}
        IMAGE_BED_URL: ${{ vars.IMAGE_BED_URL }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    - name: build and check docsite
      run: |
        node scripts/run-doc-build-stage.js --build "pnpm run build"
        node scripts/update-lark-doc-snapshot.js --manual guides --targets-built zilliz.saas,zilliz.paas --build-env uat --source-branch dev --publish-url https://docs.cloud-uat3.zilliz.com --link-check-remote https://docs.zilliz.com
      env:
        TOKEN: ${{ secrets.ACTION_TOKEN }}
        APP_ID: ${{ secrets.APP_ID }}
        APP_SECRET: ${{ secrets.APP_SECRET }}
        FEISHU_HOST: ${{ vars.FEISHU_HOST }}
        MODEL_API_BASE_URL: ${{ vars.MODEL_API_BASE_URL }}
        MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        MODEL_ID: ${{ vars.MODEL_ID }}
    - name: commit to dev
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        branch: dev
        create_branch: true
        push_options: --force
    - name: fetch sdk references
      id: fetch_sdk_refs
      run: |
        npx docusaurus fetch-lark-docs -man python -src-only
        npx docusaurus fetch-lark-docs -man pymilvus25 -src-only
        npx docusaurus fetch-lark-docs -man pymilvus26 -src-only
        npx docusaurus fetch-lark-docs -man pymilvus30 -tar zilliz -s3
        npx docusaurus fetch-lark-docs -man pymilvus30 -tar zilliz -post
        npx docusaurus fetch-lark-docs -man javaV2 -src-only
        npx docusaurus fetch-lark-docs -man javaV225 -src-only
        npx docusaurus fetch-lark-docs -man javaV226 -src-only
        npx docusaurus fetch-lark-docs -man javaV230 -tar zilliz -s3
        npx docusaurus fetch-lark-docs -man javaV230 -tar zilliz -post
        npx docusaurus fetch-lark-docs -man node -src-only
        npx docusaurus fetch-lark-docs -man nodejs25 -src-only
        npx docusaurus fetch-lark-docs -man nodejs26 -src-only
        npx docusaurus fetch-lark-docs -man nodejs30 -tar zilliz -s3
        npx docusaurus fetch-lark-docs -man nodejs30 -tar zilliz -post
        npx docusaurus fetch-lark-docs -man gov226 -src-only
        npx docusaurus fetch-lark-docs -man gov230 -tar zilliz -s3
        npx docusaurus fetch-lark-docs -man gov230 -tar zilliz -post
        npx docusaurus fetch-lark-docs -man cliv13 -src-only
        npx docusaurus fetch-lark-docs -man cliv14 -tar zilliz -s3
        npx docusaurus fetch-apifox-docs -s plugins/apifox-docs/meta/openapi/
        npx docusaurus report-to-lark --card-advance
      env:
        APP_ID: ${{ secrets.APP_ID }}
        APP_SECRET: ${{ secrets.APP_SECRET }}
        FEISHU_HOST: ${{ vars.FEISHU_HOST }}
        SPACE_ID: ${{ secrets.SPACE_ID }}
        FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
        MODEL_API_BASE_URL: ${{ vars.MODEL_API_BASE_URL }}
        MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        MODEL_ID: ${{ vars.MODEL_ID }}
        AWS_BUCKET: ${{ vars.AWS_BUCKET }}
        AWS_REGION: ${{ vars.AWS_REGION }}
        IMAGE_BED_URL: ${{ vars.IMAGE_BED_URL }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    - name: build and check sdk docs
      run: |
        node scripts/run-doc-build-stage.js --build "pnpm run build"
      env:
        TOKEN: ${{ secrets.ACTION_TOKEN }}
        APP_ID: ${{ secrets.APP_ID }}
        APP_SECRET: ${{ secrets.APP_SECRET }}
        FEISHU_HOST: ${{ vars.FEISHU_HOST }}
        MODEL_API_BASE_URL: ${{ vars.MODEL_API_BASE_URL }}
        MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        MODEL_ID: ${{ vars.MODEL_ID }}
    - name: commit to dev
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        branch: dev
        create_branch: true
        push_options: --force
  failure:
    needs: fetch
    runs-on: ubuntu-latest
    if: ${{ needs.fetch.result == 'failure' || needs.fetch.result == 'cancelled' }}
    steps:
    - name: checkout repo
      uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 9
    - name: set up Environment
      uses: actions/setup-node@v4.0.1
      with:
        node-version: lts/*
        cache: 'pnpm'
    - name: report failure
      run: |
        pnpm install --frozen-lockfile
        npx docusaurus report-to-lark --card-finish --message-id ${{ needs.fetch.outputs.card_id }} --status fail --started-at "${{ needs.fetch.outputs.card_started_at }}" --stages "${{ needs.fetch.outputs.card_stages }}" --title "${{ needs.fetch.outputs.card_title }}"
      env:
        APP_ID: ${{ secrets.APP_ID }}
        APP_SECRET: ${{ secrets.APP_SECRET }}
        FEISHU_HOST: ${{ vars.FEISHU_HOST }}
  success:
    needs: fetch
    runs-on: ubuntu-latest
    if: ${{ needs.fetch.result == 'success' }}
    steps:
    - name: checkout repo
      uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 9
    - name: set up Environment
      uses: actions/setup-node@v4.0.1
      with:
        node-version: lts/*
        cache: 'pnpm'
    - name: report success
      run: |
        pnpm install --frozen-lockfile
        npx docusaurus report-to-lark --card-finish --message-id ${{ needs.fetch.outputs.card_id }} --status success --started-at "${{ needs.fetch.outputs.card_started_at }}" --stages "${{ needs.fetch.outputs.card_stages }}" --title "${{ needs.fetch.outputs.card_title }}"
      env:
        APP_ID: ${{ secrets.APP_ID }}
        APP_SECRET: ${{ secrets.APP_SECRET }}
        FEISHU_HOST: ${{ vars.FEISHU_HOST }}
