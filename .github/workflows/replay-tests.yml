name: Replay Tests

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: replay-tests
  cancel-in-progress: false

jobs:
  translation_replay:
    name: Translation publication FIFO replay suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.6'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run translation publication replay suites
        run: >-
          node --test
          scripts/docs-workflow/replay-translation-publication-fifo.test.js
          scripts/docs-workflow/replay-translation-monitor-artifacts.test.js
