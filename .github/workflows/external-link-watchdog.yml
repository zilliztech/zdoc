name: External Link Watchdog

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: external-link-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out immutable tooling revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve tooling and content SHAs
        id: refs
        run: |
          tooling_sha=$(git rev-parse HEAD)
          git fetch --no-tags origin refs/heads/dev
          content_sha=$(git rev-parse FETCH_HEAD)
          {
            echo "tooling_sha=$tooling_sha"
            echo "content_sha=$content_sha"
          } >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.6'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore exact dev content
        run: bash scripts/restore-generated-state.sh --exact --ref "$CONTENT_SHA"
        env:
          CONTENT_SHA: ${{ steps.refs.outputs.content_sha }}

      - name: Build English site
        run: pnpm build:en

      - name: Scan rendered external links
        id: scan
        env:
          LINK_CHECKS_TOOLING_SHA: ${{ steps.refs.outputs.tooling_sha }}
          LINK_CHECKS_CONTENT_SHA: ${{ steps.refs.outputs.content_sha }}
        run: |
          pnpm docs-tooling check-links --site en --output tmp/external-link-watchdog/latest.md
          node <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('tmp/external-link-watchdog/latest.json', 'utf8'))
          const expiredCount = report.summary.expired_external_links
          if (!Number.isSafeInteger(expiredCount) || expiredCount < 0) {
            throw new Error('expired_external_links must be a non-negative safe integer')
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `expired_count=${expiredCount}\n`)
          NODE

      - name: Upload external link report
        id: report_artifact
        uses: actions/upload-artifact@v6
        with:
          name: external-link-watchdog-${{ github.run_id }}
          path: tmp/external-link-watchdog
          if-no-files-found: error
          retention-days: 14

      - name: Build expired link alert note
        if: ${{ steps.scan.outputs.expired_count != '0' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TOOLING_SHA: ${{ steps.refs.outputs.tooling_sha }}
          CONTENT_SHA: ${{ steps.refs.outputs.content_sha }}
          REPORT_ARTIFACT_URL: ${{ steps.report_artifact.outputs.artifact-url }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('tmp/external-link-watchdog/latest.json', 'utf8'))
          const expired = report.expired_external_links.slice(0, 10)
          const lines = [
            '# External Link Watchdog',
            '',
            `- Confirmed expired external URLs: ${report.summary.expired_external_links}`,
            `- Workflow run: ${process.env.RUN_URL}`,
            `- Tooling SHA: ${process.env.TOOLING_SHA}`,
            `- Content SHA: ${process.env.CONTENT_SHA}`,
            `- Report artifact: ${process.env.REPORT_ARTIFACT_URL}`,
            '',
            '## Confirmed expired external URLs',
            '',
          ]
          for (const item of expired) {
            lines.push(`- ${item.url}`)
            const pages = item.pages.slice(0, 2)
            if (pages.length === 0) lines.push('  - Referring pages: None')
            for (const page of pages) lines.push(`  - Referring page: ${page}`)
            if (item.page_count > pages.length) lines.push(`  - Additional referring pages: ${item.page_count - pages.length}`)
          }
          if (report.expired_external_links.length > expired.length) {
            lines.push(`- ...and ${report.expired_external_links.length - expired.length} more expired URLs`)
          }
          fs.writeFileSync('tmp/external-link-watchdog-alert.md', `${lines.join('\n')}\n`)
          NODE

      - name: Create external link alert card
        id: alert_card
        if: ${{ steps.scan.outputs.expired_count != '0' }}
        continue-on-error: true
        run: pnpm docs-tooling report-card create --title "External Link Watchdog" --stages "Check external links"
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          FEISHU_HOST: ${{ vars.FEISHU_HOST }}

      - name: Attach expired link alert note
        if: ${{ steps.scan.outputs.expired_count != '0' }}
        continue-on-error: true
        run: pnpm docs-tooling report-card note --file tmp/external-link-watchdog-alert.md
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          FEISHU_HOST: ${{ vars.FEISHU_HOST }}

      - name: Finish external link alert card
        if: ${{ steps.scan.outputs.expired_count != '0' }}
        continue-on-error: true
        run: |
          pnpm docs-tooling report-card finish \
            --message-id "$CARD_ID" \
            --started-at "$CARD_STARTED_AT" \
            --stages "$CARD_STAGES" \
            --title "$CARD_TITLE" \
            --status fail
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          FEISHU_HOST: ${{ vars.FEISHU_HOST }}
          CARD_ID: ${{ steps.alert_card.outputs.card_id }}
          CARD_STARTED_AT: ${{ steps.alert_card.outputs.card_started_at }}
          CARD_STAGES: ${{ steps.alert_card.outputs.card_stages }}
          CARD_TITLE: ${{ steps.alert_card.outputs.card_title }}
