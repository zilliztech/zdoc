name: shared docs pin drift watchdog

# Read-only daily audit: compares every shared page's lock pins against the
# upstream track head, and audits adopted variants against the live upstream
# pull-request state. It never writes pins or variants; unhealthy pins (which
# silently degrade production Fetch to per-page baseline fallback) fail the
# report card, plain drift is informational.

on:
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-docs-pin-drift-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FEISHU_NOTIFICATIONS_DISABLED: ${{ vars.FEISHU_NOTIFICATIONS_DISABLED || '' }}
    steps:
      - name: Check out pinned master
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install tooling
        run: pnpm install --frozen-lockfile

      - name: Read public source configuration
        id: source
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { loadTypeScript } = require('./scripts/lib/load-typescript');
          const { parseSourceConfig } = loadTypeScript(path.resolve('packages/docs-tooling/src/shared-docs/core/config.ts'));
          const { SHARED_DOC_GROUPS } = loadTypeScript(path.resolve('packages/docs-tooling/src/shared-docs/core/groups.ts'));
          const supported = new Set(SHARED_DOC_GROUPS);
          const entries = fs.readdirSync('shared-docs', { withFileTypes: true })
            .filter(entry => entry.isDirectory() && !entry.isSymbolicLink()).map(entry => entry.name).sort();
          const groups = [];
          const sources = {};
          for (const group of entries) {
            if (!fs.existsSync(`shared-docs/${group}/source.yaml`)) continue;
            if (!supported.has(group)) throw new Error(`Unsupported shared-docs group ${JSON.stringify(group)}. Supported groups: ${SHARED_DOC_GROUPS.join(', ')}.`);
            const result = parseSourceConfig(fs.readFileSync(`shared-docs/${group}/source.yaml`, 'utf8'));
            if ('errors' in result) throw new Error(JSON.stringify(result.errors));
            const { repository, track } = result.config;
            if (!/^https:\/\/github\.com\/[A-Za-z0-9][A-Za-z0-9-]*\/[A-Za-z0-9_.-]+(?:\.git)?$/.test(repository) || /\/(?:\.|\.\.)(?:\.git)?$/.test(repository)) {
              throw new Error(`Source repository for ${group} must be a credential-free GitHub HTTPS repository URL`);
            }
            groups.push(group);
            sources[group] = { repository, track };
          }
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/shared-docs-sources.json`, JSON.stringify(sources));
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/shared-docs-watchdog-groups`, groups.map(group => `${group}\n`).join(''));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sources=${JSON.stringify(sources)}\n`);
          NODE

      - name: Clone blobless tracking history
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const sources = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/shared-docs-sources.json`, 'utf8'));
          for (const [group, { repository, track }] of Object.entries(sources)) {
            const target = `${process.env.RUNNER_TEMP}/upstream-pin-scan/${group}`;
            execFileSync('git', ['clone', '--quiet', '--filter=blob:none', '--no-checkout', '--single-branch', '--branch', track, '--no-tags', repository, target], { stdio: ['ignore', 'inherit', 'inherit'] });
            execFileSync('git', ['-C', target, 'show-ref', '--verify', `refs/remotes/origin/${track}`], { stdio: ['ignore', 'inherit', 'inherit'] });
          }
          NODE

      - name: Scan pin drift and variant health
        id: scan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS= read -r group; do
            [ -n "$group" ] || continue
            track=$(node -e "process.stdout.write(JSON.parse(require('node:fs').readFileSync(process.env.RUNNER_TEMP + '/shared-docs-sources.json', 'utf8'))[process.argv[1]].track)" "$group")
            head=$(git -C "$RUNNER_TEMP/upstream-pin-scan/$group" rev-parse "refs/remotes/origin/$track")
            [[ "$head" =~ ^[0-9a-f]{40}$ ]] || exit 1
            node scripts/docs-workflow/shared-docs-pin-drift.js \
              --shared-docs "shared-docs/$group" --upstream "$RUNNER_TEMP/upstream-pin-scan/$group" --head "$head" \
              --out "tmp/shared-docs-pin-drift/$group"
          done < "$RUNNER_TEMP/shared-docs-watchdog-groups"
          node <<'NODE'
          const fs = require('node:fs');
          const groups = fs.readFileSync(`${process.env.RUNNER_TEMP}/shared-docs-watchdog-groups`, 'utf8').split('\n').filter(Boolean);
          const totals = { scannedPages: 0, driftedCount: 0, unhealthyCount: 0, pendingReconciliationCount: 0, errorCount: 0 };
          const merged = [];
          for (const group of groups) {
            const report = JSON.parse(fs.readFileSync(`tmp/shared-docs-pin-drift/${group}/watchdog-report.json`, 'utf8'));
            const summary = report.summary || {};
            for (const field of ['scannedPages', 'driftedCount', 'unhealthyCount', 'pendingReconciliationCount', 'errorCount', 'diffDigest']) {
              if (summary[field] === undefined) throw new Error(`Watchdog report is missing summary.${field}`);
            }
            for (const field of Object.keys(totals)) totals[field] += summary[field];
            merged.push(fs.readFileSync(`tmp/shared-docs-pin-drift/${group}/watchdog-report.md`, 'utf8').trimEnd());
          }
          fs.writeFileSync('tmp/shared-docs-pin-drift/watchdog-report.md', merged.join('\n\n') + '\n');
          const cardStatus = totals.unhealthyCount === 0 && totals.errorCount === 0 ? 'success' : 'fail';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `card_status=${cardStatus}\ndrifted_count=${totals.driftedCount}\nunhealthy_count=${totals.unhealthyCount}\n`);
          NODE

      - name: Upload the audit report
        if: ${{ always() && steps.scan.conclusion == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: shared-docs-pin-drift-${{ github.run_id }}
          path: tmp/shared-docs-pin-drift
          if-no-files-found: error
          retention-days: 14

      - name: Attach the report to the run summary
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if test -f tmp/shared-docs-pin-drift/watchdog-report.md; then
            cat tmp/shared-docs-pin-drift/watchdog-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::notice::No watchdog report was produced; the scan step failed before writing one.'
          fi

      - name: Create the report card
        id: report_card
        if: ${{ always() }}
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          FEISHU_HOST: ${{ vars.FEISHU_HOST }}
        run: pnpm docs-tooling report-card create --title "Shared docs pin drift watchdog" --stages "Scan pin drift and variant health"

      - name: Attach the report note
        if: ${{ always() && steps.report_card.outputs.card_id != '' }}
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          FEISHU_HOST: ${{ vars.FEISHU_HOST }}
        run: pnpm docs-tooling report-card note --file tmp/shared-docs-pin-drift/watchdog-report.md

      - name: Finish the report card
        if: ${{ always() && steps.report_card.outputs.card_id != '' }}
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          FEISHU_HOST: ${{ vars.FEISHU_HOST }}
          CARD_ID: ${{ steps.report_card.outputs.card_id }}
          CARD_STARTED_AT: ${{ steps.report_card.outputs.card_started_at }}
          CARD_STAGES: ${{ steps.report_card.outputs.card_stages }}
          CARD_TITLE: ${{ steps.report_card.outputs.card_title }}
          CARD_STATUS: ${{ steps.scan.outputs.card_status }}
        run: |
          pnpm docs-tooling report-card finish --message-id "$CARD_ID" --started-at "$CARD_STARTED_AT" \
            --stages "$CARD_STAGES" --title "$CARD_TITLE" --status "$CARD_STATUS"
