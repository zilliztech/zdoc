name: site validation

on:
  pull_request:
    branches:
      - dev
      - master
  push:
    branches:
      - dev
      - master
  workflow_dispatch:
    inputs:
      site: { description: Site selection, required: true, type: choice, options: [auto, en, zh-CN, all], default: auto }
      source_ref: { description: 'Content branch, tag, or exact SHA', required: false, type: string, default: dev }
      publish: { description: Reserved for the publication entry, required: false, type: boolean, default: false }

permissions:
  contents: read

concurrency:
  group: site-validation-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, inputs.site || 'auto') }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changed site inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      skip_content: ${{ steps.scope.outputs.skip_content }}
      build_en: ${{ steps.manual.outputs.build_en || steps.filters.outputs.build_en }}
      build_zh_cn: ${{ steps.manual.outputs.build_zh_cn || steps.filters.outputs.build_zh_cn }}
      reference_coverage: ${{ steps.manual.outputs.reference_coverage || steps.filters.outputs.reference_coverage }}
      tools_coverage: ${{ steps.manual.outputs.tools_coverage || steps.filters.outputs.tools_coverage }}
    steps:
      - name: Check out candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}
          fetch-depth: 2
          sparse-checkout: deploy/contracts
      - name: Resolve exact candidate SHA
        id: source
        run: echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Determine whether content validation applies
        id: scope
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'push' && "$GITHUB_REF" == 'refs/heads/master' ]]; then
            echo 'skip_content=true' >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == 'pull_request' && "$GITHUB_BASE_REF" == 'master' ]]; then
            echo 'skip_content=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip_content=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch comparison base
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.site == 'auto' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Comparison base must be an exact lowercase Git SHA" >&2; exit 1; }
          if [[ ! "$BASE_SHA" =~ ^0{40}$ ]] && ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --filter=blob:none --depth=1 origin -- "$BASE_SHA"
            git cat-file -e "$BASE_SHA^{commit}"
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Evaluate versioned path filters
        id: filters
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.site == 'auto' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ steps.source.outputs.source_sha }}
        run: >-
          node deploy/contracts/evaluate-path-filters.mjs
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --filters deploy/contracts/path-filters.json
          --github-output "$GITHUB_OUTPUT"
      - name: Select requested manual site
        id: manual
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.site != 'auto' }}
        env: { SITE: '${{ inputs.site }}' }
        run: |
          case "$SITE" in
            en) printf 'build_en=true\nbuild_zh_cn=false\nreference_coverage=false\ntools_coverage=false\n' ;;
            zh-CN) printf 'build_en=false\nbuild_zh_cn=true\nreference_coverage=true\ntools_coverage=true\n' ;;
            all) printf 'build_en=true\nbuild_zh_cn=true\nreference_coverage=true\ntools_coverage=true\n' ;;
            *) exit 2 ;;
          esac >> "$GITHUB_OUTPUT"

  tooling_checks:
    name: Validate tooling consistency
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.classify.outputs.source_sha }}
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:localization-input-inventory
      - run: pnpm check:lark-config
      - run: pnpm check:reference-presentation
      - run: pnpm check:reconciliation-policy

  ownership_gate:
    name: Gate dev-owned paths
    needs: classify
    if: needs.classify.outputs.skip_content == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.classify.outputs.source_sha }}
          fetch-depth: 2
      - name: Fetch comparison base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Comparison base must be an exact lowercase Git SHA" >&2; exit 1; }
          if [[ ! "$BASE_SHA" =~ ^0{40}$ ]] && ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --filter=blob:none --depth=1 origin -- "$BASE_SHA"
            git cat-file -e "$BASE_SHA^{commit}"
          fi
      - name: Require no dev-owned path changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: node scripts/docs-workflow/ownership-gate.js --base "$BASE_SHA" --head "${{ needs.classify.outputs.source_sha }}"

  preserved_files_consistency:
    name: Verify preserved files consistency
    needs: classify
    if: needs.classify.outputs.skip_content == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.classify.outputs.source_sha }}
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/docs-workflow/preserved-files-gate.js

  build_en:
    name: Build English site
    needs: classify
    if: needs.classify.outputs.build_en == 'true' && needs.classify.outputs.skip_content != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.classify.outputs.source_sha }}
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:en
      - name: Require Japanese home output
        run: test -s build/en/ja-JP/docs/home.html

  build_zh_cn:
    name: Build Chinese site
    needs: classify
    if: needs.classify.outputs.build_zh_cn == 'true' && needs.classify.outputs.skip_content != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.classify.outputs.source_sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs-tooling validate-reference --site zh-CN
      - run: pnpm build:zh-CN
      - name: Verify Chinese Tools release reachability
        run: >-
          node --input-type=module -e "
          import fs from 'node:fs';
          const provenance = JSON.parse(fs.readFileSync('build/zh-CN/build-provenance.json', 'utf8'));
          const tools = provenance.routeInventories?.tools ?? [];
          const reachable = provenance.routeInventories?.toolsSidebarReachable ?? [];
          if (JSON.stringify(tools) !== JSON.stringify(reachable)) throw new Error('Chinese Tools routes are not sidebar reachable');
          if ((provenance.routes ?? []).some(route => route === '/docs-agents' || route.startsWith('/docs-agents/'))) throw new Error('docs-agents route was reintroduced');
          "

  reference_coverage:
    name: Validate Chinese Reference coverage
    needs: classify
    if: needs.classify.outputs.reference_coverage == 'true' && needs.classify.outputs.skip_content != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.classify.outputs.source_sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs-tooling validate-reference --site zh-CN

  tools_coverage:
    name: Validate Chinese Tools coverage
    needs:
      - classify
      - build_zh_cn
    if: ${{ always() && needs.classify.outputs.tools_coverage == 'true' && needs.classify.outputs.skip_content != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ZH_CN_RESULT: ${{ needs.build_zh_cn.result }}
    steps:
      - name: Require the provenance-enforced Chinese Tools build
        run: test "$ZH_CN_RESULT" = success

  retirement:
    name: Verify retired layout
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.classify.outputs.source_sha }}
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:retirement

  rest_publication_contract:
    name: Validate REST publication contract
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.classify.outputs.source_sha }}
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:rest-publication-contract

  site_validation:
    name: Site validation gate
    needs:
      - classify
      - tooling_checks
      - ownership_gate
      - preserved_files_consistency
      - build_en
      - build_zh_cn
      - reference_coverage
      - tools_coverage
      - retirement
      - rest_publication_contract
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLASSIFY_RESULT: ${{ needs.classify.result }}
      TOOLING_RESULT: ${{ needs.tooling_checks.result }}
      OWNERSHIP_RESULT: ${{ needs.ownership_gate.result }}
      PRESERVED_RESULT: ${{ needs.preserved_files_consistency.result }}
      EN_RESULT: ${{ needs.build_en.result }}
      ZH_CN_RESULT: ${{ needs.build_zh_cn.result }}
      REFERENCE_RESULT: ${{ needs.reference_coverage.result }}
      TOOLS_RESULT: ${{ needs.tools_coverage.result }}
      RETIREMENT_RESULT: ${{ needs.retirement.result }}
      REST_PUBLICATION_RESULT: ${{ needs.rest_publication_contract.result }}
    steps:
      - name: Require every selected validation to pass
        run: |
          test "$CLASSIFY_RESULT" = success
          test "$TOOLING_RESULT" = success
          test "$RETIREMENT_RESULT" = success
          test "$REST_PUBLICATION_RESULT" = success
          for result in "$OWNERSHIP_RESULT" "$PRESERVED_RESULT" "$EN_RESULT" "$ZH_CN_RESULT" "$REFERENCE_RESULT" "$TOOLS_RESULT"; do
            test "$result" = success || test "$result" = skipped
          done
