          node scripts/docs-workflow/build-aggregate-input.js --output tmp/docs-workflow-results.json
          node scripts/docs-workflow/aggregate-results.js --input tmp/docs-workflow-results.json --output tmp/docs-workflow-summary.md
      - id: reports
        name: Collect card report summaries
        if: ${{ always() }}
        continue-on-error: true
        env:
          FINAL_DEV_SHA: ${{ needs.resolve_final.outputs.final_dev_sha }}
          CARD_REPORT_STARTED_AT: ${{ needs.prepare.outputs.card_started_at }}
          CARD_REPORT_REF: ${{ needs.resolve_final.outputs.final_dev_sha }}
          CARD_BASE_NOTES_JSON: ${{ steps.aggregate.outputs.notes_json }}
        run: |
          set -euo pipefail
          if [[ "$FINAL_DEV_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            git fetch --no-tags origin "$FINAL_DEV_SHA"
            for report_dir in plugins/lark-docs/meta/reports plugins/link-checks/meta/reports; do
              if git cat-file -e "$FINAL_DEV_SHA:$report_dir" 2>/dev/null; then
                rm -rf "$report_dir"
                git checkout "$FINAL_DEV_SHA" -- "$report_dir"
              fi
            done
          fi
          node scripts/collect-build-card-notes.js
      - name: Finish progress card
        if: ${{ always() && needs.prepare.outputs.card_id != '' }}
        continue-on-error: true
        run: bash scripts/docs-workflow/report-live-card.sh
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          FEISHU_HOST: ${{ vars.FEISHU_HOST }}
          GH_TOKEN: ${{ github.token }}
          CARD_ID: ${{ needs.prepare.outputs.card_id }}
          CARD_MODE: ${{ needs.prepare.outputs.card_mode }}
          CARD_STARTED_AT: ${{ needs.prepare.outputs.card_started_at }}
          CARD_STAGES: ${{ needs.prepare.outputs.card_stages }}
          CARD_TITLE: ${{ needs.prepare.outputs.card_title }}
          CARD_TARGET_BRANCH: ${{ needs.prepare.outputs.target_branch }}
          CARD_STATUS: ${{ steps.aggregate.outputs.overall_status == 'success' && 'success' || 'fail' }}
          CARD_NOTES_JSON: ${{ steps.reports.outputs.card_notes_json || steps.aggregate.outputs.notes_json }}
          CARD_JOB_NAME: verify
          CARD_JOB_CONCLUSION: ${{ needs.verify.outputs.status == 'passed' && 'success' || 'failure' }}
          SELECTED_GROUP: ${{ needs.prepare.outputs.selected_group }}
          PUBLISH_ENABLED: ${{ needs.prepare.outputs.publish }}
      - name: Fail unsuccessful workflow
        if: ${{ steps.aggregate.outputs.overall_status != 'success' }}
        run: exit 1
