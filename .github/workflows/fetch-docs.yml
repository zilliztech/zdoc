    uses: ./.github/workflows/_publish-content-group.yml
    with:
      group: java
      artifact_name: ${{ needs.translate_java.outputs.artifact_name || 'unavailable' }}
      baseline_artifact_name: ${{ needs.translate_java.outputs.baseline_artifact_name || '' }}
      commit_message: 'i18n(java): publish translations'
      should_publish: ${{ needs.prepare.outputs.publish == 'true' && needs.translate_java.outputs.status == 'translation_ready' }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      validate_command: 'pnpm run build'

  publish_node:
    needs: [prepare, produce_node, publish_java_translation]
    if: ${{ always() }}
    uses: ./.github/workflows/_publish-content-group.yml
    with:
      group: node
      artifact_name: ${{ needs.produce_node.outputs.artifact_name || 'unavailable' }}
      commit_message: 'docs(node): publish SDK reference'
      should_publish: ${{ needs.prepare.outputs.publish == 'true' && needs.produce_node.outputs.status == 'artifact_ready' }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      master_sha: ${{ needs.prepare.outputs.master_sha }}
