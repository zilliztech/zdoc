name: fetch lark docs
on:
  workflow_dispatch:
    inputs:
      group:
        description: Content group to publish
        type: choice
        options: [all, guides, python, java, node, go, cli, rest]
        default: all
      artifact_retention_days:
        description: Artifact retention in days
        type: number
        default: 3
      target_branch:
        description: Existing branch to publish to
        type: string
        default: dev
      publish:
        description: Publish produced English artifacts
        type: boolean
        default: true
      media_upload_mode:
        description: Object-storage behavior for controlled artifact-only Guides validation
        type: choice
        options: [write, skip]
        default: write
      run_translations:
        description: Dispatch the downstream translation workflow
        type: boolean
        default: false
      canary_suppress_translation_dispatch:
        description: Suppress the real Translation dispatch during isolated feature-branch canary runs
        type: boolean
        default: false
      tooling_ref:
        description: Tooling ref override; exact SHA allowed for controlled dev publication
        type: string
        default: master
      source_ref:
        description: English content baseline branch, tag, or exact SHA
        type: string
        default: dev
  schedule:
    - cron: "0 2,10,18 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: docs-production-dev
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tooling_sha: ${{ steps.refs.outputs.tooling_sha }}
      source_sha: ${{ steps.refs.outputs.source_sha }}
      master_sha: ${{ steps.refs.outputs.master_sha }}
      dev_baseline_sha: ${{ steps.refs.outputs.dev_baseline_sha }}
      initial_target_sha: ${{ steps.refs.outputs.initial_target_sha }}
      target_branch: ${{ steps.refs.outputs.target_branch }}
      publish: ${{ steps.refs.outputs.publish }}
      run_translations: ${{ steps.refs.outputs.run_translations }}
      canary_suppress_translation_dispatch: ${{ steps.refs.outputs.canary_suppress_translation_dispatch }}
      media_upload_mode: ${{ steps.refs.outputs.media_upload_mode }}
      selected_group: ${{ steps.refs.outputs.selected_group }}
      retention_days: ${{ steps.refs.outputs.retention_days }}
      publication_selection_artifact_name: ${{ steps.publication_selection.outputs.artifact_name }}
      publication_selection_sha256: ${{ steps.publication_selection.outputs.selection_sha256 }}
      card_id: ${{ steps.card.outputs.card_id }}
      card_started_at: ${{ steps.card.outputs.card_started_at }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - id: refs
        name: Resolve immutable refs and selection
        env:
          SELECTED_GROUP: ${{ github.event.inputs.group || 'all' }}
          RETENTION_DAYS: ${{ github.event.inputs.artifact_retention_days || '3' }}
          TARGET_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_branch || 'dev' }}
          PUBLISH: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish == 'true' }}
          RUN_TRANSLATIONS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_translations == 'true' }}
          CANARY_SUPPRESS_TRANSLATION_DISPATCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.canary_suppress_translation_dispatch == 'true' }}
          MEDIA_UPLOAD_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.media_upload_mode || 'write' }}
          TOOLING_REF: ${{ github.event.inputs.tooling_ref || 'master' }}
          SOURCE_REF: ${{ github.event.inputs.source_ref || 'dev' }}
        run: |
          set -euo pipefail
          if [[ "$TARGET_BRANCH" == -* || "$TARGET_BRANCH" == *:* || "$TARGET_BRANCH" == *$'\n'* || "$TARGET_BRANCH" == *$'\r'* ]]; then
            echo 'target_branch contains forbidden characters' >&2
            exit 2
          fi
          git check-ref-format --branch "$TARGET_BRANCH"
          tooling_ref="$TOOLING_REF"
          if [[ "$PUBLISH" == true && "$TARGET_BRANCH" == dev && ! "$tooling_ref" =~ ^[0-9a-f]{40}$ ]]; then
            tooling_ref=master
          fi
          if [[ "$tooling_ref" =~ ^[0-9a-f]{40}$ ]]; then
            git fetch --no-tags origin "$tooling_ref"
            master_sha=$(git rev-parse FETCH_HEAD)
          else
            if [[ "$tooling_ref" == -* || "$tooling_ref" == *:* || "$tooling_ref" == *$'\n'* || "$tooling_ref" == *$'\r'* ]]; then
              echo 'tooling_ref contains forbidden characters' >&2
              exit 2
            fi
            git check-ref-format --branch "$tooling_ref"
            git fetch --no-tags origin "refs/heads/$tooling_ref:refs/remotes/origin/$tooling_ref"
            master_sha=$(git rev-parse "refs/remotes/origin/$tooling_ref")
          fi
          git cat-file -e "$master_sha^{commit}"
          node -e 'require("./scripts/docs-workflow/resolve-docs-refs").assertSafeGitRef(process.env.SOURCE_REF)'
          git fetch --no-tags origin "$SOURCE_REF"
          source_sha=$(git rev-parse FETCH_HEAD)
          git fetch --no-tags origin "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          initial_target_sha=$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH^{commit}")
          tooling_sha=$master_sha
          dev_baseline_sha=$source_sha
          [[ "$tooling_sha" =~ ^[0-9a-f]{40}$ && "$source_sha" =~ ^[0-9a-f]{40}$ && "$initial_target_sha" =~ ^[0-9a-f]{40}$ ]]
          case "$SELECTED_GROUP" in all|guides|python|java|node|go|cli|rest) ;; *) exit 2 ;; esac
          case "$MEDIA_UPLOAD_MODE" in write|skip) ;; *) exit 2 ;; esac
          if [[ "$MEDIA_UPLOAD_MODE" == skip ]]; then
            [[ "$PUBLISH" == false && "$RUN_TRANSLATIONS" == false && "$SELECTED_GROUP" == guides ]] || {
              echo 'media_upload_mode=skip is restricted to artifact-only Guides validation' >&2
              exit 2
            }
          fi
          [[ "$RETENTION_DAYS" =~ ^[1-9][0-9]*$ ]]
          git checkout --detach "$master_sha"
          card_parts=("Produce")
          if [[ "$PUBLISH" == true ]]; then card_parts+=("Publish" "Verify"); fi
          [[ "$RUN_TRANSLATIONS" == true ]] && card_parts+=("Handoff")
          card_stages=$(IFS=,; echo "${card_parts[*]}")
          printf 'tooling_sha=%s\nsource_sha=%s\nmaster_sha=%s\ndev_baseline_sha=%s\ninitial_target_sha=%s\ntarget_branch=%s\npublish=%s\nrun_translations=%s\ncanary_suppress_translation_dispatch=%s\nmedia_upload_mode=%s\nselected_group=%s\nretention_days=%s\ncard_stages=%s\n' "$tooling_sha" "$source_sha" "$master_sha" "$dev_baseline_sha" "$initial_target_sha" "$TARGET_BRANCH" "$PUBLISH" "$RUN_TRANSLATIONS" "$CANARY_SUPPRESS_TRANSLATION_DISPATCH" "$MEDIA_UPLOAD_MODE" "$SELECTED_GROUP" "$RETENTION_DAYS" "$card_stages" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22.6', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Verify translation publication readiness
        run: node --test scripts/build/write-provenance.test.mjs scripts/doc-publish-bot/manualConfig.test.js scripts/docs-workflow/content-groups.test.js scripts/docs-workflow/guides-cache-generation-lifecycle.test.js scripts/docs-workflow/guides-render-readiness.test.js scripts/docs-workflow/prepare-content-group-workspace.test.js scripts/docs-workflow/source-publication-barrier.test.js scripts/docs-workflow/publish-checkpoint.test.js scripts/restore-generated-state.test.js scripts/validate-workflow-policy.test.js
      - name: Verify immutable target localization inventory
        if: ${{ steps.refs.outputs.publish == 'true' }}
        env:
          INITIAL_TARGET_SHA: ${{ steps.refs.outputs.initial_target_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$INITIAL_TARGET_SHA"
          bash scripts/restore-generated-state.sh --exact --ref "$INITIAL_TARGET_SHA"
          pnpm check:localization-input-inventory
      - id: publication_selection
        name: Create immutable Fetch publication selection
        env:
          TOOLING_SHA: ${{ steps.refs.outputs.master_sha }}
          TARGET_BRANCH: ${{ steps.refs.outputs.target_branch }}
          INITIAL_TARGET_SHA: ${{ steps.refs.outputs.initial_target_sha }}
          SOURCE_BASELINE_SHA: ${{ steps.refs.outputs.dev_baseline_sha }}
          SELECTED_GROUP: ${{ steps.refs.outputs.selected_group }}
          PUBLISH: ${{ steps.refs.outputs.publish }}
          RUN_TRANSLATIONS: ${{ steps.refs.outputs.run_translations }}
        run: |
          set -euo pipefail
          selection_dir="$RUNNER_TEMP/publication-selection"
          selection_file="$selection_dir/publication-selection.json"
          artifact_name="publication-selection-fetch-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$selection_dir"
          node scripts/docs-workflow/fetch-publication-selection.js selection --output "$selection_file"
          node scripts/docs-workflow/publication-contracts.js validate-selection "$selection_file"
          selection_sha256=$(node -e 'const fs=require("node:fs");process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1],"utf8")).selectionSha256)' "$selection_file")
          printf 'artifact_name=%s\nselection_sha256=%s\n' "$artifact_name" "$selection_sha256" >> "$GITHUB_OUTPUT"
      - name: Upload immutable Fetch publication selection
        uses: actions/upload-artifact@v6
        with:
          name: publication-selection-fetch-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-selection/publication-selection.json
          if-no-files-found: error
          retention-days: ${{ fromJSON(steps.refs.outputs.retention_days) }}
      - id: card
        name: Create progress card
        continue-on-error: true
        run: pnpm docs-tooling report-card create --title "$CARD_TITLE" --stages "$CARD_STAGES" --target-branch "$TARGET_BRANCH"
        env:
          CARD_STAGES: ${{ steps.refs.outputs.card_stages }}
          CARD_TITLE: Zilliz Cloud Docs Build
          TARGET_BRANCH: ${{ steps.refs.outputs.target_branch }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          FEISHU_HOST: ${{ vars.FEISHU_HOST }}

  monitor_docs_progress:
    needs: [prepare]
    if: ${{ needs.prepare.outputs.card_id != '' }}
    uses: ./.github/workflows/_monitor-docs-progress.yml
    with:
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      card_id: ${{ needs.prepare.outputs.card_id }}
      card_started_at: ${{ needs.prepare.outputs.card_started_at }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      selected_group: ${{ needs.prepare.outputs.selected_group }}
      publish_enabled: ${{ needs.prepare.outputs.publish == 'true' }}
      run_translations: ${{ needs.prepare.outputs.run_translations == 'true' }}
      publication_run_attempt: ${{ fromJSON(github.run_attempt) }}
      publication_selection_sha256: ${{ needs.prepare.outputs.publication_selection_sha256 }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}

  produce_guides_sources:
    needs: prepare
    if: ${{ needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'guides' }}
    uses: ./.github/workflows/_fetch-guides-sources.yml
    with:
      site: en
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      media_upload_mode: ${{ needs.prepare.outputs.media_upload_mode }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      SPACE_ID: ${{ secrets.SPACE_ID }}
      FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  render_guides_tables:
    name: render_guides_tables / ${{ matrix.target_name }} / ${{ matrix.table_name }}
    needs: [prepare, produce_guides_sources]
    if: ${{ needs.produce_guides_sources.outputs.status == 'artifact_ready' && needs.produce_guides_sources.outputs.table_count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.produce_guides_sources.outputs.table_matrix) }}
    uses: ./.github/workflows/_render-guides-table.yml
    with:
      site: en
      table_id: ${{ matrix.table_id }}
      table_name: ${{ matrix.table_name }}
      table_slug: ${{ matrix.table_slug }}
      target: ${{ matrix.target }}
      target_name: ${{ matrix.target_name }}
      cleanup: ${{ matrix.cleanup }}
      source_artifact_name: ${{ needs.produce_guides_sources.outputs.artifact_name }}
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}

  produce_guides:
    permissions:
      actions: write
      contents: read
    needs: [prepare, produce_guides_sources, render_guides_tables]
    if: ${{ always() && (needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'guides') && needs.produce_guides_sources.outputs.status == 'artifact_ready' && (needs.render_guides_tables.result == 'success' || needs.render_guides_tables.result == 'skipped') }}
    uses: ./.github/workflows/_assemble-guides.yml
    with:
      site: en
      source_artifact_name: ${{ needs.produce_guides_sources.outputs.artifact_name || 'unavailable' }}
      table_matrix: ${{ needs.produce_guides_sources.outputs.table_matrix || '{"include":[]}' }}
      table_count: ${{ needs.produce_guides_sources.outputs.table_count || '0' }}
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      publication_selection_artifact_name: ${{ needs.prepare.outputs.publication_selection_artifact_name }}
      publication_selection_sha256: ${{ needs.prepare.outputs.publication_selection_sha256 }}
      publication_unit_key: source/guides-en
      cache_version: ${{ needs.produce_guides_sources.outputs.cache_version }}
      cache_save_required: ${{ needs.produce_guides_sources.outputs.cache_save_required }}
      assembly_decision_sha256: ${{ needs.produce_guides_sources.outputs.assembly_decision_sha256 }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}

  produce_zh_guides_sources:
    needs: prepare
    if: ${{ needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'guides' }}
    uses: ./.github/workflows/_fetch-guides-sources.yml
    with:
      site: zh-CN
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      media_upload_mode: ${{ needs.prepare.outputs.media_upload_mode }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      SPACE_ID: ${{ secrets.SPACE_ID }}
      FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}

  render_zh_guides_tables:
    name: render_zh_guides_tables / ${{ matrix.target_name }} / ${{ matrix.table_name }}
    needs: [prepare, produce_zh_guides_sources]
    if: ${{ needs.produce_zh_guides_sources.outputs.status == 'artifact_ready' && needs.produce_zh_guides_sources.outputs.table_count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.produce_zh_guides_sources.outputs.table_matrix) }}
    uses: ./.github/workflows/_render-guides-table.yml
    with:
      site: zh-CN
      table_id: ${{ matrix.table_id }}
      table_name: ${{ matrix.table_name }}
      table_slug: ${{ matrix.table_slug }}
      target: ${{ matrix.target }}
      target_name: ${{ matrix.target_name }}
      cleanup: ${{ matrix.cleanup }}
      source_artifact_name: ${{ needs.produce_zh_guides_sources.outputs.artifact_name }}
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}

  produce_zh_guides:
    permissions:
      actions: write
      contents: read
    needs: [prepare, produce_zh_guides_sources, render_zh_guides_tables]
    if: ${{ always() && (needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'guides') && needs.produce_zh_guides_sources.outputs.status == 'artifact_ready' && (needs.render_zh_guides_tables.result == 'success' || needs.render_zh_guides_tables.result == 'skipped') }}
    uses: ./.github/workflows/_assemble-guides.yml
    with:
      site: zh-CN
      source_artifact_name: ${{ needs.produce_zh_guides_sources.outputs.artifact_name || 'unavailable' }}
      table_matrix: ${{ needs.produce_zh_guides_sources.outputs.table_matrix || '{"include":[]}' }}
      table_count: ${{ needs.produce_zh_guides_sources.outputs.table_count || '0' }}
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      publication_selection_artifact_name: ${{ needs.prepare.outputs.publication_selection_artifact_name }}
      publication_selection_sha256: ${{ needs.prepare.outputs.publication_selection_sha256 }}
      publication_unit_key: source/guides-zh-CN
      cache_version: ${{ needs.produce_zh_guides_sources.outputs.cache_version }}
      cache_save_required: ${{ needs.produce_zh_guides_sources.outputs.cache_save_required }}
      assembly_decision_sha256: ${{ needs.produce_zh_guides_sources.outputs.assembly_decision_sha256 }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}

  produce_python:
    needs: prepare
    if: ${{ needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'python' }}
    uses: ./.github/workflows/_fetch-content-group.yml
    with:
      site: en
      group: python
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      publication_selection_artifact_name: ${{ needs.prepare.outputs.publication_selection_artifact_name }}
      publication_selection_sha256: ${{ needs.prepare.outputs.publication_selection_sha256 }}
      publication_unit_key: source/python
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      SPACE_ID: ${{ secrets.SPACE_ID }}
      FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  produce_java:
    needs: prepare
    if: ${{ needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'java' }}
    uses: ./.github/workflows/_fetch-content-group.yml
    with:
      site: en
      group: java
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      publication_selection_artifact_name: ${{ needs.prepare.outputs.publication_selection_artifact_name }}
      publication_selection_sha256: ${{ needs.prepare.outputs.publication_selection_sha256 }}
      publication_unit_key: source/java
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      SPACE_ID: ${{ secrets.SPACE_ID }}
      FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  produce_node:
    needs: prepare
    if: ${{ needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'node' }}
    uses: ./.github/workflows/_fetch-content-group.yml
    with:
      site: en
      group: node
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      publication_selection_artifact_name: ${{ needs.prepare.outputs.publication_selection_artifact_name }}
      publication_selection_sha256: ${{ needs.prepare.outputs.publication_selection_sha256 }}
      publication_unit_key: source/node
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      SPACE_ID: ${{ secrets.SPACE_ID }}
      FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  produce_go:
    needs: prepare
    if: ${{ needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'go' }}
    uses: ./.github/workflows/_fetch-content-group.yml
    with:
      site: en
      group: go
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      publication_selection_artifact_name: ${{ needs.prepare.outputs.publication_selection_artifact_name }}
      publication_selection_sha256: ${{ needs.prepare.outputs.publication_selection_sha256 }}
      publication_unit_key: source/go
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      SPACE_ID: ${{ secrets.SPACE_ID }}
      FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  produce_cli:
    needs: prepare
    if: ${{ needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'cli' }}
    uses: ./.github/workflows/_fetch-content-group.yml
    with:
      site: en
      group: cli
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      publication_selection_artifact_name: ${{ needs.prepare.outputs.publication_selection_artifact_name }}
      publication_selection_sha256: ${{ needs.prepare.outputs.publication_selection_sha256 }}
      publication_unit_key: source/cli
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      SPACE_ID: ${{ secrets.SPACE_ID }}
      FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  produce_rest:
    needs: prepare
    if: ${{ needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'rest' }}
    uses: ./.github/workflows/_fetch-content-group.yml
    with:
      site: en
      group: rest
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      publication_selection_artifact_name: ${{ needs.prepare.outputs.publication_selection_artifact_name }}
      publication_selection_sha256: ${{ needs.prepare.outputs.publication_selection_sha256 }}
      publication_unit_key: source/rest
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      SPACE_ID: ${{ secrets.SPACE_ID }}
      FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  publish_ready:
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: write
    outputs:
      results_artifact_name: ${{ steps.publish.outputs.results_artifact_name }}
      overall_status: ${{ steps.publish.outputs.overall_status }}
      final_target_sha: ${{ steps.publish.outputs.final_target_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.master_sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22.6', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Download immutable Fetch publication selection
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.prepare.outputs.publication_selection_artifact_name }}
          path: ${{ runner.temp }}/publication-selection
      - name: Validate immutable Fetch publication selection
        env:
          EXPECTED_SELECTION_SHA256: ${{ needs.prepare.outputs.publication_selection_sha256 }}
        run: |
          set -euo pipefail
          selection="$RUNNER_TEMP/publication-selection/publication-selection.json"
          node scripts/docs-workflow/publication-contracts.js validate-selection "$selection"
          actual=$(node -e 'const fs=require("node:fs");process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1],"utf8")).selectionSha256)' "$selection")
          [[ "$actual" == "$EXPECTED_SELECTION_SHA256" ]]
      - id: publish
        name: Publish ready Fetch units in producer completion FIFO order
        uses: actions/github-script@v8
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH: ${{ needs.prepare.outputs.publish }}
        with:
          script: |
            const mode = process.env.PUBLISH === 'true' ? 'publish' : 'artifact_only'
            await exec.exec('node', [
              'scripts/docs-workflow/publication-coordinator.js',
              '--selection', `${process.env.RUNNER_TEMP}/publication-selection/publication-selection.json`,
              '--mode', mode,
              '--poll-milliseconds', '10000',
              '--candidate-polls', '6',
              '--max-publish-attempts', '10',
            ])

  source_publication_barrier:
    needs: [prepare, publish_ready]
    if: ${{ always() && needs.prepare.outputs.run_translations == 'true' && needs.prepare.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ needs.prepare.outputs.master_sha }}', fetch-depth: 1 }
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22.6', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Download immutable Fetch publication selection
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.prepare.outputs.publication_selection_artifact_name }}
          path: ${{ runner.temp }}/publication-selection
      - name: Download immutable Fetch publication results
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.publish_ready.outputs.results_artifact_name }}
          path: ${{ runner.temp }}/publication-results
      - name: Block paid translation until selected sources are published
        run: |
          node scripts/docs-workflow/source-publication-barrier.js \
            --selection "$RUNNER_TEMP/publication-selection/publication-selection.json" \
            --results "$RUNNER_TEMP/publication-results/publication-results.json"

  prepare_translation_handoff:
    needs: [prepare, source_publication_barrier, publish_ready]
    if: ${{ always() && needs.prepare.outputs.run_translations == 'true' && needs.prepare.outputs.publish == 'true' && needs.source_publication_barrier.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      handoff_json: ${{ steps.handoff.outputs.handoff_json }}
      workflow_ref: ${{ steps.handoff.outputs.workflow_ref }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ needs.prepare.outputs.master_sha }}', fetch-depth: 1 }
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22.6', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Download immutable Fetch publication selection
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.prepare.outputs.publication_selection_artifact_name }}
          path: ${{ runner.temp }}/publication-selection
      - name: Download immutable Fetch publication results
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.publish_ready.outputs.results_artifact_name }}
          path: ${{ runner.temp }}/publication-results
      - id: handoff
        name: Validate exact downstream translation handoff
        env:
          SELECTED_GROUP: ${{ needs.prepare.outputs.selected_group }}
          WORKFLOW_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node -e 'require("./scripts/docs-workflow/resolve-docs-refs").assertSafeGitRef(process.env.WORKFLOW_REF)'
          node scripts/docs-workflow/translation-handoff.js \
            --locale all \
            --group "$SELECTED_GROUP" \
            --fetch-selection "$RUNNER_TEMP/publication-selection/publication-selection.json" \
            --fetch-results "$RUNNER_TEMP/publication-results/publication-results.json" \
            > "$RUNNER_TEMP/validated-translation-handoff.json"
          handoff_json=$(cat "$RUNNER_TEMP/validated-translation-handoff.json")
          node scripts/docs-workflow/translation-handoff.js --handoff-json "$handoff_json" > /dev/null
          printf 'handoff_json=%s\nworkflow_ref=%s\n' "$handoff_json" "$WORKFLOW_REF" >> "$GITHUB_OUTPUT"
      - name: Upload validated schema-v2 translation handoff
        uses: actions/upload-artifact@v6
        with:
          name: translation-handoff-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validated-translation-handoff.json
          if-no-files-found: error
          retention-days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}

  dispatch_translations:
    needs: [prepare, prepare_translation_handoff]
    if: ${{ always() && needs.prepare.outputs.run_translations == 'true' && needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.canary_suppress_translation_dispatch != 'true' && needs.prepare_translation_handoff.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    outputs:
      run_url: ${{ steps.dispatch.outputs.run_url }}
      run_id: ${{ steps.dispatch.outputs.run_id }}
    steps:
      - id: dispatch
        name: Dispatch the single translation workflow
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ needs.prepare_translation_handoff.outputs.workflow_ref }}
          HANDOFF_JSON: ${{ needs.prepare_translation_handoff.outputs.handoff_json }}
          TOOLING_SHA: ${{ needs.prepare.outputs.master_sha }}
          REQUEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$REQUEST_ID" =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]]
          expected_title="translate docs ($REQUEST_ID)"
          gh workflow run translate-codex.yml --repo "$GITHUB_REPOSITORY" --ref "$WORKFLOW_REF" -f handoff_json="$HANDOFF_JSON" -f mode=auto -f publish=true -f request_id="$REQUEST_ID"
          run_url=
          for _ in {1..12}; do
            run_url=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow translate-codex.yml --event workflow_dispatch --limit 50 --json displayTitle,url,headSha \
              | jq -r --arg title "$expected_title" --arg sha "$TOOLING_SHA" '.[] | select(.displayTitle == $title and .headSha == $sha) | .url' \
              | head -1)
            [[ -n "$run_url" ]] && break
            sleep 5
          done
          [[ "$run_url" =~ ^https://github\.com/$GITHUB_REPOSITORY/actions/runs/[1-9][0-9]*$ ]]
          run_id=${run_url##*/}
          printf 'run_url=%s\nrun_id=%s\n' "$run_url" "$run_id" >> "$GITHUB_OUTPUT"
          printf 'Downstream translation run: %s\n' "$run_url" >> "$GITHUB_STEP_SUMMARY"
      - name: Create translation handoff monitor metadata
        env:
          PARENT_RUN_ID: ${{ github.run_id }}
          CHILD_RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          CHILD_RUN_URL: ${{ steps.dispatch.outputs.run_url }}
        run: |
          mkdir -p "$RUNNER_TEMP/docs-translation-handoff"
          node -e 'const fs=require("node:fs");const value={schemaVersion:1,parentRunId:Number(process.env.PARENT_RUN_ID),childRunId:Number(process.env.CHILD_RUN_ID),childRunUrl:process.env.CHILD_RUN_URL};if(!Number.isSafeInteger(value.parentRunId)||!Number.isSafeInteger(value.childRunId))throw new Error("invalid handoff run id");fs.writeFileSync(process.argv[1],JSON.stringify(value)+"\n")' "$RUNNER_TEMP/docs-translation-handoff/handoff-metadata.json"
      - name: Upload translation handoff monitor metadata
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: docs-translation-handoff-${{ github.run_id }}
          path: ${{ runner.temp }}/docs-translation-handoff/handoff-metadata.json
          retention-days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}

  verify:
    needs: [prepare, publish_ready]
    if: ${{ always() && needs.prepare.outputs.publish == 'true' && needs.publish_ready.outputs.final_target_sha != '' }}
    uses: ./.github/workflows/_verify-docs.yml
    with:
      publication_selection_artifact_name: ${{ needs.prepare.outputs.publication_selection_artifact_name }}
      publication_results_artifact_name: ${{ needs.publish_ready.outputs.results_artifact_name }}
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
  aggregate:
    needs: [prepare, publish_ready, prepare_translation_handoff, dispatch_translations, verify]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ needs.prepare.outputs.master_sha }}' }
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22.6', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Download immutable Fetch publication selection
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.prepare.outputs.publication_selection_artifact_name }}
          path: ${{ runner.temp }}/publication-selection
      - name: Download immutable Fetch publication results
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.publish_ready.outputs.results_artifact_name }}
          path: ${{ runner.temp }}/publication-results
      - id: aggregate
        name: Aggregate terminal source and handoff results
        env:
          MODE: ${{ needs.prepare.outputs.publish == 'true' && 'publish' || 'artifact_only' }}
          RUN_TRANSLATIONS: 'false'
          SELECTED_GROUP: ${{ needs.prepare.outputs.selected_group }}
          FINAL_VERIFICATION: ${{ needs.verify.outputs.status || 'skipped' }}
          REVISION_RECONCILIATION: ${{ needs.verify.outputs.revision_status || 'skipped' }}
          TRANSLATION_HANDOFF_REQUESTED: ${{ needs.prepare.outputs.run_translations == 'true' && needs.prepare.outputs.canary_suppress_translation_dispatch != 'true' }}
          TRANSLATION_HANDOFF_RESULT: ${{ needs.dispatch_translations.result }}
          TRANSLATION_HANDOFF_RUN_ID: ${{ needs.dispatch_translations.outputs.run_id }}
          TRANSLATION_HANDOFF_RUN_URL: ${{ needs.dispatch_translations.outputs.run_url }}
          VERIFY_JOB_RESULT: ${{ needs.verify.result }}
        run: |
          node scripts/docs-workflow/build-aggregate-input.js \
            --publication-selection "$RUNNER_TEMP/publication-selection/publication-selection.json" \
            --publication-results "$RUNNER_TEMP/publication-results/publication-results.json" \
            --output tmp/docs-workflow-results.json
          node scripts/docs-workflow/aggregate-results.js --input tmp/docs-workflow-results.json --output tmp/docs-workflow-summary.md
      - name: Download current English Guides reports
        if: ${{ always() && (needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'guides') }}
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: docs-checkpoint-guides-en-${{ github.run_id }}-reports
          path: tmp/card-guides-reports/en
      - name: Download current Chinese Guides reports
        if: ${{ always() && (needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'guides') }}
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: docs-checkpoint-guides-zh-CN-${{ github.run_id }}-reports
          path: tmp/card-guides-reports/zh-CN
      - id: report_artifact_links
        name: Resolve exact Guides report artifact links
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifacts_json="$RUNNER_TEMP/docs-report-artifacts.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" | jq -s '[.[].artifacts[]]' > "$artifacts_json"
          node scripts/docs-workflow/resolve-card-artifact-links.js --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --artifacts-json "$artifacts_json"
      - id: reports
        name: Collect card report summaries
        if: ${{ always() }}
        continue-on-error: true
        env:
          CARD_REPORT_STARTED_AT: ${{ needs.prepare.outputs.card_started_at }}
          CARD_REPORT_REF: ${{ needs.publish_ready.outputs.final_target_sha }}
          CARD_REPORT_ARTIFACT_URL_EN: ${{ steps.report_artifact_links.outputs.en_url }}
          CARD_REPORT_ARTIFACT_URL_ZH_CN: ${{ steps.report_artifact_links.outputs.zh_cn_url }}
          CARD_GUIDES_REPORTS_ROOT: tmp/card-guides-reports
          CARD_EXPECT_EN_GUIDES_REPORTS: ${{ needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'guides' }}
          CARD_EXPECT_ZH_GUIDES_REPORTS: ${{ needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'guides' }}
          CARD_BASE_NOTES_JSON: ${{ steps.aggregate.outputs.notes_json }}
        run: node scripts/collect-build-card-notes.js
      - name: Create final card report artifact
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          reports_file="${{ steps.reports.outputs.card_notes_file }}"
          if [[ -z "$reports_file" || ! -f "$reports_file" ]]; then
            reports_file="$RUNNER_TEMP/card-notes.json"
            printf '[]\n' > "$reports_file"
          fi
          printf '%s\n' "${CARD_SUMMARY:-Documentation workflow report unavailable.}" > "$RUNNER_TEMP/card-summary.txt"
          node scripts/docs-workflow/docs-card-report.js create --run-id "$GITHUB_RUN_ID" --overall-status "$OVERALL_STATUS" --summary-file "$RUNNER_TEMP/card-summary.txt" --reports-json "$reports_file" --output tmp/docs-card-report/card-report.json
        env:
          OVERALL_STATUS: ${{ steps.aggregate.outputs.overall_status == 'success' && 'success' || 'failure' }}
          CARD_SUMMARY: ${{ steps.aggregate.outputs.summary_text }}
      - name: Upload final card report artifact
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: docs-card-report-${{ github.run_id }}
          path: tmp/docs-card-report/card-report.json
          if-no-files-found: warn
          retention-days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
      - name: Fail unsuccessful workflow
        if: ${{ steps.aggregate.outputs.overall_status != 'success' }}
        run: exit 1
  finalize_card_fallback:
    needs: [prepare, aggregate, monitor_docs_progress]
    if: ${{ always() && needs.prepare.outputs.card_id != '' && needs.monitor_docs_progress.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ needs.prepare.outputs.master_sha }}' }
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22.6', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: docs-card-report-${{ github.run_id }}
          path: tmp/docs-card-report
      - name: Perform best-effort terminal card update
        continue-on-error: true
        run: node scripts/docs-workflow/monitor-docs-progress.js --finalize-only --report-file tmp/docs-card-report/card-report.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CARD_ID: ${{ needs.prepare.outputs.card_id }}
          CARD_STARTED_AT: ${{ needs.prepare.outputs.card_started_at }}
          CARD_TARGET_BRANCH: ${{ needs.prepare.outputs.target_branch }}
          SELECTED_GROUP: ${{ needs.prepare.outputs.selected_group }}
          PUBLISH_ENABLED: ${{ needs.prepare.outputs.publish }}
          RUN_TRANSLATIONS: ${{ needs.prepare.outputs.run_translations }}
          PUBLICATION_RUN_ATTEMPT: ${{ github.run_attempt }}
          PUBLICATION_SELECTION_SHA256: ${{ needs.prepare.outputs.publication_selection_sha256 }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          FEISHU_HOST: ${{ vars.FEISHU_HOST }}
