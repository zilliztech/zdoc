          PYTHON_SOURCE: ${{ needs.publish_python.outputs.status }}
          PYTHON_SOURCE_SHA: ${{ needs.publish_python.outputs.commit_sha }}
          PYTHON_TRANSLATOR: ${{ needs.translate_python.outputs.status }}
          PYTHON_TRANSLATION: ${{ needs.publish_python_translation.outputs.status }}
          PYTHON_TRANSLATION_SHA: ${{ needs.publish_python_translation.outputs.commit_sha }}
          JAVA_PRODUCER: ${{ needs.produce_java.outputs.status }}
          JAVA_SOURCE: ${{ needs.publish_java.outputs.status }}
          JAVA_SOURCE_SHA: ${{ needs.publish_java.outputs.commit_sha }}
          JAVA_TRANSLATOR: ${{ needs.translate_java.outputs.status }}
          JAVA_TRANSLATION: ${{ needs.publish_java_translation.outputs.status }}
          JAVA_TRANSLATION_SHA: ${{ needs.publish_java_translation.outputs.commit_sha }}
          NODE_PRODUCER: ${{ needs.produce_node.outputs.status }}
          NODE_SOURCE: ${{ needs.publish_node.outputs.status }}
          NODE_SOURCE_SHA: ${{ needs.publish_node.outputs.commit_sha }}
          NODE_TRANSLATOR: ${{ needs.translate_node.outputs.status }}
          NODE_TRANSLATION: ${{ needs.publish_node_translation.outputs.status }}
          NODE_TRANSLATION_SHA: ${{ needs.publish_node_translation.outputs.commit_sha }}
          GO_PRODUCER: ${{ needs.produce_go.outputs.status }}
          GO_SOURCE: ${{ needs.publish_go.outputs.status }}
          GO_SOURCE_SHA: ${{ needs.publish_go.outputs.commit_sha }}
          GO_TRANSLATOR: ${{ needs.translate_go.outputs.status }}
          GO_TRANSLATION: ${{ needs.publish_go_translation.outputs.status }}
          GO_TRANSLATION_SHA: ${{ needs.publish_go_translation.outputs.commit_sha }}
          CLI_PRODUCER: ${{ needs.produce_cli.outputs.status }}
          CLI_SOURCE: ${{ needs.publish_cli.outputs.status }}
          CLI_SOURCE_SHA: ${{ needs.publish_cli.outputs.commit_sha }}
          CLI_TRANSLATOR: ${{ needs.translate_cli.outputs.status }}
          CLI_TRANSLATION: ${{ needs.publish_cli_translation.outputs.status }}
          CLI_TRANSLATION_SHA: ${{ needs.publish_cli_translation.outputs.commit_sha }}
          REST_PRODUCER: ${{ needs.produce_rest.outputs.status }}
          REST_SOURCE: ${{ needs.publish_rest.outputs.status }}
          REST_SOURCE_SHA: ${{ needs.publish_rest.outputs.commit_sha }}
          REST_TRANSLATOR: ${{ needs.translate_rest.outputs.status }}
          REST_TRANSLATION: ${{ needs.publish_rest_translation.outputs.status }}
          REST_TRANSLATION_SHA: ${{ needs.publish_rest_translation.outputs.commit_sha }}
