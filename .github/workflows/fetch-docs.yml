name: fetch lark docs
on:
  workflow_dispatch:
    inputs:
      group:
        description: Content group to publish
        type: choice
        options: [all, guides, python, java, node, go, cli, rest]
        default: all
      artifact_retention_days:
        description: Artifact retention in days
        type: number
        default: 3
      target_branch:
        description: Existing branch to publish to
        type: string
        default: dev
      publish:
        description: Publish and translate produced artifacts
        type: boolean
        default: true
  schedule:
    - cron: "0 2,10,18 * * *"
  push:
    branches: [dev]
    paths: [.github/workflows/fetch-docs.yml]

permissions:
  contents: write
  actions: read

concurrency:
  group: docs-production-dev
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      master_sha: ${{ steps.refs.outputs.master_sha }}
      dev_baseline_sha: ${{ steps.refs.outputs.dev_baseline_sha }}
      target_branch: ${{ steps.refs.outputs.target_branch }}
      publish: ${{ steps.refs.outputs.publish }}
      selected_group: ${{ steps.refs.outputs.selected_group }}
      retention_days: ${{ steps.refs.outputs.retention_days }}
      card_id: ${{ steps.card.outputs.card_id }}
      card_started_at: ${{ steps.card.outputs.card_started_at }}
      card_stages: ${{ steps.card.outputs.card_stages }}
      card_title: ${{ steps.card.outputs.card_title }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - id: refs
        name: Resolve immutable refs and selection
        env:
          SELECTED_GROUP: ${{ github.event.inputs.group || 'all' }}
          RETENTION_DAYS: ${{ github.event.inputs.artifact_retention_days || '3' }}
          TARGET_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_branch || 'dev' }}
          PUBLISH: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish == 'true' }}
        run: |
          set -euo pipefail
          if [[ "$TARGET_BRANCH" == -* || "$TARGET_BRANCH" == *:* || "$TARGET_BRANCH" == *$'\n'* || "$TARGET_BRANCH" == *$'\r'* ]]; then
            echo 'target_branch contains forbidden characters' >&2
            exit 2
          fi
          git check-ref-format --branch "$TARGET_BRANCH"
          git fetch --no-tags origin refs/heads/master:refs/remotes/origin/master "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          master_sha=$(git rev-parse refs/remotes/origin/master)
          dev_baseline_sha=$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")
          [[ "$master_sha" =~ ^[0-9a-f]{40}$ && "$dev_baseline_sha" =~ ^[0-9a-f]{40}$ ]]
          case "$SELECTED_GROUP" in all|guides|python|java|node|go|cli|rest) ;; *) exit 2 ;; esac
          [[ "$RETENTION_DAYS" =~ ^[1-9][0-9]*$ ]]
          git checkout --detach "$master_sha"
          card_stages="$SELECTED_GROUP,Verify"
          [[ "$SELECTED_GROUP" == all ]] && card_stages='guides,python,java,node,go,cli,rest,Verify'
          printf 'master_sha=%s\ndev_baseline_sha=%s\ntarget_branch=%s\npublish=%s\nselected_group=%s\nretention_days=%s\ncard_stages=%s\n' "$master_sha" "$dev_baseline_sha" "$TARGET_BRANCH" "$PUBLISH" "$SELECTED_GROUP" "$RETENTION_DAYS" "$card_stages" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: card
        name: Create progress card
        run: npx docusaurus report-to-lark --card-create --title "$CARD_TITLE" --stages "$CARD_STAGES"
        env:
          CARD_STAGES: ${{ steps.refs.outputs.card_stages }}
          CARD_TITLE: ${{ steps.refs.outputs.publish == 'true' && 'Global Docs Build' || 'Global Docs Artifact-Only Build' }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          FEISHU_HOST: ${{ vars.FEISHU_HOST }}

  produce_guides:
    needs: prepare
    if: ${{ needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'guides' }}
    uses: ./.github/workflows/_fetch-content-group.yml
    with:
      group: guides
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
      card_id: ${{ needs.prepare.outputs.card_id }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      SPACE_ID: ${{ secrets.SPACE_ID }}
      FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  produce_python:
    needs: prepare
    if: ${{ needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'python' }}
    uses: ./.github/workflows/_fetch-content-group.yml
    with:
      group: python
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
      card_id: ${{ needs.prepare.outputs.card_id }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      SPACE_ID: ${{ secrets.SPACE_ID }}
      FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  produce_java:
    needs: prepare
    if: ${{ needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'java' }}
    uses: ./.github/workflows/_fetch-content-group.yml
    with:
      group: java
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
      card_id: ${{ needs.prepare.outputs.card_id }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      SPACE_ID: ${{ secrets.SPACE_ID }}
      FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  produce_node:
    needs: prepare
    if: ${{ needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'node' }}
    uses: ./.github/workflows/_fetch-content-group.yml
    with:
      group: node
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
      card_id: ${{ needs.prepare.outputs.card_id }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      SPACE_ID: ${{ secrets.SPACE_ID }}
      FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  produce_go:
    needs: prepare
    if: ${{ needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'go' }}
    uses: ./.github/workflows/_fetch-content-group.yml
    with:
      group: go
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
      card_id: ${{ needs.prepare.outputs.card_id }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      SPACE_ID: ${{ secrets.SPACE_ID }}
      FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  produce_cli:
    needs: prepare
    if: ${{ needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'cli' }}
    uses: ./.github/workflows/_fetch-content-group.yml
    with:
      group: cli
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
      card_id: ${{ needs.prepare.outputs.card_id }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      SPACE_ID: ${{ secrets.SPACE_ID }}
      FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  produce_rest:
    needs: prepare
    if: ${{ needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'rest' }}
    uses: ./.github/workflows/_fetch-content-group.yml
    with:
      group: rest
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
      card_id: ${{ needs.prepare.outputs.card_id }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      SPACE_ID: ${{ secrets.SPACE_ID }}
      FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  publish_guides:
    needs: [prepare, produce_guides]
    if: ${{ always() }}
    uses: ./.github/workflows/_publish-content-group.yml
    with:
      group: guides
      artifact_name: ${{ needs.produce_guides.outputs.artifact_name || 'unavailable' }}
      commit_message: 'docs(guides): publish fetched content'
      should_publish: ${{ needs.prepare.outputs.publish == 'true' && needs.produce_guides.outputs.status == 'artifact_ready' }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      validate_command: 'node scripts/validate-generated-sidebars.js'
  translate_guides:
    needs: [prepare, publish_guides]
    if: ${{ always() }}
    uses: ./.github/workflows/_translate-content-group.yml
    with:
      group: guides
      source_commit_sha: ${{ needs.publish_guides.outputs.commit_sha || needs.prepare.outputs.dev_baseline_sha }}
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      should_translate: ${{ needs.prepare.outputs.publish == 'true' && (needs.publish_guides.outputs.status == 'published' || needs.publish_guides.outputs.status == 'no_changes') }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
    secrets:
      TRANSLATION_AGENT_API_KEY: ${{ secrets.TRANSLATION_AGENT_API_KEY }}
      REVIEW_AGENT_API_KEY: ${{ secrets.REVIEW_AGENT_API_KEY }}
  publish_guides_translation:
    needs: [prepare, publish_guides, translate_guides]
    if: ${{ always() }}
    uses: ./.github/workflows/_publish-content-group.yml
    with:
      group: guides
      artifact_name: ${{ needs.translate_guides.outputs.artifact_name || 'unavailable' }}
      baseline_artifact_name: ${{ needs.translate_guides.outputs.baseline_artifact_name || '' }}
      commit_message: 'i18n(guides): publish translations'
      should_publish: ${{ needs.prepare.outputs.publish == 'true' && needs.translate_guides.outputs.status == 'translation_ready' }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      validate_command: 'pnpm run build'

  publish_python:
