    needs: [prepare, publish_rest]
    if: ${{ always() }}
    uses: ./.github/workflows/_translate-content-group.yml
    with:
      group: rest
      source_commit_sha: ${{ needs.publish_rest.outputs.commit_sha || needs.prepare.outputs.dev_baseline_sha }}
      master_sha: ${{ needs.prepare.outputs.master_sha }}
