name: "fetch lark docs"
on:
  workflow_dispatch:
  schedule:
  - cron: "0 2,10,18 * * *"  # Every day at 2, 10, and 18 hours UTC
  push:
    branches:
      - "dev"
    paths:
      - ".github/workflows/fetch-docs.yml"

permissions:
  contents: write

concurrency:
  group: docs-production-dev
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DOCS_BUILD_ENV: uat
      DOCS_PUBLISH_URL: https://docs.cloud-uat3.zilliz.com
      LINK_CHECKS_REMOTE_BASE_URL: https://docs.zilliz.com
    outputs:
      card_id: ${{ steps.card.outputs.card_id }}
      card_started_at: ${{ steps.card.outputs.card_started_at }}
      card_stages: ${{ steps.card.outputs.card_stages }}
      card_title: ${{ steps.card.outputs.card_title }}
      card_notes_json: ${{ steps.card_notes.outputs.card_notes_json }}
    steps:
    - name: get current date
      id: date
      run: echo "date=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"
    - name: checkout repo
      uses: actions/checkout@v4
    - name: restore generated docs state
      run: bash scripts/restore-generated-state.sh dev
    - name: validate generated sidebars
      run: node scripts/validate-generated-sidebars.js
    - uses: pnpm/action-setup@v4
      with:
        version: 9
    - name: set up Environment
      uses: actions/setup-node@v4.0.1
      with:
        node-version: "20"
        cache: 'pnpm'
    - name: install deps & create progress card
      id: card
      run: |
        pnpm install --frozen-lockfile
        npx docusaurus report-to-lark --card-create \
          --title "Global Docs Build" \
          --stages "Fetch EN docs,Build EN docs,Fetch SDK refs,Build and check SDK docs"
      env:
        APP_ID: ${{ secrets.APP_ID }}
        APP_SECRET: ${{ secrets.APP_SECRET }}
        FEISHU_HOST: ${{ vars.FEISHU_HOST }}
    - name: fetch english docs
      id: fetch_en_docs
      run: |
        npx docusaurus fetch-lark-docs -man guides -tar zilliz.saas -s3 --incremental --buildEnv uat --auditCanonicalLinks
        npx docusaurus fetch-lark-docs -man guides -tar zilliz.saas -post -skipS
        npx docusaurus fetch-lark-docs -man guides -tar zilliz.paas -s3 -skipS
        npx docusaurus fetch-lark-docs -man guides -tar zilliz.paas -post -skipS
        npx docusaurus report-to-lark --card-advance
      env:
        APP_ID: ${{ secrets.APP_ID }}
        APP_SECRET: ${{ secrets.APP_SECRET }}
        FEISHU_HOST: ${{ vars.FEISHU_HOST }}
        SPACE_ID: ${{ secrets.SPACE_ID }}
        FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
        MODEL_API_BASE_URL: ${{ vars.MODEL_API_BASE_URL }}
        MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        MODEL_ID: ${{ vars.MODEL_ID }}
        AWS_BUCKET: ${{ vars.AWS_BUCKET }}
        AWS_REGION: ${{ vars.AWS_REGION }}
        IMAGE_BED_URL: ${{ vars.IMAGE_BED_URL }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    - name: build docsite
      run: |
        node scripts/validate-generated-sidebars.js
        node scripts/run-doc-build-stage.js --build "pnpm run build" --skipLinkChecks
        node scripts/update-lark-doc-snapshot.js --manual guides --targets-built zilliz.saas,zilliz.paas --build-env uat --source-branch dev --publish-url https://docs.cloud-uat3.zilliz.com --link-check-remote https://docs.zilliz.com
      env:
        TOKEN: ${{ secrets.ACTION_TOKEN }}
        APP_ID: ${{ secrets.APP_ID }}
        APP_SECRET: ${{ secrets.APP_SECRET }}
        FEISHU_HOST: ${{ vars.FEISHU_HOST }}
        MODEL_API_BASE_URL: ${{ vars.MODEL_API_BASE_URL }}
        MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        MODEL_ID: ${{ vars.MODEL_ID }}
    - name: commit to dev
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        branch: dev
        create_branch: true
    - name: fetch sdk references
      id: fetch_sdk_refs
      run: |
        bash scripts/fetch-sdk-reference-docs.sh
      env:
        APP_ID: ${{ secrets.APP_ID }}
        APP_SECRET: ${{ secrets.APP_SECRET }}
        FEISHU_HOST: ${{ vars.FEISHU_HOST }}
        SPACE_ID: ${{ secrets.SPACE_ID }}
        FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
        MODEL_API_BASE_URL: ${{ vars.MODEL_API_BASE_URL }}
        MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        MODEL_ID: ${{ vars.MODEL_ID }}
        AWS_BUCKET: ${{ vars.AWS_BUCKET }}
        AWS_REGION: ${{ vars.AWS_REGION }}
        IMAGE_BED_URL: ${{ vars.IMAGE_BED_URL }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    - name: build and check sdk docs
      run: |
        node scripts/validate-generated-sidebars.js
        node scripts/run-doc-build-stage.js --build "pnpm run build"
        bash scripts/update-sdk-reference-snapshots.sh
      env:
        TOKEN: ${{ secrets.ACTION_TOKEN }}
        APP_ID: ${{ secrets.APP_ID }}
        APP_SECRET: ${{ secrets.APP_SECRET }}
        FEISHU_HOST: ${{ vars.FEISHU_HOST }}
        MODEL_API_BASE_URL: ${{ vars.MODEL_API_BASE_URL }}
        MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        MODEL_ID: ${{ vars.MODEL_ID }}
    - name: collect card report notes
      id: card_notes
      if: always()
      run: node scripts/collect-build-card-notes.js
      env:
        CARD_REPORT_REF: dev
        CARD_REPORT_STARTED_AT: ${{ steps.card.outputs.card_started_at }}
    - name: commit audit report files
      if: always()
      run: |
        REPORT_TMP="$(mktemp -d)"
        mkdir -p "$REPORT_TMP/plugins/lark-docs/meta" "$REPORT_TMP/plugins/link-checks/meta"
        if [ -d plugins/lark-docs/meta/reports ]; then
          cp -R plugins/lark-docs/meta/reports "$REPORT_TMP/plugins/lark-docs/meta/reports"
        fi
        if [ -d plugins/link-checks/meta/reports ]; then
          cp -R plugins/link-checks/meta/reports "$REPORT_TMP/plugins/link-checks/meta/reports"
        fi
        git fetch origin dev
        git reset --hard HEAD
        git switch --force-create dev origin/dev
        rm -rf plugins/lark-docs/meta/reports plugins/link-checks/meta/reports
        if [ -d "$REPORT_TMP/plugins/lark-docs/meta/reports" ]; then
          mkdir -p plugins/lark-docs/meta
          cp -R "$REPORT_TMP/plugins/lark-docs/meta/reports" plugins/lark-docs/meta/reports
        fi
        if [ -d "$REPORT_TMP/plugins/link-checks/meta/reports" ]; then
          mkdir -p plugins/link-checks/meta
          cp -R "$REPORT_TMP/plugins/link-checks/meta/reports" plugins/link-checks/meta/reports
        fi
        git add --all -- plugins/lark-docs/meta/reports plugins/link-checks/meta/reports
        if git diff --cached --quiet; then
          echo "No audit report changes to commit."
        else
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Apply automatic changes"
          git push origin HEAD:dev
        fi
    - name: commit to dev
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        branch: dev
        create_branch: true
  failure:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ always() && (needs.fetch.result == 'failure' || needs.fetch.result == 'cancelled') }}
    steps:
    - name: checkout repo
      uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 9
    - name: set up Environment
      uses: actions/setup-node@v4.0.1
      with:
        node-version: "20"
        cache: 'pnpm'
    - name: report failure
      run: |
        pnpm install --frozen-lockfile
        npx docusaurus report-to-lark --card-finish --message-id ${{ needs.fetch.outputs.card_id }} --status fail --started-at "${{ needs.fetch.outputs.card_started_at }}" --stages "${{ needs.fetch.outputs.card_stages }}" --title "${{ needs.fetch.outputs.card_title }}" --notes-json "$CARD_NOTES_JSON"
      env:
        APP_ID: ${{ secrets.APP_ID }}
        APP_SECRET: ${{ secrets.APP_SECRET }}
        FEISHU_HOST: ${{ vars.FEISHU_HOST }}
        CARD_NOTES_JSON: ${{ needs.fetch.outputs.card_notes_json }}
  success:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ needs.fetch.result == 'success' }}
    steps:
    - name: checkout repo
      uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 9
    - name: set up Environment
      uses: actions/setup-node@v4.0.1
      with:
        node-version: "20"
        cache: 'pnpm'
    - name: report success
      run: |
        pnpm install --frozen-lockfile
        npx docusaurus report-to-lark --card-finish --message-id ${{ needs.fetch.outputs.card_id }} --status success --started-at "${{ needs.fetch.outputs.card_started_at }}" --stages "${{ needs.fetch.outputs.card_stages }}" --title "${{ needs.fetch.outputs.card_title }}" --notes-json "$CARD_NOTES_JSON"
      env:
        APP_ID: ${{ secrets.APP_ID }}
        APP_SECRET: ${{ secrets.APP_SECRET }}
        FEISHU_HOST: ${{ vars.FEISHU_HOST }}
        CARD_NOTES_JSON: ${{ needs.fetch.outputs.card_notes_json }}
