    with:
      group: cli
      source_commit_sha: ${{ needs.publish_cli.outputs.commit_sha || needs.prepare.outputs.dev_baseline_sha }}
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      should_translate: ${{ needs.prepare.outputs.publish == 'true' && (needs.publish_cli.outputs.status == 'published' || needs.publish_cli.outputs.status == 'no_changes') }}
