name: fetch lark docs
on:
  workflow_dispatch:
    inputs:
      group:
        description: Content group to publish
        type: choice
        options: [all, guides, python, java, node, go, cli, rest]
        default: all
      artifact_retention_days:
        description: Artifact retention in days
        type: number
        default: 3
      target_branch:
        description: Existing branch to publish to
        type: string
        default: dev
      publish:
        description: Publish and translate produced artifacts
        type: boolean
        default: true
      tooling_ref:
        description: Non-production tooling ref override
        type: string
        default: master
  schedule:
    - cron: "0 2,10,18 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: docs-production-dev
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      master_sha: ${{ steps.refs.outputs.master_sha }}
      dev_baseline_sha: ${{ steps.refs.outputs.dev_baseline_sha }}
      target_branch: ${{ steps.refs.outputs.target_branch }}
      publish: ${{ steps.refs.outputs.publish }}
      selected_group: ${{ steps.refs.outputs.selected_group }}
      retention_days: ${{ steps.refs.outputs.retention_days }}
      card_id: ${{ steps.card.outputs.card_id }}
      phase_card_id: ${{ steps.card.outputs.card_id }}
      card_mode: ${{ steps.refs.outputs.card_mode }}
      card_started_at: ${{ steps.card.outputs.card_started_at }}
      card_stages: ${{ steps.card.outputs.card_stages }}
      card_title: ${{ steps.card.outputs.card_title }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - id: refs
        name: Resolve immutable refs and selection
        env:
          SELECTED_GROUP: ${{ github.event.inputs.group || 'all' }}
          RETENTION_DAYS: ${{ github.event.inputs.artifact_retention_days || '3' }}
          TARGET_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_branch || 'dev' }}
          PUBLISH: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish == 'true' }}
          TOOLING_REF: ${{ github.event.inputs.tooling_ref || 'master' }}
        run: |
          set -euo pipefail
          if [[ "$TARGET_BRANCH" == -* || "$TARGET_BRANCH" == *:* || "$TARGET_BRANCH" == *$'\n'* || "$TARGET_BRANCH" == *$'\r'* ]]; then
            echo 'target_branch contains forbidden characters' >&2
            exit 2
          fi
          git check-ref-format --branch "$TARGET_BRANCH"
          tooling_ref="$TOOLING_REF"
          if [[ "$PUBLISH" == true && "$TARGET_BRANCH" == dev ]]; then
            tooling_ref=master
          fi
          if [[ "$tooling_ref" =~ ^[0-9a-f]{40}$ ]]; then
            git fetch --no-tags origin "$tooling_ref"
            master_sha=$(git rev-parse FETCH_HEAD)
          else
            if [[ "$tooling_ref" == -* || "$tooling_ref" == *:* || "$tooling_ref" == *$'\n'* || "$tooling_ref" == *$'\r'* ]]; then
              echo 'tooling_ref contains forbidden characters' >&2
              exit 2
            fi
            git check-ref-format --branch "$tooling_ref"
            git fetch --no-tags origin "refs/heads/$tooling_ref:refs/remotes/origin/$tooling_ref"
            master_sha=$(git rev-parse "refs/remotes/origin/$tooling_ref")
          fi
          git cat-file -e "$master_sha^{commit}"
          git fetch --no-tags origin "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          dev_baseline_sha=$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")
          [[ "$master_sha" =~ ^[0-9a-f]{40}$ && "$dev_baseline_sha" =~ ^[0-9a-f]{40}$ ]]
          case "$SELECTED_GROUP" in all|guides|python|java|node|go|cli|rest) ;; *) exit 2 ;; esac
          [[ "$RETENTION_DAYS" =~ ^[1-9][0-9]*$ ]]
          git checkout --detach "$master_sha"
          groups=(guides python java node go cli rest)
          [[ "$SELECTED_GROUP" != all ]] && groups=("$SELECTED_GROUP")
          card_mode=ordered
          card_parts=()
          if [[ "$SELECTED_GROUP" == all ]]; then
            card_mode=aggregate
            card_parts=("Produce manuals (0/${#groups[@]})")
            [[ "$PUBLISH" == true ]] && card_parts+=("Publish sources (0/${#groups[@]})" "Translate manuals (0/${#groups[@]})" "Publish translations (0/${#groups[@]})" Verify)
          else
            for group in "${groups[@]}"; do
              card_parts+=("Produce $group")
              if [[ "$PUBLISH" == true ]]; then
                card_parts+=("Publish $group" "Translate $group" "Publish $group translation")
              fi
            done
            [[ "$PUBLISH" == true ]] && card_parts+=(Verify)
          fi
          card_stages=$(IFS=,; echo "${card_parts[*]}")
          printf 'master_sha=%s\ndev_baseline_sha=%s\ntarget_branch=%s\npublish=%s\nselected_group=%s\nretention_days=%s\ncard_stages=%s\ncard_mode=%s\n' "$master_sha" "$dev_baseline_sha" "$TARGET_BRANCH" "$PUBLISH" "$SELECTED_GROUP" "$RETENTION_DAYS" "$card_stages" "$card_mode" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: card
        name: Create progress card
        run: npx docusaurus report-to-lark --card-create --title "$CARD_TITLE" --stages "$CARD_STAGES" --target-branch "$TARGET_BRANCH"
        env:
          CARD_STAGES: ${{ steps.refs.outputs.card_stages }}
          CARD_TITLE: ${{ steps.refs.outputs.publish == 'true' && 'Global Docs Build' || 'Global Docs Artifact-Only Build' }}
          TARGET_BRANCH: ${{ steps.refs.outputs.target_branch }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          FEISHU_HOST: ${{ vars.FEISHU_HOST }}

  produce_guides_sources:
    needs: prepare
    if: ${{ needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'guides' }}
    uses: ./.github/workflows/_fetch-guides-sources.yml
    with:
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
      card_id: ${{ needs.prepare.outputs.phase_card_id }}
      card_mode: ${{ needs.prepare.outputs.card_mode }}
      card_started_at: ${{ needs.prepare.outputs.card_started_at }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      SPACE_ID: ${{ secrets.SPACE_ID }}
      FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  render_guides_saas:
    needs: [prepare, produce_guides_sources]
    if: ${{ needs.produce_guides_sources.outputs.status == 'artifact_ready' }}
    uses: ./.github/workflows/_render-guides-target.yml
    with:
      target: saas
      source_artifact_name: ${{ needs.produce_guides_sources.outputs.artifact_name }}
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
      card_id: ${{ needs.prepare.outputs.phase_card_id }}
      card_mode: ${{ needs.prepare.outputs.card_mode }}
      card_started_at: ${{ needs.prepare.outputs.card_started_at }}

  render_guides_byoc:
    needs: [prepare, produce_guides_sources]
    if: ${{ needs.produce_guides_sources.outputs.status == 'artifact_ready' }}
    uses: ./.github/workflows/_render-guides-target.yml
    with:
      target: byoc
      source_artifact_name: ${{ needs.produce_guides_sources.outputs.artifact_name }}
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
      card_id: ${{ needs.prepare.outputs.phase_card_id }}
      card_mode: ${{ needs.prepare.outputs.card_mode }}
      card_started_at: ${{ needs.prepare.outputs.card_started_at }}

  produce_guides:
    needs: [prepare, produce_guides_sources, render_guides_saas, render_guides_byoc]
    if: ${{ always() && (needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'guides') }}
    uses: ./.github/workflows/_assemble-guides.yml
    with:
      source_artifact_name: ${{ needs.produce_guides_sources.outputs.artifact_name || 'unavailable' }}
      saas_artifact_name: ${{ needs.render_guides_saas.outputs.artifact_name || 'unavailable' }}
      byoc_artifact_name: ${{ needs.render_guides_byoc.outputs.artifact_name || 'unavailable' }}
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}

  produce_python:
    needs: prepare
    if: ${{ needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'python' }}
    uses: ./.github/workflows/_fetch-content-group.yml
    with:
      group: python
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
      card_id: ${{ needs.prepare.outputs.phase_card_id }}
      card_started_at: ${{ needs.prepare.outputs.card_started_at }}
      card_stages: ${{ needs.prepare.outputs.card_stages }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      SPACE_ID: ${{ secrets.SPACE_ID }}
      FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  produce_java:
    needs: prepare
    if: ${{ needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'java' }}
    uses: ./.github/workflows/_fetch-content-group.yml
    with:
      group: java
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
      card_id: ${{ needs.prepare.outputs.phase_card_id }}
      card_started_at: ${{ needs.prepare.outputs.card_started_at }}
      card_stages: ${{ needs.prepare.outputs.card_stages }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      SPACE_ID: ${{ secrets.SPACE_ID }}
      FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  produce_node:
    needs: prepare
    if: ${{ needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'node' }}
    uses: ./.github/workflows/_fetch-content-group.yml
    with:
      group: node
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
      card_id: ${{ needs.prepare.outputs.phase_card_id }}
      card_started_at: ${{ needs.prepare.outputs.card_started_at }}
      card_stages: ${{ needs.prepare.outputs.card_stages }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      SPACE_ID: ${{ secrets.SPACE_ID }}
      FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  produce_go:
    needs: prepare
    if: ${{ needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'go' }}
    uses: ./.github/workflows/_fetch-content-group.yml
    with:
      group: go
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
      card_id: ${{ needs.prepare.outputs.phase_card_id }}
      card_started_at: ${{ needs.prepare.outputs.card_started_at }}
      card_stages: ${{ needs.prepare.outputs.card_stages }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      SPACE_ID: ${{ secrets.SPACE_ID }}
      FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  produce_cli:
    needs: prepare
    if: ${{ needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'cli' }}
    uses: ./.github/workflows/_fetch-content-group.yml
    with:
      group: cli
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
      card_id: ${{ needs.prepare.outputs.phase_card_id }}
      card_started_at: ${{ needs.prepare.outputs.card_started_at }}
      card_stages: ${{ needs.prepare.outputs.card_stages }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      SPACE_ID: ${{ secrets.SPACE_ID }}
      FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  produce_rest:
    needs: prepare
    if: ${{ needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'rest' }}
    uses: ./.github/workflows/_fetch-content-group.yml
    with:
      group: rest
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
      card_id: ${{ needs.prepare.outputs.phase_card_id }}
      card_started_at: ${{ needs.prepare.outputs.card_started_at }}
      card_stages: ${{ needs.prepare.outputs.card_stages }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      SPACE_ID: ${{ secrets.SPACE_ID }}
      FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  publish_guides:
    needs: [prepare, produce_guides, publish_python]
    if: ${{ always() && needs.prepare.outputs.publish == 'true' && (needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'guides') && needs.produce_guides.outputs.status == 'artifact_ready' }}
    uses: ./.github/workflows/_publish-content-group.yml
    with:
      group: guides
      artifact_name: ${{ needs.produce_guides.outputs.artifact_name || 'unavailable' }}
      commit_message: 'docs(guides): publish fetched content'
      should_publish: ${{ needs.prepare.outputs.publish == 'true' && needs.produce_guides.outputs.status == 'artifact_ready' }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      validate_command: 'node "$GITHUB_WORKSPACE/scripts/validate-generated-sidebars.js"'
      card_id: ${{ needs.prepare.outputs.phase_card_id }}
      card_started_at: ${{ needs.prepare.outputs.card_started_at }}
      card_stages: ${{ needs.prepare.outputs.card_stages }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
  prepare_guides_translation_batches:
    needs: [prepare, publish_guides]
    if: ${{ always() && needs.prepare.outputs.publish == 'true' && (needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'guides') && (needs.publish_guides.outputs.status == 'published' || needs.publish_guides.outputs.status == 'no_changes') }}
    uses: ./.github/workflows/_prepare-translation-batches.yml
    with:
      group: guides
      source_commit_sha: ${{ needs.publish_guides.outputs.commit_sha || needs.prepare.outputs.dev_baseline_sha }}
      master_sha: ${{ needs.prepare.outputs.master_sha }}

  translate_guides_batches:
    name: guides_translation_batch_${{ matrix.batchNumber }}_of_${{ needs.prepare_guides_translation_batches.outputs.batch_count }}_pending_${{ needs.prepare_guides_translation_batches.outputs.pending_count }}
    needs: [prepare, publish_guides, prepare_guides_translation_batches]
    if: ${{ always() && needs.prepare.outputs.publish == 'true' && needs.prepare_guides_translation_batches.result == 'success' && needs.prepare_guides_translation_batches.outputs.batch_count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare_guides_translation_batches.outputs.matrix) }}
    uses: ./.github/workflows/_translate-content-group.yml
    with:
      group: guides
      source_commit_sha: ${{ needs.publish_guides.outputs.commit_sha || needs.prepare.outputs.dev_baseline_sha }}
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      should_translate: true
      max_files: '0'
      batch_index: ${{ matrix.batchIndex }}
      batch_number: ${{ matrix.batchNumber }}
      batch_count: ${{ fromJSON(needs.prepare_guides_translation_batches.outputs.batch_count) }}
      batch_size: ${{ fromJSON(needs.prepare_guides_translation_batches.outputs.batch_size) }}
      pending_count: ${{ fromJSON(needs.prepare_guides_translation_batches.outputs.pending_count) }}
      pending_set_sha256: ${{ needs.prepare_guides_translation_batches.outputs.pending_set_sha256 }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
      card_id: ${{ needs.prepare.outputs.phase_card_id }}
      card_started_at: ${{ needs.prepare.outputs.card_started_at }}
      card_stages: ${{ needs.prepare.outputs.card_stages }}
    secrets:
      TRANSLATION_AGENT_API_KEY: ${{ secrets.TRANSLATION_AGENT_API_KEY }}
      REVIEW_AGENT_API_KEY: ${{ secrets.REVIEW_AGENT_API_KEY }}
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}

  publish_guides_translation_batches:
    needs: [prepare, publish_rest, prepare_guides_translation_batches, translate_guides_batches]
    if: ${{ always() && needs.prepare.outputs.publish == 'true' && needs.prepare_guides_translation_batches.result == 'success' && needs.prepare_guides_translation_batches.outputs.batch_count != '0' && needs.translate_guides_batches.result == 'success' }}
    uses: ./.github/workflows/_publish-translation-batches.yml
    with:
      group: guides
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      batch_count: ${{ fromJSON(needs.prepare_guides_translation_batches.outputs.batch_count) }}
      card_id: ${{ needs.prepare.outputs.phase_card_id }}
      card_started_at: ${{ needs.prepare.outputs.card_started_at }}
      card_stages: ${{ needs.prepare.outputs.card_stages }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}

  finalize_guides_translation:
    needs: [prepare, prepare_guides_translation_batches, translate_guides_batches, publish_guides_translation_batches]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      translator_status: ${{ steps.result.outputs.translator_status }}
      publisher_status: ${{ steps.result.outputs.publisher_status }}
      commit_sha: ${{ steps.result.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ needs.prepare.outputs.master_sha }}', fetch-depth: 0 }
      - id: result
        env:
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          PREP_RESULT: ${{ needs.prepare_guides_translation_batches.result }}
          BATCH_COUNT: ${{ needs.prepare_guides_translation_batches.outputs.batch_count }}
          BATCH_RESULT: ${{ needs.publish_guides_translation_batches.result }}
          TARGET_BRANCH: ${{ needs.prepare.outputs.target_branch }}
        run: node scripts/docs-workflow/finalize-translation-batches.js

  publish_python:
    needs: [prepare, produce_python, publish_rest]
    if: ${{ always() && needs.prepare.outputs.publish == 'true' && (needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'python') && needs.produce_python.outputs.status == 'artifact_ready' }}
    uses: ./.github/workflows/_publish-content-group.yml
    with:
      group: python
      artifact_name: ${{ needs.produce_python.outputs.artifact_name || 'unavailable' }}
      commit_message: 'docs(python): publish SDK reference'
      should_publish: ${{ needs.prepare.outputs.publish == 'true' && needs.produce_python.outputs.status == 'artifact_ready' }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      validate_command: 'node "$GITHUB_WORKSPACE/scripts/validate-generated-sidebars.js"'
      card_id: ${{ needs.prepare.outputs.phase_card_id }}
      card_started_at: ${{ needs.prepare.outputs.card_started_at }}
      card_stages: ${{ needs.prepare.outputs.card_stages }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
  translate_python:
    needs: [prepare, publish_python]
    if: ${{ always() && needs.prepare.outputs.publish == 'true' && (needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'python') && (needs.publish_python.outputs.status == 'published' || needs.publish_python.outputs.status == 'no_changes') }}
    uses: ./.github/workflows/_translate-content-group.yml
    with:
      group: python
      source_commit_sha: ${{ needs.publish_python.outputs.commit_sha || needs.prepare.outputs.dev_baseline_sha }}
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      should_translate: ${{ needs.prepare.outputs.publish == 'true' && (needs.publish_python.outputs.status == 'published' || needs.publish_python.outputs.status == 'no_changes') }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
      card_id: ${{ needs.prepare.outputs.phase_card_id }}
      card_started_at: ${{ needs.prepare.outputs.card_started_at }}
      card_stages: ${{ needs.prepare.outputs.card_stages }}
    secrets:
      TRANSLATION_AGENT_API_KEY: ${{ secrets.TRANSLATION_AGENT_API_KEY }}
      REVIEW_AGENT_API_KEY: ${{ secrets.REVIEW_AGENT_API_KEY }}
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
  publish_python_translation:
    needs: [prepare, publish_python, translate_python, publish_guides_translation_batches]
    if: ${{ always() && needs.prepare.outputs.publish == 'true' && needs.translate_python.outputs.status == 'translation_ready' }}
    uses: ./.github/workflows/_publish-content-group.yml
    with:
      group: python
      artifact_name: ${{ needs.translate_python.outputs.artifact_name || 'unavailable' }}
      baseline_artifact_name: ${{ needs.translate_python.outputs.baseline_artifact_name || '' }}
      commit_message: 'i18n(python): publish translations'
      should_publish: ${{ needs.prepare.outputs.publish == 'true' && needs.translate_python.outputs.status == 'translation_ready' }}
