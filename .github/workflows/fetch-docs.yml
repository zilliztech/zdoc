  publish_rest_translation:
    needs: [prepare, publish_rest, translate_rest]
    if: ${{ always() }}
    uses: ./.github/workflows/_publish-content-group.yml
    with:
      group: rest
      artifact_name: ${{ needs.translate_rest.outputs.artifact_name || 'unavailable' }}
      baseline_artifact_name: ${{ needs.translate_rest.outputs.baseline_artifact_name || '' }}
      commit_message: 'i18n(rest): publish translations'
      should_publish: ${{ needs.prepare.outputs.publish == 'true' && needs.translate_rest.outputs.status == 'translation_ready' }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      validate_command: 'pnpm run build'

  resolve_final:
    needs: [prepare, publish_rest_translation]
    if: ${{ always() && needs.prepare.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      final_dev_sha: ${{ steps.ref.outputs.final_dev_sha }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: master, fetch-depth: 0 }
      - id: ref
        env:
          TARGET_BRANCH: ${{ needs.prepare.outputs.target_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          sha=$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "final_dev_sha=$sha" >> "$GITHUB_OUTPUT"

  verify:
    needs: [prepare, resolve_final]
    if: ${{ always() && needs.prepare.outputs.publish == 'true' && needs.resolve_final.outputs.final_dev_sha != '' }}
    uses: ./.github/workflows/_verify-docs.yml
    with:
      final_dev_sha: ${{ needs.resolve_final.outputs.final_dev_sha }}
      master_sha: ${{ needs.prepare.outputs.master_sha }}

  aggregate:
    needs: [prepare, produce_guides, publish_guides, translate_guides, publish_guides_translation, produce_python, publish_python, translate_python, publish_python_translation, produce_java, publish_java, translate_java, publish_java_translation, produce_node, publish_node, translate_node, publish_node_translation, produce_go, publish_go, translate_go, publish_go_translation, produce_cli, publish_cli, translate_cli, publish_cli_translation, produce_rest, publish_rest, translate_rest, publish_rest_translation, verify]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.master_sha }}
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: aggregate
        name: Aggregate terminal results
        env:
          MODE: ${{ needs.prepare.outputs.publish == 'true' && 'publish' || 'artifact_only' }}
          SELECTED_GROUP: ${{ needs.prepare.outputs.selected_group }}
          FINAL_VERIFICATION: ${{ needs.verify.outputs.status || 'failed' }}
          GUIDES_PRODUCER: ${{ needs.produce_guides.outputs.status }}
          GUIDES_SOURCE: ${{ needs.publish_guides.outputs.status }}
          GUIDES_SOURCE_SHA: ${{ needs.publish_guides.outputs.commit_sha }}
          GUIDES_TRANSLATOR: ${{ needs.translate_guides.outputs.status }}
          GUIDES_TRANSLATION: ${{ needs.publish_guides_translation.outputs.status }}
          GUIDES_TRANSLATION_SHA: ${{ needs.publish_guides_translation.outputs.commit_sha }}
          PYTHON_PRODUCER: ${{ needs.produce_python.outputs.status }}
          PYTHON_SOURCE: ${{ needs.publish_python.outputs.status }}
          PYTHON_SOURCE_SHA: ${{ needs.publish_python.outputs.commit_sha }}
          PYTHON_TRANSLATOR: ${{ needs.translate_python.outputs.status }}
          PYTHON_TRANSLATION: ${{ needs.publish_python_translation.outputs.status }}
          PYTHON_TRANSLATION_SHA: ${{ needs.publish_python_translation.outputs.commit_sha }}
          JAVA_PRODUCER: ${{ needs.produce_java.outputs.status }}
          JAVA_SOURCE: ${{ needs.publish_java.outputs.status }}
          JAVA_SOURCE_SHA: ${{ needs.publish_java.outputs.commit_sha }}
          JAVA_TRANSLATOR: ${{ needs.translate_java.outputs.status }}
          JAVA_TRANSLATION: ${{ needs.publish_java_translation.outputs.status }}
          JAVA_TRANSLATION_SHA: ${{ needs.publish_java_translation.outputs.commit_sha }}
          NODE_PRODUCER: ${{ needs.produce_node.outputs.status }}
          NODE_SOURCE: ${{ needs.publish_node.outputs.status }}
          NODE_SOURCE_SHA: ${{ needs.publish_node.outputs.commit_sha }}
          NODE_TRANSLATOR: ${{ needs.translate_node.outputs.status }}
          NODE_TRANSLATION: ${{ needs.publish_node_translation.outputs.status }}
          NODE_TRANSLATION_SHA: ${{ needs.publish_node_translation.outputs.commit_sha }}
          GO_PRODUCER: ${{ needs.produce_go.outputs.status }}
          GO_SOURCE: ${{ needs.publish_go.outputs.status }}
          GO_SOURCE_SHA: ${{ needs.publish_go.outputs.commit_sha }}
          GO_TRANSLATOR: ${{ needs.translate_go.outputs.status }}
          GO_TRANSLATION: ${{ needs.publish_go_translation.outputs.status }}
          GO_TRANSLATION_SHA: ${{ needs.publish_go_translation.outputs.commit_sha }}
          CLI_PRODUCER: ${{ needs.produce_cli.outputs.status }}
          CLI_SOURCE: ${{ needs.publish_cli.outputs.status }}
          CLI_SOURCE_SHA: ${{ needs.publish_cli.outputs.commit_sha }}
          CLI_TRANSLATOR: ${{ needs.translate_cli.outputs.status }}
          CLI_TRANSLATION: ${{ needs.publish_cli_translation.outputs.status }}
          CLI_TRANSLATION_SHA: ${{ needs.publish_cli_translation.outputs.commit_sha }}
          REST_PRODUCER: ${{ needs.produce_rest.outputs.status }}
          REST_SOURCE: ${{ needs.publish_rest.outputs.status }}
          REST_SOURCE_SHA: ${{ needs.publish_rest.outputs.commit_sha }}
          REST_TRANSLATOR: ${{ needs.translate_rest.outputs.status }}
          REST_TRANSLATION: ${{ needs.publish_rest_translation.outputs.status }}
          REST_TRANSLATION_SHA: ${{ needs.publish_rest_translation.outputs.commit_sha }}
        run: |
          node scripts/docs-workflow/build-aggregate-input.js --output tmp/docs-workflow-results.json
          node scripts/docs-workflow/aggregate-results.js --input tmp/docs-workflow-results.json --output tmp/docs-workflow-summary.md
      - name: Attach summary to card
        if: ${{ needs.prepare.outputs.card_id != '' }}
        run: npx docusaurus report-to-lark --card-note-file tmp/docs-workflow-summary.md
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          FEISHU_HOST: ${{ vars.FEISHU_HOST }}
      - name: Finish progress card
        if: ${{ always() && needs.prepare.outputs.card_id != '' }}
        run: npx docusaurus report-to-lark --card-finish --message-id "$CARD_ID" --status "$CARD_STATUS" --started-at "$CARD_STARTED_AT" --stages "$CARD_STAGES" --title "$CARD_TITLE"
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          FEISHU_HOST: ${{ vars.FEISHU_HOST }}
          CARD_ID: ${{ needs.prepare.outputs.card_id }}
          CARD_STARTED_AT: ${{ needs.prepare.outputs.card_started_at }}
          CARD_STAGES: ${{ needs.prepare.outputs.card_stages }}
          CARD_TITLE: ${{ needs.prepare.outputs.card_title }}
          CARD_STATUS: ${{ steps.aggregate.outputs.overall_status == 'success' && 'success' || 'fail' }}
      - name: Fail unsuccessful workflow
        if: ${{ steps.aggregate.outputs.overall_status != 'success' }}
        run: exit 1
