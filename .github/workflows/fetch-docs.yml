name: fetch lark docs
on:
  workflow_dispatch:
    inputs:
      group:
        description: Content group to publish
        type: choice
        options: [all, guides, python, java, node, go, cli, rest]
        default: all
      artifact_retention_days:
        description: Artifact retention in days
        type: number
        default: 3
      target_branch:
        description: Existing branch to publish to
        type: string
        default: dev
      publish:
        description: Publish produced English artifacts
        type: boolean
        default: true
      run_translations:
        description: Run the temporary translation compatibility path
        type: boolean
        default: false
      tooling_ref:
        description: Tooling ref override; exact SHA allowed for controlled dev publication
        type: string
        default: master
      source_ref:
        description: English content baseline branch, tag, or exact SHA
        type: string
        default: dev
  schedule:
    - cron: "0 2,10,18 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: docs-production-dev
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tooling_sha: ${{ steps.refs.outputs.tooling_sha }}
      source_sha: ${{ steps.refs.outputs.source_sha }}
      master_sha: ${{ steps.refs.outputs.master_sha }}
      dev_baseline_sha: ${{ steps.refs.outputs.dev_baseline_sha }}
      target_branch: ${{ steps.refs.outputs.target_branch }}
      publish: ${{ steps.refs.outputs.publish }}
      run_translations: ${{ steps.refs.outputs.run_translations }}
      selected_group: ${{ steps.refs.outputs.selected_group }}
      retention_days: ${{ steps.refs.outputs.retention_days }}
      card_id: ${{ steps.card.outputs.card_id }}
      card_started_at: ${{ steps.card.outputs.card_started_at }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: refs
        name: Resolve immutable refs and selection
        env:
          SELECTED_GROUP: ${{ github.event.inputs.group || 'all' }}
          RETENTION_DAYS: ${{ github.event.inputs.artifact_retention_days || '3' }}
          TARGET_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_branch || 'dev' }}
          PUBLISH: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish == 'true' }}
          RUN_TRANSLATIONS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_translations == 'true' }}
          TOOLING_REF: ${{ github.event.inputs.tooling_ref || 'master' }}
          SOURCE_REF: ${{ github.event.inputs.source_ref || 'dev' }}
        run: |
          set -euo pipefail
          if [[ "$TARGET_BRANCH" == -* || "$TARGET_BRANCH" == *:* || "$TARGET_BRANCH" == *$'\n'* || "$TARGET_BRANCH" == *$'\r'* ]]; then
            echo 'target_branch contains forbidden characters' >&2
            exit 2
          fi
          git check-ref-format --branch "$TARGET_BRANCH"
          tooling_ref="$TOOLING_REF"
          if [[ "$PUBLISH" == true && "$TARGET_BRANCH" == dev && ! "$tooling_ref" =~ ^[0-9a-f]{40}$ ]]; then
            tooling_ref=master
          fi
          if [[ "$tooling_ref" =~ ^[0-9a-f]{40}$ ]]; then
            git fetch --no-tags origin "$tooling_ref"
            master_sha=$(git rev-parse FETCH_HEAD)
          else
            if [[ "$tooling_ref" == -* || "$tooling_ref" == *:* || "$tooling_ref" == *$'\n'* || "$tooling_ref" == *$'\r'* ]]; then
              echo 'tooling_ref contains forbidden characters' >&2
              exit 2
            fi
            git check-ref-format --branch "$tooling_ref"
            git fetch --no-tags origin "refs/heads/$tooling_ref:refs/remotes/origin/$tooling_ref"
            master_sha=$(git rev-parse "refs/remotes/origin/$tooling_ref")
          fi
          git cat-file -e "$master_sha^{commit}"
          node -e 'require("./scripts/docs-workflow/resolve-docs-refs").assertSafeGitRef(process.env.SOURCE_REF)'
          git fetch --no-tags origin "$SOURCE_REF"
          source_sha=$(git rev-parse FETCH_HEAD)
          tooling_sha=$master_sha
          dev_baseline_sha=$source_sha
          [[ "$tooling_sha" =~ ^[0-9a-f]{40}$ && "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          case "$SELECTED_GROUP" in all|guides|python|java|node|go|cli|rest) ;; *) exit 2 ;; esac
          [[ "$RETENTION_DAYS" =~ ^[1-9][0-9]*$ ]]
          git checkout --detach "$master_sha"
          groups=(guides python java node go cli rest)
          [[ "$SELECTED_GROUP" != all ]] && groups=("$SELECTED_GROUP")
          card_parts=()
          if [[ "$SELECTED_GROUP" == all ]]; then
            card_parts=("Produce manuals (0/${#groups[@]})")
            [[ "$PUBLISH" == true ]] && card_parts+=("Publish sources (0/${#groups[@]})")
            [[ "$RUN_TRANSLATIONS" == true ]] && card_parts+=("Dispatch downstream translation")
          else
            for group in "${groups[@]}"; do
              card_parts+=("Produce $group")
              [[ "$PUBLISH" == true ]] && card_parts+=("Publish $group")
              [[ "$RUN_TRANSLATIONS" == true ]] && card_parts+=("Dispatch downstream translation")
            done
          fi
          card_stages=$(IFS=,; echo "${card_parts[*]}")
          printf 'tooling_sha=%s\nsource_sha=%s\nmaster_sha=%s\ndev_baseline_sha=%s\ntarget_branch=%s\npublish=%s\nrun_translations=%s\nselected_group=%s\nretention_days=%s\ncard_stages=%s\n' "$tooling_sha" "$source_sha" "$master_sha" "$dev_baseline_sha" "$TARGET_BRANCH" "$PUBLISH" "$RUN_TRANSLATIONS" "$SELECTED_GROUP" "$RETENTION_DAYS" "$card_stages" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.6', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Verify translation publication readiness
        run: node --test scripts/build/write-provenance.test.mjs scripts/doc-publish-bot/manualConfig.test.js scripts/docs-workflow/content-groups.test.js scripts/docs-workflow/guides-cache-generation-lifecycle.test.js scripts/docs-workflow/guides-render-readiness.test.js scripts/docs-workflow/prepare-content-group-workspace.test.js scripts/docs-workflow/source-publication-barrier.test.js scripts/docs-workflow/publish-checkpoint.test.js scripts/restore-generated-state.test.js scripts/validate-workflow-policy.test.js
      - id: card
        name: Create progress card
        run: pnpm docs-tooling report-card create --title "$CARD_TITLE" --stages "$CARD_STAGES" --target-branch "$TARGET_BRANCH"
        env:
          CARD_STAGES: ${{ steps.refs.outputs.card_stages }}
          CARD_TITLE: ${{ steps.refs.outputs.publish == 'true' && 'Global Docs Build' || 'Global Docs Artifact-Only Build' }}
          TARGET_BRANCH: ${{ steps.refs.outputs.target_branch }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          FEISHU_HOST: ${{ vars.FEISHU_HOST }}

  monitor_docs_progress:
    needs: [prepare]
    uses: ./.github/workflows/_monitor-docs-progress.yml
    with:
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      card_id: ${{ needs.prepare.outputs.card_id }}
      card_started_at: ${{ needs.prepare.outputs.card_started_at }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      selected_group: ${{ needs.prepare.outputs.selected_group }}
      publish_enabled: ${{ needs.prepare.outputs.publish == 'true' }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}

  produce_guides_sources:
    needs: prepare
    if: ${{ needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'guides' }}
    uses: ./.github/workflows/_fetch-guides-sources.yml
    with:
      site: en
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      SPACE_ID: ${{ secrets.SPACE_ID }}
      FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  render_guides_tables:
    name: render_guides_tables / ${{ matrix.target_name }} / ${{ matrix.table_name }}
    needs: [prepare, produce_guides_sources]
    if: ${{ needs.produce_guides_sources.outputs.status == 'artifact_ready' && needs.produce_guides_sources.outputs.table_count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.produce_guides_sources.outputs.table_matrix) }}
    uses: ./.github/workflows/_render-guides-table.yml
    with:
      site: en
      table_id: ${{ matrix.table_id }}
      table_name: ${{ matrix.table_name }}
      table_slug: ${{ matrix.table_slug }}
      target: ${{ matrix.target }}
      target_name: ${{ matrix.target_name }}
      cleanup: ${{ matrix.cleanup }}
      source_artifact_name: ${{ needs.produce_guides_sources.outputs.artifact_name }}
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}

  produce_guides:
    needs: [prepare, produce_guides_sources, render_guides_tables]
    if: ${{ always() && (needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'guides') && needs.produce_guides_sources.outputs.status == 'artifact_ready' && (needs.render_guides_tables.result == 'success' || needs.render_guides_tables.result == 'skipped') }}
    uses: ./.github/workflows/_assemble-guides.yml
    with:
      site: en
      source_artifact_name: ${{ needs.produce_guides_sources.outputs.artifact_name || 'unavailable' }}
      table_matrix: ${{ needs.produce_guides_sources.outputs.table_matrix || '{"include":[]}' }}
      table_count: ${{ needs.produce_guides_sources.outputs.table_count || '0' }}
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      cache_version: ${{ needs.produce_guides_sources.outputs.cache_version }}
      cache_save_required: ${{ needs.produce_guides_sources.outputs.cache_save_required }}
      assembly_decision_sha256: ${{ needs.produce_guides_sources.outputs.assembly_decision_sha256 }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}

  produce_zh_guides_sources:
    needs: prepare
    if: ${{ needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'guides' }}
    uses: ./.github/workflows/_fetch-guides-sources.yml
    with:
      site: zh-CN
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      SPACE_ID: ${{ secrets.SPACE_ID }}
      FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}

  render_zh_guides_tables:
    name: render_zh_guides_tables / ${{ matrix.target_name }} / ${{ matrix.table_name }}
    needs: [prepare, produce_zh_guides_sources]
    if: ${{ needs.produce_zh_guides_sources.outputs.status == 'artifact_ready' && needs.produce_zh_guides_sources.outputs.table_count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.produce_zh_guides_sources.outputs.table_matrix) }}
    uses: ./.github/workflows/_render-guides-table.yml
    with:
      site: zh-CN
      table_id: ${{ matrix.table_id }}
      table_name: ${{ matrix.table_name }}
      table_slug: ${{ matrix.table_slug }}
      target: ${{ matrix.target }}
      target_name: ${{ matrix.target_name }}
      cleanup: ${{ matrix.cleanup }}
      source_artifact_name: ${{ needs.produce_zh_guides_sources.outputs.artifact_name }}
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}

  produce_zh_guides:
    needs: [prepare, produce_zh_guides_sources, render_zh_guides_tables]
    if: ${{ always() && (needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'guides') && needs.produce_zh_guides_sources.outputs.status == 'artifact_ready' && (needs.render_zh_guides_tables.result == 'success' || needs.render_zh_guides_tables.result == 'skipped') }}
    uses: ./.github/workflows/_assemble-guides.yml
    with:
      site: zh-CN
      source_artifact_name: ${{ needs.produce_zh_guides_sources.outputs.artifact_name || 'unavailable' }}
      table_matrix: ${{ needs.produce_zh_guides_sources.outputs.table_matrix || '{"include":[]}' }}
      table_count: ${{ needs.produce_zh_guides_sources.outputs.table_count || '0' }}
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      cache_version: ${{ needs.produce_zh_guides_sources.outputs.cache_version }}
      cache_save_required: ${{ needs.produce_zh_guides_sources.outputs.cache_save_required }}
      assembly_decision_sha256: ${{ needs.produce_zh_guides_sources.outputs.assembly_decision_sha256 }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}

  produce_python:
    needs: prepare
    if: ${{ needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'python' }}
    uses: ./.github/workflows/_fetch-content-group.yml
    with:
      site: en
      group: python
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      SPACE_ID: ${{ secrets.SPACE_ID }}
      FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  produce_java:
    needs: prepare
    if: ${{ needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'java' }}
    uses: ./.github/workflows/_fetch-content-group.yml
    with:
      site: en
      group: java
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      SPACE_ID: ${{ secrets.SPACE_ID }}
      FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  produce_node:
    needs: prepare
    if: ${{ needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'node' }}
    uses: ./.github/workflows/_fetch-content-group.yml
    with:
      site: en
      group: node
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      SPACE_ID: ${{ secrets.SPACE_ID }}
      FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  produce_go:
    needs: prepare
    if: ${{ needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'go' }}
    uses: ./.github/workflows/_fetch-content-group.yml
    with:
      site: en
      group: go
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      SPACE_ID: ${{ secrets.SPACE_ID }}
      FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  produce_cli:
    needs: prepare
    if: ${{ needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'cli' }}
    uses: ./.github/workflows/_fetch-content-group.yml
    with:
      site: en
      group: cli
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      SPACE_ID: ${{ secrets.SPACE_ID }}
      FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  produce_rest:
    needs: prepare
    if: ${{ needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'rest' }}
    uses: ./.github/workflows/_fetch-content-group.yml
    with:
      site: en
      group: rest
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      dev_baseline_sha: ${{ needs.prepare.outputs.dev_baseline_sha }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      artifact_retention_days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      SPACE_ID: ${{ secrets.SPACE_ID }}
      FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  publish_guides:
    needs: [prepare, produce_guides, publish_python]
    if: ${{ always() && needs.prepare.outputs.publish == 'true' && (needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'guides') && needs.produce_guides.outputs.status == 'artifact_ready' }}
    uses: ./.github/workflows/_publish-content-group.yml
    with:
      group: guides
      site: en
      artifact_name: ${{ needs.produce_guides.outputs.artifact_name || 'unavailable' }}
      commit_message: 'docs(guides): publish fetched content'
      should_publish: ${{ needs.prepare.outputs.publish == 'true' && needs.produce_guides.outputs.status == 'artifact_ready' }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      validate_command: 'node "$GITHUB_WORKSPACE/scripts/validate-generated-sidebars.js" --site en'

  publish_zh_guides:
    needs: [prepare, produce_zh_guides, publish_guides]
    if: ${{ always() && needs.prepare.outputs.publish == 'true' && (needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'guides') && needs.publish_guides.result == 'success' && needs.produce_zh_guides.outputs.status == 'artifact_ready' }}
    uses: ./.github/workflows/_publish-content-group.yml
    with:
      group: guides
      site: zh-CN
      artifact_name: ${{ needs.produce_zh_guides.outputs.artifact_name || 'unavailable' }}
      commit_message: 'docs(guides): publish fetched content'
      should_publish: ${{ needs.prepare.outputs.publish == 'true' && needs.produce_zh_guides.outputs.status == 'artifact_ready' }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      validate_command: 'node "$GITHUB_WORKSPACE/scripts/validate-generated-sidebars.js" --site zh-CN && pnpm run build:zh-CN'

  source_publication_barrier:
    needs: [prepare, publish_guides, publish_zh_guides, publish_python, publish_java, publish_node, publish_go, publish_cli, publish_rest]
    if: ${{ always() && needs.prepare.outputs.run_translations == 'true' && needs.prepare.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ needs.prepare.outputs.master_sha }}', fetch-depth: 1 }
      - name: Block paid translation until selected sources are published
        env:
          SELECTED_GROUP: ${{ needs.prepare.outputs.selected_group }}
          GUIDES_RESULT: ${{ needs.publish_guides.result }}
          GUIDES_STATUS: ${{ needs.publish_guides.outputs.status }}
          ZH_GUIDES_RESULT: ${{ needs.publish_zh_guides.result }}
          ZH_GUIDES_STATUS: ${{ needs.publish_zh_guides.outputs.status }}
          PYTHON_RESULT: ${{ needs.publish_python.result }}
          PYTHON_STATUS: ${{ needs.publish_python.outputs.status }}
          JAVA_RESULT: ${{ needs.publish_java.result }}
          JAVA_STATUS: ${{ needs.publish_java.outputs.status }}
          NODE_RESULT: ${{ needs.publish_node.result }}
          NODE_STATUS: ${{ needs.publish_node.outputs.status }}
          GO_RESULT: ${{ needs.publish_go.result }}
          GO_STATUS: ${{ needs.publish_go.outputs.status }}
          CLI_RESULT: ${{ needs.publish_cli.result }}
          CLI_STATUS: ${{ needs.publish_cli.outputs.status }}
          REST_RESULT: ${{ needs.publish_rest.result }}
          REST_STATUS: ${{ needs.publish_rest.outputs.status }}
        run: |
          if [[ "$SELECTED_GROUP" == all || "$SELECTED_GROUP" == guides ]]; then
            [[ "$ZH_GUIDES_RESULT" == success && ( "$ZH_GUIDES_STATUS" == published || "$ZH_GUIDES_STATUS" == no_changes ) ]]
          fi
          node scripts/docs-workflow/source-publication-barrier.js

  publish_python:
    needs: [prepare, produce_python, publish_rest]
    if: ${{ always() && needs.prepare.outputs.publish == 'true' && (needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'python') && needs.produce_python.outputs.status == 'artifact_ready' }}
    uses: ./.github/workflows/_publish-content-group.yml
    with:
      group: python
      site: en
      artifact_name: ${{ needs.produce_python.outputs.artifact_name || 'unavailable' }}
      commit_message: 'docs(python): publish SDK reference'
      should_publish: ${{ needs.prepare.outputs.publish == 'true' && needs.produce_python.outputs.status == 'artifact_ready' }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      validate_command: 'node "$GITHUB_WORKSPACE/scripts/validate-generated-sidebars.js" --site en'
  publish_java:
    needs: [prepare, produce_java]
    if: ${{ always() && needs.prepare.outputs.publish == 'true' && (needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'java') && needs.produce_java.outputs.status == 'artifact_ready' }}
    uses: ./.github/workflows/_publish-content-group.yml
    with:
      group: java
      site: en
      artifact_name: ${{ needs.produce_java.outputs.artifact_name || 'unavailable' }}
      commit_message: 'docs(java): publish SDK reference'
      should_publish: ${{ needs.prepare.outputs.publish == 'true' && needs.produce_java.outputs.status == 'artifact_ready' }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      validate_command: 'node "$GITHUB_WORKSPACE/scripts/validate-generated-sidebars.js" --site en'
  publish_node:
    needs: [prepare, produce_node, publish_java]
    if: ${{ always() && needs.prepare.outputs.publish == 'true' && (needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'node') && needs.produce_node.outputs.status == 'artifact_ready' }}
    uses: ./.github/workflows/_publish-content-group.yml
    with:
      group: node
      site: en
      artifact_name: ${{ needs.produce_node.outputs.artifact_name || 'unavailable' }}
      commit_message: 'docs(node): publish SDK reference'
      should_publish: ${{ needs.prepare.outputs.publish == 'true' && needs.produce_node.outputs.status == 'artifact_ready' }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      validate_command: 'node "$GITHUB_WORKSPACE/scripts/validate-generated-sidebars.js" --site en'
  publish_go:
    needs: [prepare, produce_go, publish_node]
    if: ${{ always() && needs.prepare.outputs.publish == 'true' && (needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'go') && needs.produce_go.outputs.status == 'artifact_ready' }}
    uses: ./.github/workflows/_publish-content-group.yml
    with:
      group: go
      site: en
      artifact_name: ${{ needs.produce_go.outputs.artifact_name || 'unavailable' }}
      commit_message: 'docs(go): publish SDK reference'
      should_publish: ${{ needs.prepare.outputs.publish == 'true' && needs.produce_go.outputs.status == 'artifact_ready' }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      validate_command: 'node "$GITHUB_WORKSPACE/scripts/validate-generated-sidebars.js" --site en'
  publish_cli:
    needs: [prepare, produce_cli, publish_go]
    if: ${{ always() && needs.prepare.outputs.publish == 'true' && (needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'cli') && needs.produce_cli.outputs.status == 'artifact_ready' }}
    uses: ./.github/workflows/_publish-content-group.yml
    with:
      group: cli
      site: en
      artifact_name: ${{ needs.produce_cli.outputs.artifact_name || 'unavailable' }}
      commit_message: 'docs(cli): publish CLI reference'
      should_publish: ${{ needs.prepare.outputs.publish == 'true' && needs.produce_cli.outputs.status == 'artifact_ready' }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      validate_command: 'node "$GITHUB_WORKSPACE/scripts/validate-generated-sidebars.js" --site en'
  publish_rest:
    needs: [prepare, produce_rest, publish_cli]
    if: ${{ always() && needs.prepare.outputs.publish == 'true' && (needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'rest') && needs.produce_rest.outputs.status == 'artifact_ready' }}
    uses: ./.github/workflows/_publish-content-group.yml
    with:
      group: rest
      site: en
      artifact_name: ${{ needs.produce_rest.outputs.artifact_name || 'unavailable' }}
      commit_message: 'docs(rest): publish REST reference'
      should_publish: ${{ needs.prepare.outputs.publish == 'true' && needs.produce_rest.outputs.status == 'artifact_ready' }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      validate_command: 'node "$GITHUB_WORKSPACE/scripts/validate-generated-sidebars.js" --site en'
  prepare_translation_handoff:
    needs: [prepare, source_publication_barrier, publish_guides, publish_python, publish_java, publish_node, publish_go, publish_cli, publish_rest]
    if: ${{ always() && needs.prepare.outputs.run_translations == 'true' && needs.prepare.outputs.publish == 'true' && needs.source_publication_barrier.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_shas_json: ${{ steps.handoff.outputs.source_shas_json }}
      workflow_ref: ${{ steps.handoff.outputs.workflow_ref }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ needs.prepare.outputs.master_sha }}', fetch-depth: 1 }
      - id: handoff
        name: Validate exact downstream translation handoff
        env:
          SELECTED_GROUP: ${{ needs.prepare.outputs.selected_group }}
          TOOLING_SHA: ${{ needs.prepare.outputs.master_sha }}
          TARGET_BRANCH: ${{ needs.prepare.outputs.target_branch }}
          DEV_BASELINE_SHA: ${{ needs.prepare.outputs.dev_baseline_sha }}
          GUIDES_SHA: ${{ needs.publish_guides.outputs.commit_sha }}
          PYTHON_SHA: ${{ needs.publish_python.outputs.commit_sha }}
          JAVA_SHA: ${{ needs.publish_java.outputs.commit_sha }}
          NODE_SHA: ${{ needs.publish_node.outputs.commit_sha }}
          GO_SHA: ${{ needs.publish_go.outputs.commit_sha }}
          CLI_SHA: ${{ needs.publish_cli.outputs.commit_sha }}
          REST_SHA: ${{ needs.publish_rest.outputs.commit_sha }}
          WORKFLOW_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node -e 'require("./scripts/docs-workflow/resolve-docs-refs").assertSafeGitRef(process.env.WORKFLOW_REF)'
          SOURCE_SHAS_PATH="$RUNNER_TEMP/source-shas.json" node - <<'NODE'
          const fs = require('node:fs')
          const baseline = process.env.DEV_BASELINE_SHA
          const values = {
            guides: process.env.GUIDES_SHA || baseline,
            python: process.env.PYTHON_SHA || baseline,
            java: process.env.JAVA_SHA || baseline,
            node: process.env.NODE_SHA || baseline,
            go: process.env.GO_SHA || baseline,
            cli: process.env.CLI_SHA || baseline,
            rest: process.env.REST_SHA || baseline,
          }
          for (const [group, sha] of Object.entries(values)) if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error(`Missing exact published source SHA for ${group}`)
          fs.writeFileSync(process.env.SOURCE_SHAS_PATH, JSON.stringify(values))
          NODE
          source_shas_json=$(cat "$RUNNER_TEMP/source-shas.json")
          node scripts/docs-workflow/translation-handoff.js --locale all --group "$SELECTED_GROUP" --tooling-sha "$TOOLING_SHA" --target-branch "$TARGET_BRANCH" --source-shas-json "$source_shas_json" > "$RUNNER_TEMP/validated-translation-handoff.json"
          printf 'source_shas_json=%s\nworkflow_ref=%s\n' "$source_shas_json" "$WORKFLOW_REF" >> "$GITHUB_OUTPUT"

  dispatch_translations:
    needs: [prepare, prepare_translation_handoff]
    if: ${{ always() && needs.prepare.outputs.run_translations == 'true' && needs.prepare.outputs.publish == 'true' && needs.prepare_translation_handoff.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_url: ${{ steps.dispatch.outputs.run_url }}
      run_id: ${{ steps.dispatch.outputs.run_id }}
    steps:
      - id: dispatch
        name: Dispatch the single translation workflow
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ needs.prepare_translation_handoff.outputs.workflow_ref }}
          SOURCE_SHAS_JSON: ${{ needs.prepare_translation_handoff.outputs.source_shas_json }}
          TOOLING_SHA: ${{ needs.prepare.outputs.master_sha }}
          SELECTED_GROUP: ${{ needs.prepare.outputs.selected_group }}
          TARGET_BRANCH: ${{ needs.prepare.outputs.target_branch }}
          REQUEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$REQUEST_ID" =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]]
          expected_title="translate docs ($REQUEST_ID)"
          gh workflow run translate-codex.yml --repo "$GITHUB_REPOSITORY" --ref "$WORKFLOW_REF" -f locale=all -f group="$SELECTED_GROUP" -f source_shas_json="$SOURCE_SHAS_JSON" -f tooling_sha="$TOOLING_SHA" -f target_branch="$TARGET_BRANCH" -f mode=auto -f publish=true -f request_id="$REQUEST_ID"
          run_url=
          for attempt in {1..12}; do
            run_url=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow translate-codex.yml --event workflow_dispatch --limit 50 --json displayTitle,url,headSha \
              | jq -r --arg title "$expected_title" --arg sha "$TOOLING_SHA" '.[] | select(.displayTitle == $title and .headSha == $sha) | .url' \
              | head -1)
            [[ -n "$run_url" ]] && break
            sleep 5
          done
          [[ "$run_url" =~ ^https://github\.com/$GITHUB_REPOSITORY/actions/runs/[1-9][0-9]*$ ]]
          run_id=${run_url##*/}
          printf 'run_url=%s\nrun_id=%s\n' "$run_url" "$run_id" >> "$GITHUB_OUTPUT"
          printf 'Downstream translation run: %s\n' "$run_url" >> "$GITHUB_STEP_SUMMARY"

  resolve_final:
    needs: [prepare, publish_guides, publish_zh_guides, publish_python, publish_java, publish_node, publish_go, publish_cli, publish_rest]
    if: ${{ always() && needs.prepare.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      final_dev_sha: ${{ steps.ref.outputs.final_dev_sha }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ needs.prepare.outputs.master_sha }}', fetch-depth: 0 }
      - id: ref
        env:
          TARGET_BRANCH: ${{ needs.prepare.outputs.target_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          sha=$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "final_dev_sha=$sha" >> "$GITHUB_OUTPUT"
  verify:
    needs: [prepare, resolve_final]
    if: ${{ always() && needs.prepare.outputs.publish == 'true' && needs.resolve_final.outputs.final_dev_sha != '' }}
    uses: ./.github/workflows/_verify-docs.yml
    with:
      final_dev_sha: ${{ needs.resolve_final.outputs.final_dev_sha }}
      master_sha: ${{ needs.prepare.outputs.master_sha }}
      target_branch: ${{ needs.prepare.outputs.target_branch }}
  aggregate:
    needs: [prepare, produce_guides, publish_guides, produce_zh_guides, publish_zh_guides, produce_python, publish_python, produce_java, publish_java, produce_node, publish_node, produce_go, publish_go, produce_cli, publish_cli, produce_rest, publish_rest, prepare_translation_handoff, dispatch_translations, resolve_final, verify]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ needs.prepare.outputs.master_sha }}' }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.6', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: aggregate
        name: Aggregate terminal source and handoff results
        env:
          MODE: ${{ needs.prepare.outputs.publish == 'true' && 'publish' || 'artifact_only' }}
          RUN_TRANSLATIONS: 'false'
          SELECTED_GROUP: ${{ needs.prepare.outputs.selected_group }}
          FINAL_VERIFICATION: ${{ needs.verify.outputs.status || 'skipped' }}
          REVISION_RECONCILIATION: ${{ needs.verify.outputs.revision_status || 'skipped' }}
          TRANSLATION_HANDOFF_REQUESTED: ${{ needs.prepare.outputs.run_translations }}
          TRANSLATION_HANDOFF_RESULT: ${{ needs.dispatch_translations.result }}
          TRANSLATION_HANDOFF_RUN_ID: ${{ needs.dispatch_translations.outputs.run_id }}
          TRANSLATION_HANDOFF_RUN_URL: ${{ needs.dispatch_translations.outputs.run_url }}
          VERIFY_JOB_RESULT: ${{ needs.verify.result }}
          GUIDES_PRODUCER: ${{ needs.produce_guides.outputs.status }}
          GUIDES_SOURCE: ${{ needs.publish_guides.outputs.status }}
          GUIDES_SOURCE_SHA: ${{ needs.publish_guides.outputs.commit_sha }}
          PYTHON_PRODUCER: ${{ needs.produce_python.outputs.status }}
          PYTHON_SOURCE: ${{ needs.publish_python.outputs.status }}
          PYTHON_SOURCE_SHA: ${{ needs.publish_python.outputs.commit_sha }}
          JAVA_PRODUCER: ${{ needs.produce_java.outputs.status }}
          JAVA_SOURCE: ${{ needs.publish_java.outputs.status }}
          JAVA_SOURCE_SHA: ${{ needs.publish_java.outputs.commit_sha }}
          NODE_PRODUCER: ${{ needs.produce_node.outputs.status }}
          NODE_SOURCE: ${{ needs.publish_node.outputs.status }}
          NODE_SOURCE_SHA: ${{ needs.publish_node.outputs.commit_sha }}
          GO_PRODUCER: ${{ needs.produce_go.outputs.status }}
          GO_SOURCE: ${{ needs.publish_go.outputs.status }}
          GO_SOURCE_SHA: ${{ needs.publish_go.outputs.commit_sha }}
          CLI_PRODUCER: ${{ needs.produce_cli.outputs.status }}
          CLI_SOURCE: ${{ needs.publish_cli.outputs.status }}
          CLI_SOURCE_SHA: ${{ needs.publish_cli.outputs.commit_sha }}
          REST_PRODUCER: ${{ needs.produce_rest.outputs.status }}
          REST_SOURCE: ${{ needs.publish_rest.outputs.status }}
          REST_SOURCE_SHA: ${{ needs.publish_rest.outputs.commit_sha }}
        run: |
          if [[ "$MODE" == publish ]]; then [[ "$VERIFY_JOB_RESULT" == success ]]; fi
          node scripts/docs-workflow/build-aggregate-input.js --output tmp/docs-workflow-results.json
          node scripts/docs-workflow/aggregate-results.js --input tmp/docs-workflow-results.json --output tmp/docs-workflow-summary.md
      - name: Download current Guides reports
        if: ${{ always() && (needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'guides') }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: docs-checkpoint-guides-${{ github.run_id }}-reports
          path: packages/docs-tooling/src/lark/meta/reports
      - id: reports
        name: Collect card report summaries
        if: ${{ always() }}
        continue-on-error: true
        env:
          CARD_REPORT_STARTED_AT: ${{ needs.prepare.outputs.card_started_at }}
          CARD_REPORT_REF: ${{ needs.resolve_final.outputs.final_dev_sha }}
          CARD_REPORT_ARTIFACT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
          CARD_EXPECT_GUIDES_REPORTS: ${{ (needs.prepare.outputs.selected_group == 'all' || needs.prepare.outputs.selected_group == 'guides') && needs.produce_guides.outputs.status == 'artifact_ready' }}
          CARD_BASE_NOTES_JSON: ${{ steps.aggregate.outputs.notes_json }}
        run: node scripts/collect-build-card-notes.js
      - name: Create final card report artifact
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          reports_file="${{ steps.reports.outputs.card_notes_file }}"
          if [[ -z "$reports_file" || ! -f "$reports_file" ]]; then
            reports_file="$RUNNER_TEMP/card-notes.json"
            printf '[]\n' > "$reports_file"
          fi
          printf '%s\n' "${CARD_SUMMARY:-Documentation workflow report unavailable.}" > "$RUNNER_TEMP/card-summary.txt"
          node scripts/docs-workflow/docs-card-report.js create --run-id "$GITHUB_RUN_ID" --overall-status "$OVERALL_STATUS" --summary-file "$RUNNER_TEMP/card-summary.txt" --reports-json "$reports_file" --output tmp/docs-card-report/card-report.json
        env:
          OVERALL_STATUS: ${{ steps.aggregate.outputs.overall_status == 'success' && 'success' || 'failure' }}
          CARD_SUMMARY: ${{ steps.aggregate.outputs.summary_text }}
      - name: Upload final card report artifact
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: docs-card-report-${{ github.run_id }}
          path: tmp/docs-card-report/card-report.json
          if-no-files-found: warn
          retention-days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
      - name: Fail unsuccessful workflow
        if: ${{ steps.aggregate.outputs.overall_status != 'success' }}
        run: exit 1
  finalize_card_fallback:
    needs: [prepare, aggregate, monitor_docs_progress]
    if: ${{ always() && needs.prepare.outputs.card_id != '' && needs.monitor_docs_progress.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ needs.prepare.outputs.master_sha }}' }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.6', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: docs-card-report-${{ github.run_id }}
          path: tmp/docs-card-report
      - name: Perform best-effort terminal card update
        continue-on-error: true
        run: node scripts/docs-workflow/monitor-docs-progress.js --finalize-only --report-file tmp/docs-card-report/card-report.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CARD_ID: ${{ needs.prepare.outputs.card_id }}
          CARD_STARTED_AT: ${{ needs.prepare.outputs.card_started_at }}
          CARD_TARGET_BRANCH: ${{ needs.prepare.outputs.target_branch }}
          SELECTED_GROUP: ${{ needs.prepare.outputs.selected_group }}
          PUBLISH_ENABLED: ${{ needs.prepare.outputs.publish }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          FEISHU_HOST: ${{ vars.FEISHU_HOST }}
