name: monitor translation progress

on:
  workflow_call:
    inputs:
      tooling_sha: { required: true, type: string }
      card_id: { required: true, type: string }
      card_started_at: { required: true, type: string }
      handoff_json: { required: true, type: string }
      request_id: { required: true, type: string }
      publish_enabled: { required: true, type: boolean }
    secrets:
      APP_ID: { required: true }
      APP_SECRET: { required: true }

permissions:
  actions: read
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.tooling_sha }}', fetch-depth: 1 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.6', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Monitor Translation card
        run: node scripts/docs-workflow/monitor-translation-progress.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CARD_ID: ${{ inputs.card_id }}
          CARD_STARTED_AT: ${{ inputs.card_started_at }}
          HANDOFF_JSON: ${{ inputs.handoff_json }}
          REQUEST_ID: ${{ inputs.request_id }}
          PUBLISH_ENABLED: ${{ inputs.publish_enabled }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          FEISHU_HOST: ${{ vars.FEISHU_HOST }}
