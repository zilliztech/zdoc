name: monitor translation progress

on:
  workflow_call:
    inputs:
      tooling_sha: { required: true, type: string }
      card_id: { required: true, type: string }
      card_started_at: { required: true, type: string }
      handoff_json: { required: true, type: string }
      request_id: { required: true, type: string }
      publish_enabled: { required: true, type: boolean }
      publication_run_attempt: { required: true, type: number }
      publication_selection_sha256: { required: false, type: string, default: '' }
      operator_recovery: { required: false, type: boolean, default: false }
    secrets:
      APP_ID: { required: true }
      APP_SECRET: { required: true }

permissions:
  actions: read
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ inputs.tooling_sha }}', fetch-depth: 1 }
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22.6', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Monitor Translation card
        run: node scripts/docs-workflow/monitor-translation-progress.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CARD_ID: ${{ inputs.card_id }}
          CARD_STARTED_AT: ${{ inputs.card_started_at }}
          HANDOFF_JSON: ${{ inputs.handoff_json }}
          REQUEST_ID: ${{ inputs.request_id }}
          PUBLISH_ENABLED: ${{ inputs.publish_enabled }}
          PUBLICATION_RUN_ATTEMPT: ${{ inputs.publication_run_attempt }}
          PUBLICATION_SELECTION_SHA256: ${{ inputs.publication_selection_sha256 }}
          OPERATOR_RECOVERY: ${{ inputs.operator_recovery }}
          TRANSLATION_RESULTS_MAX_POLLS: ${{ vars.TRANSLATION_RESULTS_MAX_POLLS || '5' }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          FEISHU_HOST: ${{ vars.FEISHU_HOST }}
