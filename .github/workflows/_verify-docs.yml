name: verify final docs state

on:
  workflow_call:
    inputs:
      final_dev_sha:
        required: true
        type: string
      master_sha:
        required: true
        type: string
      target_branch:
        required: false
        type: string
        default: dev
    outputs:
      status:
        description: passed or failed
        value: ${{ jobs.verify.outputs.status }}
      revision_status:
        description: passed or failed
        value: ${{ jobs.verify.outputs.revision_status }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      status: ${{ steps.result.outputs.status }}
      revision_status: ${{ steps.revision_result.outputs.status }}
    env:
      FINAL_DEV_SHA: ${{ inputs.final_dev_sha }}
      MASTER_SHA: ${{ inputs.master_sha }}
      TARGET_BRANCH: ${{ inputs.target_branch }}
    steps:
      - name: Validate immutable inputs
        run: |
          [[ "$FINAL_DEV_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "final_dev_sha must be a lowercase 40-character SHA" >&2; exit 1; }
          [[ "$MASTER_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "master_sha must be a lowercase 40-character SHA" >&2; exit 1; }
          git check-ref-format --branch "$TARGET_BRANCH"
      - name: Check out immutable master tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.master_sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.6'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Materialize exact final dev state
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$FINAL_DEV_SHA"
          git worktree add --detach "$RUNNER_TEMP/final-dev" "$FINAL_DEV_SHA"
          bash scripts/restore-generated-state.sh --exact --ref "$FINAL_DEV_SHA"
      - name: Verify revision waterline
        id: revision
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p tmp/final-verification-reports
          pnpm check:localization-input-inventory 2>&1 | tee tmp/final-verification-reports/localization-input-inventory.log
          pnpm docs-tooling validate-revision-inventory --site en 2>&1 | tee tmp/final-verification-reports/revision-inventory.log
      - name: Emit revision reconciliation result
        id: revision_result
        if: ${{ always() }}
        run: |
          if [[ "${{ steps.revision.outcome }}" == success ]]; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify final documentation state
        id: verification
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p tmp/final-verification-reports
          pnpm docs-tooling validate-reference --site zh-CN 2>&1 | tee tmp/final-verification-reports/zh-cn-reference.log
          pnpm docs-tooling validate-group --site zh-CN --group guides 2>&1 | tee tmp/final-verification-reports/zh-cn-guides.log
          node scripts/validate-generated-sidebars.js --site en 2>&1 | tee tmp/final-verification-reports/sidebars-en.log
          node scripts/validate-generated-sidebars.js --site zh-CN 2>&1 | tee tmp/final-verification-reports/sidebars-zh-cn.log
          for group in guides python java node go cli rest; do
            node scripts/validate-translated-coverage.js --group "$group"
          done 2>&1 | tee tmp/final-verification-reports/translated-coverage.log
          node scripts/run-doc-build-stage.js --build "pnpm run build:en" --skipCardReporting 2>&1 | tee tmp/final-verification-reports/build-en.log
          node scripts/run-doc-build-stage.js --build "pnpm run build:zh-CN" --skipCardReporting 2>&1 | tee tmp/final-verification-reports/build-zh-cn.log
          node scripts/validate-workflow-policy.js 2>&1 | tee tmp/final-verification-reports/workflow-policy.log
          pnpm test:typescript-runtime-boundary 2>&1 | tee tmp/final-verification-reports/typescript-runtime-boundary.log
          node --test scripts/sdk-reference-workflow.test.js scripts/restore-generated-state.test.js scripts/validate-workflow-policy.test.js scripts/docs-workflow/aggregate-results.test.js scripts/docs-workflow/build-aggregate-input.test.js scripts/docs-workflow/apply-checkpoint-artifact.test.js scripts/docs-workflow/checkpoint-contention.test.js scripts/docs-workflow/content-groups.test.js scripts/docs-workflow/create-checkpoint-artifact.test.js scripts/docs-workflow/publish-checkpoint.test.js scripts/docs-workflow/run-content-group.test.js scripts/docs-workflow/validate-checkpoint-artifact.test.js 2>&1 | tee tmp/final-verification-reports/tests.log
      - name: Upload final verification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: final-docs-verification-${{ github.run_id }}
          path: tmp/final-verification-reports
          if-no-files-found: ignore
      - name: Emit verification result
        id: result
        if: ${{ always() }}
        run: |
          if [[ "${{ steps.revision.outcome }}" == success && "${{ steps.verification.outcome }}" == success ]]; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi
      - name: Clean up final dev worktree
        if: ${{ always() }}
        run: git worktree remove --force "$RUNNER_TEMP/final-dev" 2>/dev/null || true
      - name: Fail unsuccessful verification
        if: ${{ steps.result.outputs.status == 'failed' }}
        run: exit 1
