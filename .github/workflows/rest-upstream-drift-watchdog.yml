name: rest upstream drift watchdog

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  FEISHU_NOTIFICATIONS_DISABLED: ${{ vars.FEISHU_NOTIFICATIONS_DISABLED || '' }}

concurrency:
  group: rest-upstream-drift-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out immutable tooling revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v5

      # Source-tree sources (milvus) are classified by running the vendored Go
      # extractor (design §6.1, decision D3): Go is installed only here and in
      # the refresh workflow, never in the regular build chain.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Read-only drift check: the lock pins upstream commits and is never
      # written here; pins move only through reviewed rest-upstream-refresh PRs.
      # The private zilliztech/zilliz-cloud source needs contents:read —
      # REST_UPSTREAM_GITHUB_TOKEN, falling back to PRODUCT_DOC_LINKS_GITHUB_TOKEN.
      - name: Scan REST upstream drift
        id: scan
        env:
          REST_UPSTREAM_GITHUB_TOKEN: ${{ secrets.REST_UPSTREAM_GITHUB_TOKEN || secrets.PRODUCT_DOC_LINKS_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/rest-upstream/drift-watchdog.js --out tmp/rest-upstream-watchdog
          node <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('tmp/rest-upstream-watchdog/watchdog-report.json', 'utf8'))
          const drifting = report.sources.filter(source => source.status !== 'no-drift')
          for (const source of report.sources) {
            if (typeof source.id !== 'string' || typeof source.status !== 'string') throw new Error('malformed watchdog report source')
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `drifting_count=${drifting.length}\ncard_status=${drifting.length === 0 ? 'success' : 'fail'}\n`)
          NODE

      # Auto-refresh linkage (design: .claude/plans/2026-11-09-rest-upstream-
      # auto-refresh-linkage.md): turn the drift report into a validated
      # dispatch plan and, unless the kill switch var is set, dispatch one
      # rest-upstream-refresh run per drifting source. The plan is written
      # before the artifact upload below so the evidence always lands, and
      # every dispatch decision is made inside the script — no model writes
      # any structured data on this path. Runs before the upload on purpose
      # (dispatch-plan.json rides the drift artifact); the upload/summary
      # steps carry always() so a dispatch failure still leaves the evidence.
      - name: Dispatch refresh for drifting sources
        id: dispatch
        if: ${{ steps.scan.conclusion == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.REST_UPSTREAM_REFRESH_PAT }}
          REST_UPSTREAM_AUTO_REFRESH_DISABLED: ${{ vars.REST_UPSTREAM_AUTO_REFRESH_DISABLED || '' }}
        run: |
          args=()
          if [ -n "$REST_UPSTREAM_AUTO_REFRESH_DISABLED" ]; then
            echo "::notice::REST_UPSTREAM_AUTO_REFRESH_DISABLED is set; the dispatch plan is computed but nothing is dispatched."
          elif [ -z "$GH_TOKEN" ]; then
            echo "::notice::REST_UPSTREAM_REFRESH_PAT is not configured; the dispatch plan stays unverified and nothing is dispatched."
          else
            args+=(--execute)
          fi
          node scripts/rest-upstream/dispatch-refresh.js \
            --report tmp/rest-upstream-watchdog/watchdog-report.json \
            --lock packages/docs-tooling/src/reference/rest/meta/upstream/rest-upstream-lock.json \
            --out tmp/rest-upstream-watchdog/dispatch-plan.json \
            --repo "$GITHUB_REPOSITORY" \
            --token-env GH_TOKEN \
            "${args[@]}"

      - name: Upload drift report
        # Runs whenever the scan produced files — including after a dispatch
        # failure — so the report and the dispatch plan always land. A failed
        # scan has no files and must not add a misleading second red step.
        if: ${{ always() && steps.scan.conclusion == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: rest-upstream-drift-${{ github.run_id }}
          path: tmp/rest-upstream-watchdog
          if-no-files-found: error
          retention-days: 14

      - name: Append report to step summary
        if: ${{ always() }}
        run: |
          test -f tmp/rest-upstream-watchdog/watchdog-report.md || { echo '::notice::No watchdog report was produced; see the scan step for the failure.'; exit 0; }
          cat tmp/rest-upstream-watchdog/watchdog-report.md >> "$GITHUB_STEP_SUMMARY"
          test ! -f tmp/rest-upstream-watchdog/dispatch-plan.md || cat tmp/rest-upstream-watchdog/dispatch-plan.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create documentation site report card
        id: report_card
        continue-on-error: true
        run: pnpm docs-tooling report-card create --title "REST Upstream Drift Watchdog" --stages "Scan REST upstream drift"
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          FEISHU_HOST: ${{ vars.FEISHU_HOST }}

      - name: Attach documentation site report note
        if: ${{ steps.report_card.outputs.card_id != '' }}
        continue-on-error: true
        run: pnpm docs-tooling report-card note --file tmp/rest-upstream-watchdog/watchdog-report.md
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          FEISHU_HOST: ${{ vars.FEISHU_HOST }}

      - name: Finish documentation site report card
        if: ${{ steps.report_card.outputs.card_id != '' }}
        continue-on-error: true
        run: |
          pnpm docs-tooling report-card finish \
            --message-id "$CARD_ID" \
            --started-at "$CARD_STARTED_AT" \
            --stages "$CARD_STAGES" \
            --title "$CARD_TITLE" \
            --status "$CARD_STATUS"
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          FEISHU_HOST: ${{ vars.FEISHU_HOST }}
          CARD_ID: ${{ steps.report_card.outputs.card_id }}
          CARD_STARTED_AT: ${{ steps.report_card.outputs.card_started_at }}
          CARD_STAGES: ${{ steps.report_card.outputs.card_stages }}
          CARD_TITLE: ${{ steps.report_card.outputs.card_title }}
          CARD_STATUS: ${{ steps.scan.outputs.card_status }}
