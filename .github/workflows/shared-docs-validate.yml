name: shared docs validate
run-name: shared-docs-validate ${{ inputs.request_id || github.event.pull_request.number }}

on:
  # master plus the two stacking bases (see site-validation.yml): a stacked
  # PR never fires these triggers on a base the allowlist omits.
  pull_request:
    branches: [master, 'feat/**', 'rest-upstream-refresh/**']
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      source_sha:
        description: Exact PR head to validate
        required: true
        type: string
      base_sha:
        description: Exact PR comparison base
        required: true
        type: string
      request_id:
        description: Optional caller identity for run discovery
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: shared-docs-validate-${{ github.event.pull_request.number || inputs.pr_number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: shared-docs-validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate immutable PR identities
        id: identity
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || inputs.source_sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            test "$GITHUB_SHA" = "$SOURCE_SHA"
          fi
          printf 'source_sha=%s\nbase_sha=%s\n' "$SOURCE_SHA" "$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.identity.outputs.source_sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Detect shared input changes
        id: changes
        env:
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
          BASE_SHA: ${{ steps.identity.outputs.base_sha }}
        run: node packages/docs-tooling/src/shared-docs/adapters/detect-groups.cjs

      - name: Report unchanged shared inputs
        if: steps.changes.outputs.changed != 'true'
        run: echo 'No shared-docs inputs changed; validation passed without dependency installation or generation.' >> "$GITHUB_STEP_SUMMARY"

      - name: Install pnpm
        if: steps.changes.outputs.changed == 'true'
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install tooling
        if: steps.changes.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Read public source configuration
        id: source
        if: steps.changes.outputs.changed == 'true'
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { loadTypeScript } = require('./scripts/lib/load-typescript');
          const { parseSourceConfig } = loadTypeScript(path.resolve('packages/docs-tooling/src/shared-docs/core/config.ts'));
          const groups = fs.readFileSync(`${process.env.RUNNER_TEMP}/shared-docs-groups`, 'utf8').split('\n').filter(Boolean);
          const sources = {};
          for (const group of groups) {
            const result = parseSourceConfig(fs.readFileSync(`shared-docs/${group}/source.yaml`, 'utf8'));
            if ('errors' in result) throw new Error(JSON.stringify(result.errors));
            const { repository, track } = result.config;
            if (!/^https:\/\/github\.com\/[A-Za-z0-9][A-Za-z0-9-]*\/[A-Za-z0-9_.-]+(?:\.git)?$/.test(repository) || /\/(?:\.|\.\.)(?:\.git)?$/.test(repository)) {
              throw new Error(`Source repository for ${group} must be a credential-free GitHub HTTPS repository URL`);
            }
            sources[group] = { repository, track };
          }
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/shared-docs-sources.json`, JSON.stringify(sources));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sources=${JSON.stringify(sources)}\n`);
          NODE

      - name: Clone complete tracking history
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const sources = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/shared-docs-sources.json`, 'utf8'));
          for (const [group, { repository, track }] of Object.entries(sources)) {
            const target = `${process.env.RUNNER_TEMP}/upstream/${group}`;
            execFileSync('git', ['clone', '--single-branch', '--branch', track, '--no-tags', repository, target], { stdio: ['ignore', 'inherit', 'inherit'] });
            execFileSync('git', ['-C', target, 'show-ref', '--verify', `refs/heads/${track}`], { stdio: ['ignore', 'inherit', 'inherit'] });
            if (execFileSync('git', ['-C', target, 'rev-parse', '--is-shallow-repository'], { encoding: 'utf8' }).trim() !== 'false') {
              throw new Error(`Tracking clone for ${group} must have complete history`);
            }
          }
          NODE

      - name: Resolve exact upstream dev snapshot
        id: dev
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git ls-remote --exit-code https://github.com/zilliztech/zdoc.git refs/heads/dev > "$RUNNER_TEMP/shared-docs-dev-ref"
          node <<'NODE'
          const fs = require('node:fs');
          const match = /^([0-9a-f]{40})\trefs\/heads\/dev\n$/.exec(fs.readFileSync(process.env.RUNNER_TEMP + '/shared-docs-dev-ref', 'utf8'));
          if (!match) throw new Error('Upstream dev identity is unavailable or ambiguous');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${match[1]}\n`);
          NODE

      - name: Check out read-only upstream dev snapshot
        if: steps.changes.outputs.changed == 'true'
        uses: actions/checkout@v5
        with:
          repository: zilliztech/zdoc
          ref: ${{ steps.dev.outputs.sha }}
          path: .shared-docs-dev
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /content/en/guides/
            /content/en/byoc/
            /packages/docs-tooling/src/lark/meta/snapshots/guides-uat-last-success.json
            /content/en/reference/

      - name: Prepare validation metadata for initial pages
        id: initial
        if: steps.changes.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ steps.identity.outputs.base_sha }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
          DEV_SHA: ${{ steps.dev.outputs.sha }}
          DEV_SNAPSHOT: .shared-docs-dev
          VALIDATION_FIXTURE: ${{ runner.temp }}/shared-docs-initial-validation
        run: node packages/docs-tooling/src/shared-docs/adapters/initial-validation.cjs

      - name: Generate all shared pages
        if: steps.changes.outputs.changed == 'true'
        env:
          VALIDATION_DEV: ${{ steps.initial.outputs.dev }}
        run: |
          set -euo pipefail
          status=0
          : > "$RUNNER_TEMP/shared-docs-validation.log"
          while IFS= read -r group; do
            pnpm docs-tooling shared-docs build --shared-docs "shared-docs/$group" --repo "$RUNNER_TEMP/upstream/$group" \
              --dev "$VALIDATION_DEV" --out "$RUNNER_TEMP/shared-docs-output/$group" >> "$RUNNER_TEMP/shared-docs-validation.log" 2>&1 || status=$?
          done < "$RUNNER_TEMP/shared-docs-groups"
          cat "$RUNNER_TEMP/shared-docs-validation.log"
          node <<'NODE'
          const fs = require('node:fs');
          const log = fs.readFileSync(process.env.RUNNER_TEMP + '/shared-docs-validation.log', 'utf8');
          const excerpt = log.split('\n').slice(-200).join('\n').slice(-32000).replace(/```/g, '[code fence]');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Shared docs generation diagnostics (last 200 lines, up to 32000 characters):\n\n\`\`\`text\n${excerpt}\n\`\`\`\n`);
          NODE
          exit "$status"
