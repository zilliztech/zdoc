name: translate docs with Codex agents
run-name: ${{ inputs.request_id != '' && format('translate docs ({0})', inputs.request_id) || 'translate docs' }}

on:
  workflow_dispatch:
    inputs:
      handoff_json: { description: Complete schema-v2 translation handoff, required: true, type: string }
      mode: { description: Translation mode, required: false, type: choice, options: [auto, full, incremental], default: auto }
      publish: { description: Publish validated translations, required: false, type: boolean, default: false }
      recovery_run_ids_json: { description: Recovery run IDs by target/group, required: false, type: string, default: '{}' }
      request_id: { description: Parent workflow correlation ID, required: false, type: string, default: '' }
  workflow_call:
    inputs:
      handoff_json: { description: Complete schema-v2 translation handoff, required: true, type: string }
      mode: { required: false, type: string, default: auto }
      publish: { required: false, type: boolean, default: false }
      recovery_run_ids_json: { required: false, type: string, default: '{}' }
      request_id: { required: false, type: string, default: '' }
      recovery_bundle_artifact_name: { required: false, type: string, default: '' }
      recovery_plan_sha256: { required: false, type: string, default: '' }
      recovery_provenance_json: { required: false, type: string, default: '' }
      production_queue_owned: { required: false, type: boolean, default: false }
      allow_full_retranslate: { required: false, type: boolean, default: false }
    secrets:
      TRANSLATION_AGENT_API_KEY: { required: true }
      REVIEW_AGENT_API_KEY: { required: true }
      APP_ID: { required: false }
      APP_SECRET: { required: false }

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ inputs.publish && !(inputs.production_queue_owned || false) && 'docs-production-dev' || format('translation-readonly-{0}', github.run_id) }}
  queue: max

jobs:
  initialize_translation_card:
    if: ${{ inputs.request_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      card_id: ${{ steps.card.outputs.card_id }}
      card_started_at: ${{ steps.card.outputs.card_started_at }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ github.sha }}', fetch-depth: 1 }
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22.6', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: target
        name: Validate card handoff target
        env: { HANDOFF_JSON: '${{ inputs.handoff_json }}' }
        run: node -e 'const fs=require("node:fs");const {validateTranslationHandoff}=require("./scripts/docs-workflow/translation-handoff");const value=validateTranslationHandoff(JSON.parse(process.env.HANDOFF_JSON));fs.appendFileSync(process.env.GITHUB_OUTPUT,"target_branch="+value.targetBranch+"\n")'
      - id: card
        name: Create Translation progress card
        continue-on-error: true
        run: pnpm docs-tooling report-card create --title "Zilliz Cloud Docs Translation" --stages "Prepare,Translate,Publish,Aggregate" --target-branch "$TARGET_BRANCH"
        env:
          TARGET_BRANCH: ${{ steps.target.outputs.target_branch }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          FEISHU_HOST: ${{ vars.FEISHU_HOST }}

  monitor_translation_progress:
    needs: [initialize_translation_card, prepare]
    if: ${{ always() && needs.initialize_translation_card.outputs.card_id != '' }}
    uses: ./.github/workflows/_monitor-translation-progress.yml
    with:
      tooling_sha: ${{ github.sha }}
      card_id: ${{ needs.initialize_translation_card.outputs.card_id }}
      card_started_at: ${{ needs.initialize_translation_card.outputs.card_started_at }}
      handoff_json: ${{ inputs.handoff_json }}
      request_id: ${{ inputs.request_id }}
      publish_enabled: ${{ inputs.publish }}
      publication_run_attempt: ${{ fromJSON(github.run_attempt) }}
      publication_selection_sha256: ${{ needs.prepare.outputs.publication_selection_sha256 }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}

  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      locale: ${{ steps.handoff.outputs.locale }}
      group: ${{ steps.handoff.outputs.group }}
      tooling_sha: ${{ steps.handoff.outputs.tooling_sha }}
      target_branch: ${{ steps.handoff.outputs.target_branch }}
      target_branch_sha: ${{ steps.handoff.outputs.target_branch_sha }}
      source_checkpoints_json: ${{ steps.handoff.outputs.source_checkpoints_json }}
      sdk_producer_matrix: ${{ steps.handoff.outputs.sdk_producer_matrix }}
      sdk_count: ${{ steps.handoff.outputs.sdk_count }}
      guides_selected: ${{ steps.handoff.outputs.guides_selected }}
      guides_unit_json: ${{ steps.handoff.outputs.guides_unit_json }}
      guides_recovery_run_id: ${{ steps.handoff.outputs.guides_recovery_run_id }}
      publication_selection_artifact_name: ${{ steps.publication_selection.outputs.artifact_name }}
      publication_selection_sha256: ${{ steps.publication_selection.outputs.selection_sha256 }}
    steps:
      - name: Validate exact tooling identity before checkout
        id: identity
        env: { HANDOFF_JSON: '${{ inputs.handoff_json }}' }
        run: node -e 'const fs=require("node:fs");const value=JSON.parse(process.env.HANDOFF_JSON);if(!/^[0-9a-f]{40}$/.test(value?.toolingSha))throw new Error("handoff toolingSha must be an exact lowercase 40-character SHA");fs.appendFileSync(process.env.GITHUB_OUTPUT,"tooling_sha="+value.toolingSha+"\n")'
      - uses: actions/checkout@v5
        with: { ref: '${{ steps.identity.outputs.tooling_sha }}', fetch-depth: 0 }
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22.6', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Download authenticated recovery plan
        if: ${{ (inputs.recovery_bundle_artifact_name || '') != '' }}
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.recovery_bundle_artifact_name || '' }}
          path: ${{ runner.temp }}/translation-recovery-bundle
      - name: Resolve and validate the complete translation handoff
        id: handoff
        env:
          HANDOFF_JSON: ${{ inputs.handoff_json }}
          RECOVERY_RUN_IDS_JSON: ${{ inputs.recovery_run_ids_json }}
          RECOVERY_BUNDLE_ARTIFACT_NAME: ${{ inputs.recovery_bundle_artifact_name || '' }}
          RECOVERY_PLAN_SHA256: ${{ inputs.recovery_plan_sha256 || '' }}
          RECOVERY_PROVENANCE_JSON: ${{ inputs.recovery_provenance_json || '' }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          [[ -z "$REQUEST_ID" || "$REQUEST_ID" =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]]
          HANDOFF_PATH="$RUNNER_TEMP/translation-handoff-input.json" FETCH_LIST_PATH="$RUNNER_TEMP/translation-handoff-fetches.txt" node - <<'NODE'
          const fs = require('node:fs')
          const handoff = JSON.parse(process.env.HANDOFF_JSON)
          fs.writeFileSync(process.env.HANDOFF_PATH, `${JSON.stringify(handoff)}\n`)
          const shas = [...new Set((handoff.units || []).flatMap(unit => [unit.sourceBaselineSha, unit.sourceCheckpointSha]))]
          fs.writeFileSync(process.env.FETCH_LIST_PATH, `${shas.join('\n')}\n`)
          NODE
          while IFS= read -r sha; do
            [[ -z "$sha" ]] || git fetch --no-tags origin "$sha"
          done < "$RUNNER_TEMP/translation-handoff-fetches.txt"
          TARGET_BRANCH=$(node -p 'JSON.parse(process.env.HANDOFF_JSON).targetBranch')
          EXPECTED_TARGET_SHA=$(node -p 'JSON.parse(process.env.HANDOFF_JSON).targetBaselineSha')
          git check-ref-format --branch "$TARGET_BRANCH"
          git fetch --no-tags origin "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          target_branch_sha=$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH^{commit}")
          [[ "$target_branch_sha" == "$EXPECTED_TARGET_SHA" ]] || { echo "Target branch moved after handoff: expected $EXPECTED_TARGET_SHA, got $target_branch_sha" >&2; exit 1; }
          node scripts/docs-workflow/translation-handoff.js --handoff-json "$HANDOFF_JSON" --repository "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/translation-handoff.json"
          HANDOFF_PATH="$RUNNER_TEMP/translation-handoff.json" TARGET_BRANCH_SHA="$target_branch_sha" node - <<'NODE'
          const fs = require('node:fs')
          const handoff = JSON.parse(fs.readFileSync(process.env.HANDOFF_PATH, 'utf8'))
          const recovery = JSON.parse(process.env.RECOVERY_RUN_IDS_JSON)
          if (!recovery || typeof recovery !== 'object' || Array.isArray(recovery)) throw new Error('recovery_run_ids_json must be an object')
          for (const [key, value] of Object.entries(recovery)) {
            if (!handoff.units.some(unit => `${unit.target}/${unit.group}` === key)) throw new Error(`Recovery run ID is not selected: ${key}`)
            if (value !== '' && !/^[1-9][0-9]*$/.test(String(value))) throw new Error(`Recovery run ID is invalid: ${key}`)
          }
          const bundleValues = [process.env.RECOVERY_BUNDLE_ARTIFACT_NAME, process.env.RECOVERY_PLAN_SHA256, process.env.RECOVERY_PROVENANCE_JSON]
          if (bundleValues.some(Boolean) && !bundleValues.every(Boolean)) throw new Error('authenticated recovery bundle identity must be complete')
          if (process.env.RECOVERY_PLAN_SHA256 && !/^[0-9a-f]{64}$/.test(process.env.RECOVERY_PLAN_SHA256)) throw new Error('recovery plan checksum is invalid')
          const sdk = handoff.units.filter(unit => unit.group !== 'guides').map(unit => ({...unit, publicationUnitKey: `translation/${unit.target}/${unit.group}`, recoveryRunId: String(recovery[`${unit.target}/${unit.group}`] || '')}))
          const guides = handoff.units.find(unit => unit.target === 'ja-JP' && unit.group === 'guides')
          const sourceCheckpoints = Object.fromEntries(handoff.units.map(unit => [unit.sourceGroup, unit.sourceCheckpointSha]))
          const lines = {
            locale: handoff.locale,
            group: handoff.group,
            tooling_sha: handoff.toolingSha,
            target_branch: handoff.targetBranch,
            target_branch_sha: process.env.TARGET_BRANCH_SHA,
            source_checkpoints_json: JSON.stringify(sourceCheckpoints),
            sdk_producer_matrix: JSON.stringify({include: sdk}),
            sdk_count: String(sdk.length),
            guides_selected: String(Boolean(guides)),
            guides_unit_json: JSON.stringify(guides || {}),
            guides_recovery_run_id: String(recovery['ja-JP/guides'] || ''),
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, Object.entries(lines).map(([key, value]) => `${key}=${value}\n`).join(''))
          NODE
      - name: Create immutable Translation publication selection
        id: publication_selection
        env:
          HANDOFF_JSON: ${{ inputs.handoff_json }}
          PUBLISH_ENABLED: ${{ inputs.publish }}
          RECOVERY_BUNDLE_ARTIFACT_NAME: ${{ inputs.recovery_bundle_artifact_name || '' }}
          RECOVERY_PLAN_SHA256: ${{ inputs.recovery_plan_sha256 || '' }}
          RECOVERY_PROVENANCE_JSON: ${{ inputs.recovery_provenance_json || '' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/publication-selection"
          recovery_args=()
          if [[ -n "$RECOVERY_BUNDLE_ARTIFACT_NAME" ]]; then
            recovery_args=(
              --recovery-plan "$RUNNER_TEMP/translation-recovery-bundle/recovery-plan.json"
              --recovery-plan-sha256 "$RECOVERY_PLAN_SHA256"
              --recovery-provenance "$RECOVERY_PROVENANCE_JSON"
            )
          fi
          node scripts/docs-workflow/translation-publication-selection.js selection \
            --handoff "$HANDOFF_JSON" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --publish "$PUBLISH_ENABLED" \
            --run-translations true \
            "${recovery_args[@]}" \
            --output "$RUNNER_TEMP/publication-selection/publication-selection.json"
          SELECTION_PATH="$RUNNER_TEMP/publication-selection/publication-selection.json" node - <<'NODE'
          const fs = require('node:fs')
          const selection = JSON.parse(fs.readFileSync(process.env.SELECTION_PATH, 'utf8'))
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `artifact_name=publication-selection-translation-${selection.runId}-${selection.runAttempt}\nselection_sha256=${selection.selectionSha256}\n`)
          NODE
      - name: Upload immutable Translation publication selection
        uses: actions/upload-artifact@v6
        with:
          name: publication-selection-translation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-selection/publication-selection.json
          if-no-files-found: error

  prepare_guides_batches:
    needs: prepare
    if: ${{ needs.prepare.outputs.guides_selected == 'true' }}
    uses: ./.github/workflows/_prepare-translation-batches.yml
    with:
      group: guides
      target: ja-JP
      tooling_sha: ${{ needs.prepare.outputs.tooling_sha }}
      source_baseline_sha: ${{ fromJSON(needs.prepare.outputs.guides_unit_json).sourceBaselineSha }}
      source_checkpoint_sha: ${{ fromJSON(needs.prepare.outputs.guides_unit_json).sourceCheckpointSha }}
      target_baseline_sha: ${{ needs.prepare.outputs.target_branch_sha }}

  translate_guides_batches:
    needs: [prepare, prepare_guides_batches]
    if: ${{ needs.prepare_guides_batches.outputs.batch_count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare_guides_batches.outputs.matrix) }}
    uses: ./.github/workflows/_translate-content-group.yml
    with:
      target: ja-JP
      group: guides
      tooling_sha: ${{ needs.prepare.outputs.tooling_sha }}
      source_baseline_sha: ${{ fromJSON(needs.prepare.outputs.guides_unit_json).sourceBaselineSha }}
      source_checkpoint_sha: ${{ fromJSON(needs.prepare.outputs.guides_unit_json).sourceCheckpointSha }}
      target_baseline_sha: ${{ needs.prepare.outputs.target_branch_sha }}
      should_translate: true
      max_files: '500'
      mode: ${{ inputs.mode }}
      recovery_run_id: ${{ needs.prepare.outputs.guides_recovery_run_id }}
      recovery_bundle_artifact_name: ${{ inputs.recovery_bundle_artifact_name || '' }}
      recovery_plan_sha256: ${{ inputs.recovery_plan_sha256 || '' }}
      allow_full_retranslate: ${{ inputs.allow_full_retranslate || false }}
      batch_index: ${{ matrix.batchIndex }}
      batch_number: ${{ matrix.batchNumber }}
      batch_count: ${{ fromJSON(needs.prepare_guides_batches.outputs.batch_count) }}
      batch_size: ${{ fromJSON(needs.prepare_guides_batches.outputs.batch_size) }}
      pending_count: ${{ fromJSON(needs.prepare_guides_batches.outputs.pending_count) }}
      pending_set_sha256: ${{ needs.prepare_guides_batches.outputs.pending_set_sha256 }}
      publication_selection_artifact_name: ${{ needs.prepare.outputs.publication_selection_artifact_name }}
      publication_selection_sha256: ${{ needs.prepare.outputs.publication_selection_sha256 }}
      publication_unit_key: translation/ja-JP/guides
    secrets:
      TRANSLATION_AGENT_API_KEY: ${{ secrets.TRANSLATION_AGENT_API_KEY }}
      REVIEW_AGENT_API_KEY: ${{ secrets.REVIEW_AGENT_API_KEY }}

  translate_sdk:
    needs: prepare
    if: ${{ needs.prepare.outputs.sdk_count != '0' }}
    name: translate:${{ matrix.target }}/${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.sdk_producer_matrix) }}
    uses: ./.github/workflows/_translate-content-group.yml
    with:
      target: ${{ matrix.target }}
      group: ${{ matrix.group }}
      bootstrap_group: ${{ matrix.group }}
      tooling_sha: ${{ needs.prepare.outputs.tooling_sha }}
      source_baseline_sha: ${{ matrix.sourceBaselineSha }}
      source_checkpoint_sha: ${{ matrix.sourceCheckpointSha }}
      target_baseline_sha: ${{ needs.prepare.outputs.target_branch_sha }}
      should_translate: true
      max_files: '500'
      mode: ${{ inputs.mode }}
      recovery_run_id: ${{ matrix.recoveryRunId }}
      recovery_bundle_artifact_name: ${{ inputs.recovery_bundle_artifact_name || '' }}
      recovery_plan_sha256: ${{ inputs.recovery_plan_sha256 || '' }}
      allow_full_retranslate: ${{ inputs.allow_full_retranslate || false }}
      publication_selection_artifact_name: ${{ needs.prepare.outputs.publication_selection_artifact_name }}
      publication_selection_sha256: ${{ needs.prepare.outputs.publication_selection_sha256 }}
      publication_unit_key: ${{ matrix.publicationUnitKey }}
    secrets:
      TRANSLATION_AGENT_API_KEY: ${{ secrets.TRANSLATION_AGENT_API_KEY }}
      REVIEW_AGENT_API_KEY: ${{ secrets.REVIEW_AGENT_API_KEY }}

  prepare_guides_publication_ready:
    needs: [prepare, prepare_guides_batches, translate_guides_batches]
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.guides_selected == 'true' && needs.prepare_guides_batches.result == 'success' && (needs.translate_guides_batches.result == 'success' || needs.translate_guides_batches.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      BATCH_COUNT: ${{ needs.prepare_guides_batches.outputs.batch_count }}
      PENDING_SET_SHA256: ${{ needs.prepare_guides_batches.outputs.pending_set_sha256 }}
      SOURCE_CHECKPOINT_SHA: ${{ fromJSON(needs.prepare.outputs.guides_unit_json).sourceCheckpointSha }}
      TOOLING_SHA: ${{ needs.prepare.outputs.tooling_sha }}
      EXPECTED_TARGET_SHA: ${{ needs.prepare.outputs.target_branch_sha }}
      PUBLICATION_SELECTION_SHA256: ${{ needs.prepare.outputs.publication_selection_sha256 }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ needs.prepare.outputs.tooling_sha }}', fetch-depth: 0 }
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22.6', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Download immutable Translation publication selection
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.prepare.outputs.publication_selection_artifact_name }}
          path: ${{ runner.temp }}/publication-selection
      - name: Download complete Guides translation checkpoints
        if: ${{ needs.prepare_guides_batches.outputs.batch_count != '0' }}
        uses: actions/download-artifact@v7
        with:
          pattern: translation-checkpoint-ja-JP-guides-${{ github.run_id }}-batch-*
          path: ${{ runner.temp }}/translation-checkpoints
      - name: Download complete Guides translation baselines
        if: ${{ needs.prepare_guides_batches.outputs.batch_count != '0' }}
        uses: actions/download-artifact@v7
        with:
          pattern: translation-baseline-ja-JP-guides-${{ github.run_id }}-batch-*
          path: ${{ runner.temp }}/translation-baselines
      - name: Validate and package complete Guides translation batch set
        run: |
          set -euo pipefail
          selection="$RUNNER_TEMP/publication-selection/publication-selection.json"
          node scripts/docs-workflow/publication-contracts.js validate-selection "$selection"
          node - <<'NODE'
          const crypto = require('node:crypto')
          const fs = require('node:fs')
          const selection = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/publication-selection/publication-selection.json`, 'utf8'))
          if (selection.selectionSha256 !== process.env.PUBLICATION_SELECTION_SHA256) throw new Error('publication selection checksum mismatch')
          if (!selection.units.some(unit => unit.unitKey === 'translation/ja-JP/guides')) throw new Error('Guides publication unit is not selected')
          NODE
          mkdir -p "$RUNNER_TEMP/guides-ready"
          if [[ "$BATCH_COUNT" == 0 ]]; then
            RUNNER_TEMP="$RUNNER_TEMP" node -e 'const fs = require("node:fs"); const root = process.env.RUNNER_TEMP + "/guides-ready"; const plan = {schemaVersion: 1, group: "guides", batchCount: 0, pendingSetSha256: process.env.PENDING_SET_SHA256, sourceCheckpointSha: process.env.SOURCE_CHECKPOINT_SHA, targetSha: process.env.EXPECTED_TARGET_SHA}; const manifest = {schemaVersion: 1, stage: "translation-guides-batch-set", group: "guides", runId: Number(process.env.GITHUB_RUN_ID), runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT), sourceCheckpointSha: process.env.SOURCE_CHECKPOINT_SHA, toolingSha: process.env.TOOLING_SHA, targetSha: process.env.EXPECTED_TARGET_SHA, batchCount: 0, pendingSetSha256: process.env.PENDING_SET_SHA256}; fs.writeFileSync(root + "/translation-plan.json", JSON.stringify(plan) + "\n"); fs.writeFileSync(root + "/checkpoint-manifest.json", JSON.stringify(manifest) + "\n"); fs.writeFileSync(root + "/baseline-manifest.json", JSON.stringify(manifest) + "\n");'
          else
          node scripts/docs-workflow/translation-artifact-pairs.js \
            --checkpoints-root "$RUNNER_TEMP/translation-checkpoints" \
            --baselines-root "$RUNNER_TEMP/translation-baselines" \
            --target ja-JP --group guides --run-id "$GITHUB_RUN_ID" --batch-count "$BATCH_COUNT" \
            --output "$RUNNER_TEMP/guides-artifact-pairs.json"
          PAIRS="$RUNNER_TEMP/guides-artifact-pairs.json" node - <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const pairs = JSON.parse(fs.readFileSync(process.env.PAIRS, 'utf8'))
          const root = `${process.env.RUNNER_TEMP}/guides-ready`
          const rows = pairs.pairs.map(pair => ({
            artifactDir: path.join(root, `result-${pair.batchNumber}`, 'checkpoint-group'),
            baselineDir: path.join(root, `baseline-${pair.batchNumber}`, 'checkpoint-group'),
            resultArchive: pair.resultArchive,
            baselineArchive: pair.baselineArchive,
          }))
          fs.writeFileSync(path.join(root, 'extract.tsv'), rows.map(row => `${row.resultArchive}\t${row.baselineArchive}\t${row.artifactDir}\t${row.baselineDir}`).join('\n') + '\n')
          NODE
          while IFS=$'\t' read -r result_archive baseline_archive result_dir baseline_dir; do
            mkdir -p "$(dirname "$result_dir")" "$(dirname "$baseline_dir")"
            tar -xf "$result_archive" -C "$(dirname "$result_dir")"
            tar -xf "$baseline_archive" -C "$(dirname "$baseline_dir")"
          done < "$RUNNER_TEMP/guides-ready/extract.tsv"
          git fetch --no-tags origin "$SOURCE_CHECKPOINT_SHA" "$EXPECTED_TARGET_SHA"
          node - <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const root = `${process.env.RUNNER_TEMP}/guides-ready`
          const rows = fs.readFileSync(path.join(root, 'extract.tsv'), 'utf8').trim().split('\n').map(line => {
            const [, , artifactDir, baselineDir] = line.split('\t')
            return {artifactDir, baselineDir}
          })
          fs.writeFileSync(path.join(root, 'pairs-manifest.json'), `${JSON.stringify({schemaVersion: 1, group: 'guides', sourceCheckpointSha: process.env.SOURCE_CHECKPOINT_SHA, expectedTargetSha: process.env.EXPECTED_TARGET_SHA, pairs: rows})}\n`)
          NODE
          node scripts/docs-workflow/translation-batch-set.js plan \
            --pairs-manifest "$RUNNER_TEMP/guides-ready/pairs-manifest.json" \
            --source-repository "$GITHUB_WORKSPACE" --source-checkpoint-sha "$SOURCE_CHECKPOINT_SHA" \
            --target-repository "$GITHUB_WORKSPACE" --expected-target-sha "$EXPECTED_TARGET_SHA" \
            --output "$RUNNER_TEMP/guides-ready/translation-plan.json"
          RUNNER_TEMP="$RUNNER_TEMP" node - <<'NODE'
          const fs = require('node:fs')
          const plan = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/guides-ready/translation-plan.json`, 'utf8'))
          if (plan.pendingSetSha256 !== process.env.PENDING_SET_SHA256) throw new Error('Guides pending set checksum mismatch')
          const manifest = {schemaVersion: 1, stage: 'translation-guides-batch-set', group: 'guides', runId: Number(process.env.GITHUB_RUN_ID), runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT), sourceCheckpointSha: process.env.SOURCE_CHECKPOINT_SHA, toolingSha: process.env.TOOLING_SHA, targetSha: plan.targetSha, batchCount: plan.batchCount, pendingSetSha256: plan.pendingSetSha256}
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/guides-ready/checkpoint-manifest.json`, `${JSON.stringify(manifest)}\n`)
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/guides-ready/baseline-manifest.json`, `${JSON.stringify(manifest)}\n`)
          NODE
          fi
          mkdir -p "$RUNNER_TEMP/guides-ready/checkpoint/checkpoint-group/batches" "$RUNNER_TEMP/guides-ready/baseline/checkpoint-group/batches"
          cp "$RUNNER_TEMP/guides-ready/checkpoint-manifest.json" "$RUNNER_TEMP/guides-ready/checkpoint/checkpoint-group/manifest.json"
          cp "$RUNNER_TEMP/guides-ready/baseline-manifest.json" "$RUNNER_TEMP/guides-ready/baseline/checkpoint-group/manifest.json"
          cp "$RUNNER_TEMP/guides-ready/translation-plan.json" "$RUNNER_TEMP/guides-ready/checkpoint/checkpoint-group/translation-plan.json"
          cp "$RUNNER_TEMP/guides-ready/translation-plan.json" "$RUNNER_TEMP/guides-ready/baseline/checkpoint-group/translation-plan.json"
          if [[ "$BATCH_COUNT" != 0 ]]; then
            cp -a "$RUNNER_TEMP/translation-checkpoints/." "$RUNNER_TEMP/guides-ready/checkpoint/checkpoint-group/batches/"
            cp -a "$RUNNER_TEMP/translation-baselines/." "$RUNNER_TEMP/guides-ready/baseline/checkpoint-group/batches/"
          fi
          tar -cf "$RUNNER_TEMP/guides-ready/checkpoint/checkpoint-group.tar" -C "$RUNNER_TEMP/guides-ready/checkpoint" checkpoint-group
          tar -cf "$RUNNER_TEMP/guides-ready/baseline/checkpoint-group.tar" -C "$RUNNER_TEMP/guides-ready/baseline" checkpoint-group
      - name: Upload Guides translation checkpoint
        uses: actions/upload-artifact@v6
        with:
          name: translation-checkpoint-ja-JP-guides-${{ github.run_id }}
          path: ${{ runner.temp }}/guides-ready/checkpoint/checkpoint-group.tar
          if-no-files-found: error
      - name: Upload Guides translation baseline
        uses: actions/upload-artifact@v6
        with:
          name: translation-baseline-ja-JP-guides-${{ github.run_id }}
          path: ${{ runner.temp }}/guides-ready/baseline/checkpoint-group.tar
          if-no-files-found: error
      - name: Create immutable Translation ready descriptor
        run: node scripts/docs-workflow/translation-publication-selection.js ready --selection "$RUNNER_TEMP/publication-selection/publication-selection.json" --unit-key translation/ja-JP/guides --checkpoint-archive "$RUNNER_TEMP/guides-ready/checkpoint/checkpoint-group.tar" --checkpoint-manifest "$RUNNER_TEMP/guides-ready/checkpoint-manifest.json" --baseline-archive "$RUNNER_TEMP/guides-ready/baseline/checkpoint-group.tar" --baseline-manifest "$RUNNER_TEMP/guides-ready/baseline-manifest.json" --output "$RUNNER_TEMP/guides-ready/publication-ready.json"
      - name: Upload immutable Translation ready descriptor
        uses: actions/upload-artifact@v6
        with:
          name: publication-ready-translation-translation-ja-JP-guides-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/guides-ready/publication-ready.json
          if-no-files-found: error

  publish_ready:
    name: publish_ready
    needs: [prepare]
    if: ${{ needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: write
    outputs:
      results_artifact_name: ${{ steps.publish.outputs.results_artifact_name }}
      overall_status: ${{ steps.publish.outputs.overall_status }}
      final_target_sha: ${{ steps.publish.outputs.final_target_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tooling_sha }}
          fetch-depth: 0
          persist-credentials: ${{ inputs.publish }}
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22.6', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Download immutable Translation publication selection
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.prepare.outputs.publication_selection_artifact_name }}
          path: ${{ runner.temp }}/publication-selection
      - name: Validate immutable Translation publication selection
        env:
          EXPECTED_SELECTION_SHA256: ${{ needs.prepare.outputs.publication_selection_sha256 }}
          EXPECTED_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          selection="$RUNNER_TEMP/publication-selection/publication-selection.json"
          node scripts/docs-workflow/publication-contracts.js validate-selection "$selection"
          SELECTION="$selection" node - <<'NODE'
          const fs = require('node:fs')
          const selection = JSON.parse(fs.readFileSync(process.env.SELECTION, 'utf8'))
          if (selection.workflow !== 'translation') throw new Error('Translation publication selection is required')
          if (selection.repository !== process.env.GITHUB_REPOSITORY) throw new Error('publication selection repository mismatch')
          if (selection.runId !== Number(process.env.GITHUB_RUN_ID)) throw new Error('publication selection run mismatch')
          if (selection.runAttempt !== Number(process.env.GITHUB_RUN_ATTEMPT)) throw new Error('publication selection run attempt mismatch')
          if (selection.selectionSha256 !== process.env.EXPECTED_SELECTION_SHA256) throw new Error('publication selection checksum mismatch')
          if (selection.inputs.publish !== (process.env.EXPECTED_PUBLISH === 'true')) throw new Error('publication selection mode mismatch')
          NODE
      - id: publish
        name: Publish ready Translation units in producer completion FIFO order
        uses: actions/github-script@v8
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish }}
        with:
          script: |
            const mode = process.env.PUBLISH === 'true' ? 'publish' : 'artifact_only'
            await exec.exec('node', [
              'scripts/docs-workflow/publication-coordinator.js',
              '--selection', `${process.env.RUNNER_TEMP}/publication-selection/publication-selection.json`,
              '--mode', mode,
              '--poll-milliseconds', '10000',
              '--candidate-polls', '6',
              '--max-publish-attempts', '10',
            ])

  aggregate:
    needs: [prepare, publish_ready]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ needs.prepare.outputs.tooling_sha }}', fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22.6', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: artifacts
        name: Derive exact Translation publication artifact names
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const {artifactNames} = require('./scripts/docs-workflow/publication-contracts')
          const names = artifactNames({workflow: 'translation', runId: Number(process.env.GITHUB_RUN_ID), runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT), unitKey: 'translation/ja-JP/python', revision: 1})
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `selection=${names.selection}\nresults=${names.results}\n`)
          NODE
      - name: Download exact immutable Translation publication selection
        uses: actions/download-artifact@v7
        with:
          name: ${{ steps.artifacts.outputs.selection }}
          path: ${{ runner.temp }}/publication-selection
      - name: Download exact terminal Translation publication results
        uses: actions/download-artifact@v7
        with:
          name: ${{ steps.artifacts.outputs.results }}
          path: ${{ runner.temp }}/publication-results
      - id: documents
        name: Validate exact terminal Translation publication documents
        env:
          EXPECTED_SELECTION_SHA256: ${{ needs.prepare.outputs.publication_selection_sha256 }}
          EXPECTED_MODE: ${{ inputs.publish && 'publish' || 'artifact_only' }}
          SELECTION_ARTIFACT_NAME: ${{ steps.artifacts.outputs.selection }}
          RESULTS_ARTIFACT_NAME: ${{ steps.artifacts.outputs.results }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs')
          const {artifactNames, readPublicationDocument} = require('./scripts/docs-workflow/publication-contracts')
          const {summarizeTranslationPublication, validateTranslationPublicationDocuments} = require('./scripts/docs-workflow/translation-publication-results')
          const selectionPath = `${process.env.RUNNER_TEMP}/publication-selection/publication-selection.json`
          const resultsPath = `${process.env.RUNNER_TEMP}/publication-results/publication-results.json`
          const selection = readPublicationDocument(selectionPath, 'publication-selection')
          const expected = artifactNames({workflow: 'translation', runId: Number(process.env.GITHUB_RUN_ID), runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT), unitKey: selection.units[0].unitKey, revision: 1})
          if (process.env.SELECTION_ARTIFACT_NAME !== expected.selection || process.env.RESULTS_ARTIFACT_NAME !== expected.results) throw new Error('publication artifact name mismatch')
          if (selection.repository !== process.env.GITHUB_REPOSITORY) throw new Error('publication selection repository mismatch')
          if (selection.runId !== Number(process.env.GITHUB_RUN_ID)) throw new Error('publication selection run mismatch')
          if (selection.runAttempt !== Number(process.env.GITHUB_RUN_ATTEMPT)) throw new Error('publication selection run attempt mismatch')
          if (selection.selectionSha256 !== process.env.EXPECTED_SELECTION_SHA256) throw new Error('publication selection checksum mismatch')
          const results = readPublicationDocument(resultsPath, 'publication-results', {selection})
          validateTranslationPublicationDocuments({selection, results})
          if (results.mode !== process.env.EXPECTED_MODE) throw new Error('publication results mode mismatch')
          if (results.overallStatus !== 'success') throw new Error(`Translation publication did not succeed: ${results.overallStatus}`)
          const allowed = results.mode === 'publish' ? new Set(['published', 'no_changes']) : new Set(['ready'])
          if (results.units.some(unit => !allowed.has(unit.status))) throw new Error('Translation publication results are not terminal successes')
          const summary = summarizeTranslationPublication({selection, results})
          const recoveryProvenance = selection.inputs.recoveryProvenance
          const recoveryLine = recoveryProvenance ? `\n- Recovery source: ${recoveryProvenance.sourceRunId} attempt ${recoveryProvenance.sourceRunAttempt}` : ''
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Translation publication\n\n${summary.units.map(unit => `- ${unit.unitKey}: ${unit.status}`).join('\n')}${recoveryLine}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `final_target_sha=${results.finalTargetSha}\n`)
          NODE
      - name: Verify every successful publication result reaches the final target
        env:
          FINAL_TARGET_SHA: ${{ steps.documents.outputs.final_target_sha }}
          PUBLISH_ENABLED: ${{ inputs.publish }}
          TARGET_BRANCH: ${{ needs.prepare.outputs.target_branch }}
        run: |
          set -euo pipefail
          [[ "$FINAL_TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          git check-ref-format --branch "$TARGET_BRANCH"
          if [[ "$PUBLISH_ENABLED" == true ]]; then
            git fetch --no-tags origin "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
            target_sha=$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH^{commit}")
            [[ "$target_sha" == "$FINAL_TARGET_SHA" ]] || { echo "Translation target moved after publication: expected $FINAL_TARGET_SHA, got $target_sha" >&2; exit 1; }
          else
            git fetch --no-tags origin "$FINAL_TARGET_SHA"
          fi
          node - <<'NODE'
          const {readPublicationDocument} = require('./scripts/docs-workflow/publication-contracts')
          const {verifyTranslationPublicationRepository} = require('./scripts/docs-workflow/translation-publication-results')
          const selection = readPublicationDocument(`${process.env.RUNNER_TEMP}/publication-selection/publication-selection.json`, 'publication-selection')
          const results = readPublicationDocument(`${process.env.RUNNER_TEMP}/publication-results/publication-results.json`, 'publication-results', {selection})
          verifyTranslationPublicationRepository({selection, results, repository: process.env.GITHUB_WORKSPACE})
          NODE
