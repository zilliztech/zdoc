name: translate docs with Codex agents

on:
  workflow_dispatch:
    inputs:
      target:
        description: Translation product
        required: true
        type: choice
        default: ja-JP
        options: [ja-JP, zh-CN-reference, zh-CN-tools]
      group:
        description: Content group to translate
        required: true
        type: choice
        default: guides
        options: [guides, python, java, node, go, cli, rest, tools, reference-landings]
      max_files: { description: Maximum files, required: false, default: '500' }
      mode: { description: Translation mode, required: false, type: choice, options: [auto, full, incremental], default: auto }
      publish: { description: Publish validated translations, required: false, type: boolean, default: false }
      recovery_run_id: { description: Previous recovery workflow run, required: false, type: string }
      target_branch: { description: Publication branch, required: false, default: dev }
      tooling_sha: { description: Exact tooling commit SHA, required: true, type: string }
      source_sha: { description: Exact source checkpoint SHA, required: true, type: string }

permissions:
  actions: read
  contents: write

concurrency:
  group: docs-production-dev
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate immutable translation identities
        env:
          TRANSLATION_TARGET: ${{ inputs.target }}
          INPUT_GROUP: ${{ inputs.group }}
          TOOLING_SHA: ${{ inputs.tooling_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          node -e 'for(const [name,value] of Object.entries(process.env))if(["TOOLING_SHA","SOURCE_SHA"].includes(name)&&!/^[0-9a-f]{40}$/.test(value))throw new Error(`${name} must be an exact lowercase 40-character SHA`)'
          case "$TRANSLATION_TARGET" in
            ja-JP) [[ "$INPUT_GROUP" =~ ^(guides|python|java|node|go|cli|rest)$ ]] ;;
            zh-CN-reference) [[ "$INPUT_GROUP" =~ ^(python|java|node|go|cli|rest|reference-landings)$ ]] ;;
            zh-CN-tools) [[ "$INPUT_GROUP" == tools ]] ;;
            *) exit 2 ;;
          esac

  translate:
    needs: validate
    uses: ./.github/workflows/translate-content.yml
    with:
      target: ${{ inputs.target }}
      group: ${{ inputs.group }}
      tooling_sha: ${{ inputs.tooling_sha }}
      source_sha: ${{ inputs.source_sha }}
      max_files: ${{ inputs.max_files }}
      mode: ${{ inputs.mode }}
      publish: ${{ inputs.publish }}
      recovery_run_id: ${{ inputs.recovery_run_id }}
      target_branch: ${{ inputs.target_branch }}
    secrets:
      TRANSLATION_AGENT_API_KEY: ${{ secrets.TRANSLATION_AGENT_API_KEY }}
      REVIEW_AGENT_API_KEY: ${{ secrets.REVIEW_AGENT_API_KEY }}
