name: assemble guides checkpoint

on:
  workflow_call:
    inputs:
      source_artifact_name: { required: true, type: string }
      table_matrix: { required: true, type: string }
      table_count: { required: true, type: string }
      master_sha: { required: true, type: string }
      dev_baseline_sha: { required: true, type: string }
      target_branch: { required: true, type: string }
      cache_version: { required: true, type: string }
      cache_save_required: { required: true, type: string }
      assembly_decision_sha256: { required: true, type: string }
      artifact_retention_days: { required: false, type: number, default: 3 }
    outputs:
      status: { value: '${{ jobs.assemble.outputs.status }}' }
      artifact_name: { value: '${{ jobs.assemble.outputs.artifact_name }}' }
permissions:
  actions: write
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      status: ${{ steps.result.outputs.status }}
      artifact_name: docs-checkpoint-guides-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.master_sha }}', fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Prepare immutable baseline
        run: |
          git fetch --no-tags origin "${{ inputs.dev_baseline_sha }}"
          git worktree add --detach "$RUNNER_TEMP/baseline" "${{ inputs.dev_baseline_sha }}"
          bash scripts/restore-generated-state.sh --exact --ref "${{ inputs.dev_baseline_sha }}"
      - uses: actions/download-artifact@v4
        with: { name: '${{ inputs.source_artifact_name }}', path: '${{ runner.temp }}/source-download' }
      - uses: actions/download-artifact@v4
        if: ${{ inputs.table_count != '0' }}
        with:
          pattern: guides-table-*-${{ github.run_id }}
          path: ${{ runner.temp }}/table-download
          merge-multiple: true
      - name: Restore validated Guides source
        run: |
          tar -xf "$RUNNER_TEMP/source-download/guides-source.tar" -C "$RUNNER_TEMP/source-download"
          node scripts/docs-workflow/guides-stage-artifact.js --operation restore --stage source --artifact "$RUNNER_TEMP/source-download/guides-source" --target "$GITHUB_WORKSPACE" --master-sha "${{ inputs.master_sha }}" --dev-baseline-sha "${{ inputs.dev_baseline_sha }}"
      - name: Restore validated Guides table artifacts
        if: ${{ inputs.table_count != '0' }}
        run: |
          mkdir -p "$RUNNER_TEMP/table-artifacts"
          for archive in "$RUNNER_TEMP"/table-download/*.tar; do
            name=$(basename "$archive" .tar)
            destination="$RUNNER_TEMP/table-artifacts/$name"
            mkdir -p "$destination"
            tar -tf "$archive" | node -e 'const fs=require("fs");for(const p of fs.readFileSync(0,"utf8").trim().split("\n"))if(p!=="guides-table"&&!p.startsWith("guides-table/"))throw Error("unsafe archive path")'
            tar -xf "$archive" -C "$destination"
          done
          node -e 'require("fs").writeFileSync(process.argv[1], process.env.MATRIX_JSON)' "$RUNNER_TEMP/guides-table-matrix.json"
          source_sha=$(sha256sum "$RUNNER_TEMP/source-download/guides-source/manifest.json" | cut -d' ' -f1)
          node scripts/docs-workflow/restore-guides-table-artifacts.js --matrix-file "$RUNNER_TEMP/guides-table-matrix.json" --artifacts-root "$RUNNER_TEMP/table-artifacts" --target "$GITHUB_WORKSPACE" --source-artifact-sha256 "$source_sha"
        env:
          MATRIX_JSON: ${{ inputs.table_matrix }}
      - id: assembly_decision
        name: Validate Guides assembly decision
        run: |
          decision=plugins/lark-docs/meta/reports/guides-assembly-decision.json
          node scripts/docs-workflow/guides-assembly-identity.js validate-decision \
            --repository-root "$GITHUB_WORKSPACE" --input "$decision" \
            --expected-master-sha "${{ inputs.master_sha }}" \
            --expected-dev-baseline-sha "${{ inputs.dev_baseline_sha }}"
          observed_sha=$(node scripts/docs-workflow/guides-assembly-identity.js decision-sha \
            --repository-root "$GITHUB_WORKSPACE" --input "$decision" \
            --expected-master-sha "${{ inputs.master_sha }}" \
            --expected-dev-baseline-sha "${{ inputs.dev_baseline_sha }}")
          [[ "$observed_sha" == "${{ inputs.assembly_decision_sha256 }}" ]] || { echo 'Guides assembly decision SHA mismatch' >&2; exit 1; }
          mode=$(node -e 'const d=require("./"+process.argv[1]);process.stdout.write(d.mode)' "$decision")
          if [[ "$mode" == reuse ]]; then
            node scripts/docs-workflow/guides-assembly-identity.js verify-descriptor \
              --repository-root "$RUNNER_TEMP/baseline" \
              --descriptor plugins/lark-docs/meta/assembly/guides.json \
              --saas-sidebar config/generated/guides.sidebar.js \
              --byoc-sidebar config/generated/guides-byoc.sidebar.js
            node - "$decision" "$RUNNER_TEMP/baseline" <<'NODE'
          const crypto = require('node:crypto')
          const fs = require('node:fs')
          const path = require('node:path')
          const decision = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          const baseline = process.argv[3]
          const facts = [
            ['plugins/lark-docs/meta/assembly/guides.json', 'baselineDescriptorSha256'],
            ['config/generated/guides.sidebar.js', 'baselineSaasSidebarSha256'],
            ['config/generated/guides-byoc.sidebar.js', 'baselineByocSidebarSha256'],
          ]
          for (const [relative, key] of facts) {
            const actual = crypto.createHash('sha256').update(fs.readFileSync(path.join(baseline, relative))).digest('hex')
            if (actual !== decision[key]) throw new Error(`Exact baseline ${relative} does not match decision ${key}`)
          }
          NODE
          fi
          printf 'mode=%s\nstarted_milliseconds=%s\n' "$mode" "$(node -e 'process.stdout.write(String(Date.now()))')" >> "$GITHUB_OUTPUT"
      - name: Generate combined Guides sidebars offline
        run: node scripts/docs-workflow/generate-guides-sidebars.js --media-manifest plugins/lark-docs/meta/media-cache/guides.json
        env:
          DOCS_BUILD_ENV: uat
          IMAGE_BED_URL: ${{ vars.IMAGE_BED_URL }}
          NO_UPDATE_NOTIFIER: '1'
      - name: Validate combined guides output
        run: |
          node scripts/validate-generated-sidebars.js
          node scripts/run-doc-build-stage.js --build "pnpm run build" --skipLinkChecks --skipCardReporting
      - name: Finalize Guides assembly identity
        run: |
          decision=plugins/lark-docs/meta/reports/guides-assembly-decision.json
          descriptor=plugins/lark-docs/meta/assembly/guides.json
          saas=config/generated/guides.sidebar.js
          byoc=config/generated/guides-byoc.sidebar.js
          saas_equal=null
          byoc_equal=null
          if [[ "${{ steps.assembly_decision.outputs.mode }}" == reuse ]]; then
            cmp -s "$RUNNER_TEMP/baseline/$saas" "$saas" || { echo 'Observe-only SaaS sidebar divergence from exact baseline' >&2; exit 1; }
            cmp -s "$RUNNER_TEMP/baseline/$byoc" "$byoc" || { echo 'Observe-only BYOC sidebar divergence from exact baseline' >&2; exit 1; }
            saas_equal=true
            byoc_equal=true
          fi
          node scripts/docs-workflow/guides-assembly-identity.js write-descriptor \
            --repository-root "$GITHUB_WORKSPACE" --decision "$decision" \
            --expected-master-sha "${{ inputs.master_sha }}" \
            --expected-dev-baseline-sha "${{ inputs.dev_baseline_sha }}" \
            --expected-decision-sha256 "${{ inputs.assembly_decision_sha256 }}" \
            --saas-sidebar "$saas" --byoc-sidebar "$byoc" --output "$descriptor"
          node scripts/docs-workflow/guides-assembly-identity.js verify-descriptor \
            --repository-root "$GITHUB_WORKSPACE" --descriptor "$descriptor" \
            --saas-sidebar "$saas" --byoc-sidebar "$byoc"
          finished_milliseconds=$(node -e 'process.stdout.write(String(Date.now()))')
          elapsed_milliseconds=$((finished_milliseconds - ${{ steps.assembly_decision.outputs.started_milliseconds }}))
          node scripts/docs-workflow/guides-assembly-identity.js write-result \
            --repository-root "$GITHUB_WORKSPACE" --decision "$decision" \
            --expected-master-sha "${{ inputs.master_sha }}" \
            --expected-dev-baseline-sha "${{ inputs.dev_baseline_sha }}" \
            --expected-decision-sha256 "${{ inputs.assembly_decision_sha256 }}" \
            --elapsed-milliseconds "$elapsed_milliseconds" \
            --saas-equal "$saas_equal" --byoc-equal "$byoc_equal" \
            --descriptor-verified true \
            --output plugins/lark-docs/meta/reports/guides-assembly-result.json
      - id: promoted_snapshot
        name: Select promoted Guides source snapshot
        run: |
          candidate=plugins/lark-docs/meta/reports/guides-source-snapshot-candidate.json
          snapshot=plugins/lark-docs/meta/snapshots/guides-uat-last-success.json
          selection=$(node scripts/docs-workflow/guides-cache-generation-lifecycle.js select \
            --cache-version "${{ inputs.cache_version }}" \
            --save-required "${{ inputs.cache_save_required }}" \
            --candidate "$candidate" --baseline "$snapshot")
          selected=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).selection)' "$selection")
          if [[ "$selected" == candidate ]]; then
            node scripts/promote-lark-doc-snapshot.js \
              --candidate "$candidate" \
              --output "$snapshot" \
              --manual guides \
              --build-env uat \
              --source-dir plugins/lark-docs/meta/sources/guides \
              --targets-built zilliz.saas,zilliz.paas \
              --source-branch "${{ inputs.target_branch }}" \
              --publish-url https://docs.cloud-uat3.zilliz.com \
              --link-check-remote https://docs.zilliz.com
          else
            echo '[source-cache] Preserving exact baseline snapshot identity for unchanged valid v4 cache'
          fi
          echo "selection=$selected" >> "$GITHUB_OUTPUT"
      - id: promoted_source_manifest
        name: Prepare promoted Guides source manifest
        run: |
          mkdir -p plugins/lark-docs/meta/source-cache
          snapshot=plugins/lark-docs/meta/snapshots/guides-uat-last-success.json
          manifest=plugins/lark-docs/meta/source-cache/guides-manifest.json
          node scripts/docs-workflow/guides-source-cache.js create --source-dir plugins/lark-docs/meta/sources/guides --snapshot "$snapshot" --output "$manifest" --media-manifest plugins/lark-docs/meta/media-cache/guides.json --root-token Tg6mwbRGDitPQ3kLUQzc44I7nth
      - id: guides_v4_generation
        name: Create Guides v4 generation payload
        if: ${{ inputs.cache_save_required == 'true' }}
        run: |
          snapshot=plugins/lark-docs/meta/snapshots/guides-uat-last-success.json
          generation=$(node scripts/docs-workflow/guides-source-cache-generation.js keys \
            --snapshot "$snapshot" --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}")
          key=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).saveKey)' "$generation")
          node scripts/docs-workflow/guides-source-cache-generation.js create \
            --workspace "$GITHUB_WORKSPACE" --output tmp/guides-source-cache-v4 \
            --snapshot "$snapshot" --root-token Tg6mwbRGDitPQ3kLUQzc44I7nth
          node scripts/docs-workflow/guides-source-cache-generation.js validate \
            --payload tmp/guides-source-cache-v4 --snapshot "$snapshot" \
            --root-token Tg6mwbRGDitPQ3kLUQzc44I7nth
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - id: save_guides_v4_generation
        name: Save Guides v4 generation
        if: ${{ inputs.cache_save_required == 'true' && steps.guides_v4_generation.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: tmp/guides-source-cache-v4
          key: ${{ steps.guides_v4_generation.outputs.key }}
      - name: Record Guides cache generation persistence
        if: ${{ always() }}
        run: |
          node scripts/docs-workflow/guides-cache-generation-lifecycle.js report \
            --cache-version "${{ inputs.cache_version }}" \
            --save-required "${{ inputs.cache_save_required }}" \
            --selection-outcome "${{ steps.promoted_snapshot.outcome }}" \
            --manifest-outcome "${{ steps.promoted_source_manifest.outcome }}" \
            --preparation-outcome "${{ steps.guides_v4_generation.outcome }}" \
            --save-outcome "${{ steps.save_guides_v4_generation.outcome }}" \
            --save-key "${{ steps.guides_v4_generation.outputs.key }}" \
            --output plugins/lark-docs/meta/reports/guides-cache-generation.json
      - name: Create combined guides checkpoint
        run: |
          node scripts/docs-workflow/create-checkpoint-artifact.js --group guides --master-sha "${{ inputs.master_sha }}" --dev-baseline-sha "${{ inputs.dev_baseline_sha }}" --baseline-dir "$RUNNER_TEMP/baseline" --workspace "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/checkpoint-group" --validation-command "node scripts/validate-generated-sidebars.js" --validation-command 'node scripts/run-doc-build-stage.js --build "pnpm run build" --skipLinkChecks --skipCardReporting'
          tar --dereference -cf "$RUNNER_TEMP/checkpoint-group.tar" -C "$RUNNER_TEMP" checkpoint-group
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: docs-checkpoint-guides-${{ github.run_id }}
          path: ${{ runner.temp }}/checkpoint-group.tar
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error
      - name: Upload guides reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: docs-checkpoint-guides-${{ github.run_id }}-reports
          path: plugins/lark-docs/meta/reports/
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: ignore
      - id: result
        if: ${{ always() }}
        run: echo "status=${{ steps.upload.outcome == 'success' && 'artifact_ready' || 'failed' }}" >> "$GITHUB_OUTPUT"
      - if: ${{ always() }}
        run: git worktree remove --force "$RUNNER_TEMP/baseline" || true
