name: assemble guides checkpoint

on:
  workflow_call:
    inputs:
      source_artifact_name: { required: true, type: string }
      table_matrix: { required: true, type: string }
      table_count: { required: true, type: string }
      master_sha: { required: true, type: string }
      dev_baseline_sha: { required: true, type: string }
      target_branch: { required: true, type: string }
      artifact_retention_days: { required: false, type: number, default: 3 }
    outputs:
      status: { value: '${{ jobs.assemble.outputs.status }}' }
      artifact_name: { value: '${{ jobs.assemble.outputs.artifact_name }}' }
    secrets:
      APP_ID: { required: true }
      APP_SECRET: { required: true }

permissions:
  actions: write
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      status: ${{ steps.result.outputs.status }}
      artifact_name: docs-checkpoint-guides-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.master_sha }}', fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Prepare immutable baseline
        run: |
          git fetch --no-tags origin "${{ inputs.dev_baseline_sha }}"
          git worktree add --detach "$RUNNER_TEMP/baseline" "${{ inputs.dev_baseline_sha }}"
          bash scripts/restore-generated-state.sh --exact --ref "${{ inputs.dev_baseline_sha }}"
      - uses: actions/download-artifact@v4
        with: { name: '${{ inputs.source_artifact_name }}', path: '${{ runner.temp }}/source-download' }
      - uses: actions/download-artifact@v4
        if: ${{ inputs.table_count != '0' }}
        with:
          pattern: guides-table-*-${{ github.run_id }}
          path: ${{ runner.temp }}/table-download
          merge-multiple: true
      - name: Restore validated Guides source
        run: |
          tar -xf "$RUNNER_TEMP/source-download/guides-source.tar" -C "$RUNNER_TEMP/source-download"
          node scripts/docs-workflow/guides-stage-artifact.js --operation restore --stage source --artifact "$RUNNER_TEMP/source-download/guides-source" --target "$GITHUB_WORKSPACE" --master-sha "${{ inputs.master_sha }}" --dev-baseline-sha "${{ inputs.dev_baseline_sha }}"
      - name: Restore validated Guides table artifacts
        if: ${{ inputs.table_count != '0' }}
        run: |
          mkdir -p "$RUNNER_TEMP/table-artifacts"
          for archive in "$RUNNER_TEMP"/table-download/*.tar; do
            name=$(basename "$archive" .tar)
            destination="$RUNNER_TEMP/table-artifacts/$name"
            mkdir -p "$destination"
            tar -tf "$archive" | node -e 'const fs=require("fs");for(const p of fs.readFileSync(0,"utf8").trim().split("\n"))if(p!=="guides-table"&&!p.startsWith("guides-table/"))throw Error("unsafe archive path")'
            tar -xf "$archive" -C "$destination"
          done
          node -e 'require("fs").writeFileSync(process.argv[1], process.env.MATRIX_JSON)' "$RUNNER_TEMP/guides-table-matrix.json"
          source_sha=$(sha256sum "$RUNNER_TEMP/source-download/guides-source/manifest.json" | cut -d' ' -f1)
          node scripts/docs-workflow/restore-guides-table-artifacts.js --matrix-file "$RUNNER_TEMP/guides-table-matrix.json" --artifacts-root "$RUNNER_TEMP/table-artifacts" --target "$GITHUB_WORKSPACE" --source-artifact-sha256 "$source_sha"
        env:
          MATRIX_JSON: ${{ inputs.table_matrix }}
      - name: Generate combined Guides sidebars offline
        run: |
          npx docusaurus fetch-lark-docs -man guides -tar zilliz.saas -sidebar -skipS --offline --mediaManifest plugins/lark-docs/meta/media-cache/guides.json
          npx docusaurus fetch-lark-docs -man guides -tar zilliz.paas -sidebar -skipS --offline --mediaManifest plugins/lark-docs/meta/media-cache/guides.json
        env:
          DOCS_BUILD_ENV: uat
          IMAGE_BED_URL: ${{ vars.IMAGE_BED_URL }}
          NO_UPDATE_NOTIFIER: '1'
      - name: Validate combined guides output
        run: |
          node scripts/validate-generated-sidebars.js
          node scripts/run-doc-build-stage.js --build "pnpm run build" --skipLinkChecks --skipCardReporting
      - name: Promote validated guides source snapshot
        run: |
          node scripts/promote-lark-doc-snapshot.js \
            --candidate plugins/lark-docs/meta/reports/guides-source-snapshot-candidate.json \
            --output plugins/lark-docs/meta/snapshots/guides-uat-last-success.json \
            --manual guides \
            --build-env uat \
            --source-dir plugins/lark-docs/meta/sources/guides \
            --targets-built zilliz.saas,zilliz.paas \
            --source-branch "${{ inputs.target_branch }}" \
            --publish-url https://docs.cloud-uat3.zilliz.com \
            --link-check-remote https://docs.zilliz.com
      - id: promoted_source_cache
        name: Prepare promoted guides source cache
        run: |
          mkdir -p plugins/lark-docs/meta/source-cache
          snapshot=plugins/lark-docs/meta/snapshots/guides-uat-last-success.json
          manifest=plugins/lark-docs/meta/source-cache/guides-manifest.json
          node scripts/docs-workflow/guides-source-cache.js create --source-dir plugins/lark-docs/meta/sources/guides --snapshot "$snapshot" --output "$manifest" --media-manifest plugins/lark-docs/meta/media-cache/guides.json --root-token Tg6mwbRGDitPQ3kLUQzc44I7nth
          key=$(node scripts/docs-workflow/guides-source-cache.js key --snapshot "$snapshot")
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Save promoted guides source cache
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            plugins/lark-docs/meta/sources/guides
            plugins/lark-docs/meta/source-cache/guides-manifest.json
            plugins/lark-docs/meta/media-cache/guides.json
          key: ${{ steps.promoted_source_cache.outputs.key }}
      - name: Create combined guides checkpoint
        run: |
          node scripts/docs-workflow/create-checkpoint-artifact.js --group guides --master-sha "${{ inputs.master_sha }}" --dev-baseline-sha "${{ inputs.dev_baseline_sha }}" --baseline-dir "$RUNNER_TEMP/baseline" --workspace "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/checkpoint-group" --validation-command "node scripts/validate-generated-sidebars.js" --validation-command 'node scripts/run-doc-build-stage.js --build "pnpm run build" --skipLinkChecks --skipCardReporting'
          tar --dereference -cf "$RUNNER_TEMP/checkpoint-group.tar" -C "$RUNNER_TEMP" checkpoint-group
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: docs-checkpoint-guides-${{ github.run_id }}
          path: ${{ runner.temp }}/checkpoint-group.tar
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error
      - name: Upload guides reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: docs-checkpoint-guides-${{ github.run_id }}-reports
          path: plugins/lark-docs/meta/reports/
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: ignore
      - id: result
        if: ${{ always() }}
        run: echo "status=${{ steps.upload.outcome == 'success' && 'artifact_ready' || 'failed' }}" >> "$GITHUB_OUTPUT"
      - if: ${{ always() }}
        run: git worktree remove --force "$RUNNER_TEMP/baseline" || true
