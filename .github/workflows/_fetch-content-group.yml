name: fetch docs content group

on:
  workflow_call:
    inputs:
      site:
        required: true
        type: string
      group:
        required: true
        type: string
      master_sha:
        required: true
        type: string
      dev_baseline_sha:
        required: true
        type: string
      publication_selection_artifact_name:
        required: true
        type: string
      publication_selection_sha256:
        required: true
        type: string
      publication_unit_key:
        required: true
        type: string
      target_branch:
        required: false
        type: string
        default: dev
      artifact_retention_days:
        required: false
        type: number
        default: 3
    outputs:
      status:
        description: Producer result status
        value: ${{ jobs.produce.outputs.status }}
      artifact_name:
        description: Uploaded checkpoint artifact name
        value: ${{ jobs.produce.outputs.artifact_name }}
    secrets:
      APP_ID:
        required: true
      APP_SECRET:
        required: true
      SPACE_ID:
        required: true
      FIGMA_API_KEY:
        required: true
      MODEL_API_KEY:
        required: true
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      status: ${{ steps.result.outputs.status }}
      artifact_name: ${{ format('docs-checkpoint-{0}-{1}', inputs.group, github.run_id) }}
    env:
      ZDOC_SITE: ${{ inputs.site }}
      SITE: ${{ inputs.site }}
      GROUP: ${{ inputs.group }}
      MASTER_SHA: ${{ inputs.master_sha }}
      DEV_BASELINE_SHA: ${{ inputs.dev_baseline_sha }}
      TARGET_BRANCH: ${{ inputs.target_branch }}
    steps:
      - name: Initialize temporary paths
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${RUNNER_TEMP:-}" && "$RUNNER_TEMP" == /* ]] || { echo "RUNNER_TEMP must be a non-empty absolute path" >&2; exit 1; }
          printf '%s\n' \
            "BASELINE_DIR=$RUNNER_TEMP/docs-dev-baseline" \
            "CHECKPOINT_DIR=$RUNNER_TEMP/checkpoint-group" \
            "CHECKPOINT_TAR=$RUNNER_TEMP/checkpoint-group.tar" \
            "CHECKPOINT_MANIFEST=$RUNNER_TEMP/checkpoint-group/manifest.json" \
            "PUBLICATION_SELECTION=$RUNNER_TEMP/publication-selection/publication-selection.json" \
            "PUBLICATION_READY=$RUNNER_TEMP/publication-ready.json" \
            "PUBLICATION_UNIT_KEY=${{ inputs.publication_unit_key }}" >> "$GITHUB_ENV"

      - name: Validate SHA inputs
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const sha = /^[0-9a-f]{40}$/
          if (!sha.test(process.env.MASTER_SHA)) throw new Error('master_sha must be a lowercase 40-character Git SHA')
          if (!sha.test(process.env.DEV_BASELINE_SHA)) throw new Error('dev_baseline_sha must be a lowercase 40-character Git SHA')
          NODE

      - name: Check out immutable master source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.master_sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Download publication selection
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.publication_selection_artifact_name }}
          path: ${{ runner.temp }}/publication-selection

      - name: Validate publication selection identity
        shell: bash
        run: |
          set -euo pipefail
          expected_selection_sha256='${{ inputs.publication_selection_sha256 }}'
          expected_unit_key='${{ inputs.publication_unit_key }}'
          node scripts/docs-workflow/publication-contracts.js validate-selection "$PUBLICATION_SELECTION"
          node - "$PUBLICATION_SELECTION" "$expected_selection_sha256" "$expected_unit_key" <<'NODE'
          const fs = require('node:fs')
          const selection = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          if (selection.selectionSha256 !== process.argv[3]) throw new Error('Publication selection checksum mismatch')
          if (!selection.units.some(unit => unit.unitKey === process.argv[4])) throw new Error('Publication unit is not selected')
          NODE

      - name: Validate content group
        run: node -e 'require("./scripts/docs-workflow/content-groups.js").getContentGroup(process.env.GROUP, process.env.SITE)'

      - name: Create immutable dev baseline worktree
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$DEV_BASELINE_SHA"
          git worktree add --detach "$BASELINE_DIR" "$DEV_BASELINE_SHA"

      - name: Restore generated state from dev baseline
        run: bash scripts/restore-generated-state.sh --exact --ref "$DEV_BASELINE_SHA"

      - name: Prepare selected content group workspace
        run: node scripts/docs-workflow/prepare-content-group-workspace.js "$SITE" "$GROUP"

      - name: Fetch content group
        run: |
          pnpm docs-tooling publish-group --site "$SITE" --group "$GROUP" --stage fetch
          pnpm docs-tooling publish-group --site "$SITE" --group "$GROUP" --stage validate
          pnpm docs-tooling publish-group --site "$SITE" --group "$GROUP" --stage publish
        env:
          DOCS_BUILD_ENV: uat
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          FEISHU_HOST: ${{ vars.FEISHU_HOST }}
          SPACE_ID: ${{ secrets.SPACE_ID }}
          FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
          MODEL_API_BASE_URL: ${{ vars.MODEL_API_BASE_URL }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          MODEL_ID: ${{ vars.MODEL_ID }}
          AWS_BUCKET: ${{ vars.AWS_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          IMAGE_BED_URL: ${{ vars.IMAGE_BED_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Validate and build generated docs
        run: |
          set -euo pipefail
          node scripts/validate-generated-sidebars.js --site "$SITE"
          node scripts/run-doc-build-stage.js --build "pnpm run build:$SITE" --skipLinkChecks
        env:
          DOCS_BUILD_ENV: uat
          DOCS_PUBLISH_URL: https://docs.cloud-uat3.zilliz.com
          LINK_CHECKS_REMOTE_BASE_URL: https://docs.zilliz.com
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          FEISHU_HOST: ${{ vars.FEISHU_HOST }}
          MODEL_API_BASE_URL: ${{ vars.MODEL_API_BASE_URL }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          MODEL_ID: ${{ vars.MODEL_ID }}

      - name: Update content snapshots
        run: |
          set -euo pipefail
          if [[ "$SITE" != en ]]; then
            echo "Snapshot promotion for $SITE/$GROUP is owned by its site publication workflow."
          elif [[ "$GROUP" == guides ]]; then
            node scripts/update-lark-doc-snapshot.js --manual guides --targets-built zilliz.saas,zilliz.paas --build-env uat --source-branch "$TARGET_BRANCH" --publish-url https://docs.cloud-uat3.zilliz.com --link-check-remote https://docs.zilliz.com
          elif [[ "$GROUP" != rest ]]; then
            DOCS_SOURCE_BRANCH="$TARGET_BRANCH" bash scripts/update-sdk-reference-snapshots.sh "$GROUP"
          fi
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          FEISHU_HOST: ${{ vars.FEISHU_HOST }}
          MODEL_API_BASE_URL: ${{ vars.MODEL_API_BASE_URL }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          MODEL_ID: ${{ vars.MODEL_ID }}

      - name: Generate revision inventory
        if: ${{ inputs.site == 'en' }}
        shell: bash
        run: |
          set -euo pipefail
          SNAPSHOTS="$(node -e 'const group = require("./scripts/docs-workflow/content-groups.js").getContentGroup(process.env.GROUP, process.env.SITE); process.stdout.write(group.sourceSnapshots.join(","))')"
          if [[ "$GROUP" != rest && -z "$SNAPSHOTS" ]]; then
            echo "Publication group $GROUP must resolve at least one source snapshot" >&2
            exit 1
          fi

          baseline_path="tmp/docs-tooling/revision-baseline/$GROUP.json"
          mkdir -p "$(dirname "$baseline_path")" tmp/docs-tooling/revision-diff
          baseline_source="$BASELINE_DIR/generated/en/manifests/lark-revisions/$GROUP.json"
          if [[ -f "$baseline_source" ]]; then
            cp -- "$baseline_source" "$baseline_path"
          fi

          GENERATED_AT="$(node -p 'new Date().toISOString()')"
          inventory_args=(
            revision-inventory build
            --group "$GROUP"
            --baseline "tmp/docs-tooling/revision-baseline/$GROUP.json"
            --output "generated/en/manifests/lark-revisions/$GROUP.json"
            --report-dir "tmp/docs-tooling/revision-diff"
            --source-run-id "$GITHUB_RUN_ID"
            --generated-at "$GENERATED_AT"
          )
          if [[ -n "$SNAPSHOTS" ]]; then
            inventory_args+=(--snapshot "$SNAPSHOTS")
          fi
          pnpm docs-tooling "${inventory_args[@]}"

      - name: Upload revision inventory report
        if: ${{ inputs.site == 'en' }}
        uses: actions/upload-artifact@v6
        with:
          name: docs-checkpoint-${{ inputs.group }}-${{ github.run_id }}-revision-report
          path: |
            generated/en/manifests/lark-revisions/${{ inputs.group }}.json
            tmp/docs-tooling/revision-diff/${{ inputs.group }}.json
            tmp/docs-tooling/revision-diff/${{ inputs.group }}.md
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error

      - name: Create source checkpoint artifact
        run: |
          validation_command="node scripts/run-doc-build-stage.js --build \"pnpm run build:$SITE\" --skipLinkChecks"
          node scripts/docs-workflow/create-checkpoint-artifact.js \
            --group "$GROUP" \
            --master-sha "$MASTER_SHA" \
            --dev-baseline-sha "$DEV_BASELINE_SHA" \
            --baseline-dir "$BASELINE_DIR" \
            --workspace "$GITHUB_WORKSPACE" \
            --output "$CHECKPOINT_DIR" \
            --validation-command "node scripts/validate-generated-sidebars.js --site $SITE" \
            --validation-command "$validation_command"

      - name: Validate source checkpoint artifact
        run: node scripts/docs-workflow/validate-checkpoint-artifact.js --artifact "$CHECKPOINT_DIR" --group "$GROUP" --master-sha "$MASTER_SHA" --dev-baseline-sha "$DEV_BASELINE_SHA"

      - name: Package validated checkpoint artifact
        # The creator publishes through a managed symlink. Dereferencing it into a tarball
        # gives downstream jobs a stable regular directory after extraction.
        run: tar --dereference -cf "$CHECKPOINT_TAR" -C "$(dirname "$CHECKPOINT_DIR")" "$(basename "$CHECKPOINT_DIR")"

      - name: Upload source checkpoint artifact
        id: checkpoint_upload
        uses: actions/upload-artifact@v6
        with:
          name: docs-checkpoint-${{ inputs.group }}-${{ github.run_id }}
          path: ${{ runner.temp }}/checkpoint-group.tar
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error

      - name: Create publication ready descriptor
        id: publication_ready
        if: ${{ steps.checkpoint_upload.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/docs-workflow/fetch-publication-selection.js ready \
            --selection "$PUBLICATION_SELECTION" \
            --unit-key "$PUBLICATION_UNIT_KEY" \
            --archive "$CHECKPOINT_TAR" \
            --manifest "$CHECKPOINT_MANIFEST" \
            --output "$PUBLICATION_READY"
          unit_token=${PUBLICATION_UNIT_KEY//\//-}
          echo "artifact_name=publication-ready-fetch-$unit_token-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload publication ready descriptor
        id: ready_upload
        if: ${{ steps.publication_ready.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.publication_ready.outputs.artifact_name }}
          path: ${{ runner.temp }}/publication-ready.json
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error

      - name: Upload Guides content reports
        if: ${{ always() && inputs.group == 'guides' }}
        uses: actions/upload-artifact@v6
        with:
          name: docs-checkpoint-${{ inputs.group }}-${{ github.run_id }}-reports
          path: packages/docs-tooling/src/lark/meta/reports/
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: ignore

      - name: Emit producer result
        id: result
        if: ${{ always() }}
        run: |
          if [[ "${{ steps.checkpoint_upload.outcome }}" == success && "${{ steps.ready_upload.outcome }}" == success ]]; then
            echo 'status=artifact_ready' >> "$GITHUB_OUTPUT"
          else
            echo 'status=failed' >> "$GITHUB_OUTPUT"
          fi

      - name: Clean up baseline worktree
        if: ${{ always() }}
        run: git worktree remove --force "$BASELINE_DIR" 2>/dev/null || true
