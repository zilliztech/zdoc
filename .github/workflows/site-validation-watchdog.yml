name: site validation watchdog

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

# One coverage pass at a time: two overlapping ticks could dispatch the same
# missing run twice before either run listing reflects the first dispatch.
concurrency:
  group: site-validation-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    name: Retry startup failures, dispatch uncovered PR validations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Retry zero-job failures and dispatch uncovered PR validations
        id: watchdog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/docs-workflow/site-validation-watchdog.js \
            --repository "$GITHUB_REPOSITORY" \
            --output tmp/site-validation-watchdog.json
          cat tmp/site-validation-watchdog.json

      - name: Upload watchdog result
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: site-validation-watchdog-${{ github.run_id }}
          path: tmp/site-validation-watchdog.json
          if-no-files-found: error
          retention-days: 14
