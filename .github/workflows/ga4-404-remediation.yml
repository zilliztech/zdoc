name: ga4 404 remediation

# GA4 404 → nginx 301 remediation, PR3 slice: the classification runs daily on
# a schedule (plus manual dispatch) and, when deterministic rules exist and no
# remediation PR is open, opens a labeled PR with the generated conf block and
# the updated ledger. Operator replies on that PR (ga4-404-reply-data blocks)
# are applied to the PR branch by the issue_comment executor. All writes go
# through the deterministic generator in scripts/redirects/; the PAT provides
# every write capability (top-level permissions stay contents: read), and the
# PAT-opened PR gets real pull_request checks (no GITHUB_TOKEN phantom CI).
#
# PR3 adds the codex triage agent on both sides of that protocol:
# - triage_proposal (read-only): researches the batch's unresolved triage
#   paths and posts an advisory proposal comment as github-actions[bot] —
#   an identity the executor allowlist rejects, and the proposal body never
#   carries live reply markers.
# - the executor's interpreter: a free-text operator comment is translated
#   by codex into one reply block and then applied through the very same
#   --reply-file generator path a structured block would take.
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'GA4 lookback window in days (1-90)'
        required: false
        default: '7'
  schedule:
    - cron: '19 3 * * *'
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: ga4-404-remediation
  cancel-in-progress: false

jobs:
  remediation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    outputs:
      pr_number: ${{ steps.publish.outputs.pr_number }}
      triage_count: ${{ steps.remediation.outputs.triage_count }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out immutable tooling revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve GA4 credentials
        id: credentials
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID_EN: ${{ vars.GA4_PROPERTY_ID_EN }}
          GA4_PROPERTY_ID_ZH_CN: ${{ vars.GA4_PROPERTY_ID_ZH_CN }}
        run: |
          if [ -n "$GA4_SERVICE_ACCOUNT_JSON" ] && [ -n "$GA4_PROPERTY_ID_EN" ]; then
            creds_file="$RUNNER_TEMP/ga4-service-account.json"
            printf '%s' "$GA4_SERVICE_ACCOUNT_JSON" > "$creds_file"
            {
              echo "has_credentials=true"
              echo "credentials_file=$creds_file"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GA4 404 remediation is not configured; set GA4_SERVICE_ACCOUNT_JSON plus GA4_PROPERTY_ID_EN to enable it."
            echo "has_credentials=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          # Zero-dependency tool: no package-manager cache (the repo-root
          # pnpm-lock.yaml would otherwise make setup-node require pnpm).
          package-manager-cache: false

      - name: Run GA4 404 remediation
        id: remediation
        if: ${{ steps.credentials.outputs.has_credentials == 'true' }}
        env:
          GA4_PROPERTY_ID_EN: ${{ vars.GA4_PROPERTY_ID_EN }}
          GA4_PROPERTY_ID_ZH_CN: ${{ vars.GA4_PROPERTY_ID_ZH_CN }}
        run: |
          node scripts/redirects/ga4-404-remediation.js \
            --credentials "${{ steps.credentials.outputs.credentials_file }}" \
            --output-dir tmp/ga4-404-remediation \
            --days "${{ inputs.days || '7' }}" \
            --ledger scripts/redirects/ga4-404-remediation-ledger.json
          echo "card_status=success" >> "$GITHUB_OUTPUT"
          echo "triage_count=$(node -e 'const r=require("./tmp/ga4-404-remediation/report.json");process.stdout.write(String((r.triage||[]).length))')" >> "$GITHUB_OUTPUT"

      - name: Append proposal summary
        if: ${{ steps.credentials.outputs.has_credentials == 'true' }}
        run: cat tmp/ga4-404-remediation/proposal.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload remediation artifacts
        if: ${{ steps.credentials.outputs.has_credentials == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: ga4-404-remediation-${{ github.run_id }}
          path: tmp/ga4-404-remediation
          if-no-files-found: error
          retention-days: 14

      # Opens one labeled PR per batch through the same generator as every
      # other conf change (apply mode). Gate 10 (house rule from
      # rest-upstream-refresh.yml): the PR is opened with a PAT so the
      # pull_request checks actually run; the GITHUB_TOKEN never writes.
      - name: Publish remediation pull request
        id: publish
        if: ${{ steps.credentials.outputs.has_credentials == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REST_UPSTREAM_REFRESH_PAT: ${{ secrets.REST_UPSTREAM_REFRESH_PAT }}
        run: |
          direct=$(node -e 'const r=require("./tmp/ga4-404-remediation/report.json");process.stdout.write(String(r.stats.direct))')
          if [ "$direct" = "0" ]; then
            echo "::notice::No deterministic rules in this window; the artifact and summary were still updated."
            exit 0
          fi
          open_prs=$(gh pr list --label ga4-404-remediation --state open --json number --jq 'length')
          if [ "$open_prs" != "0" ]; then
            echo "::notice::An open ga4-404-remediation PR already exists; the next batch opens after it merges."
            exit 0
          fi
          test -n "$REST_UPSTREAM_REFRESH_PAT" || {
            echo 'REST_UPSTREAM_REFRESH_PAT is not configured; the classified batch was not delivered. Provision the PAT and re-dispatch, or apply rules.conf from the run artifact.' >&2
            exit 1
          }
          # The publish path is apply mode: the mapping derives from the
          # classification, and the generator writes conf + ledger (never the
          # reverse). --write-conf is the CI-side application of the block.
          node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("tmp/ga4-404-remediation/report.json","utf8"));fs.writeFileSync("tmp/ga4-404-remediation/publish-mapping.json",JSON.stringify({schema_version:1,mappings:r.direct.map(function(rule){return {from:rule.from,to:rule.to,note:"GA4 window "+r.days+"d: "+rule.ladder+" ladder ("+rule.events+" events / "+rule.users+" users)"}})},null,2))'
          node scripts/redirects/ga4-404-remediation.js \
            --mode apply \
            --mapping tmp/ga4-404-remediation/publish-mapping.json \
            --conf deploy/en/nginx.conf \
            --snapshot deploy/contracts/en-redirect-target-routes.json \
            --ledger scripts/redirects/ga4-404-remediation-ledger.json \
            --output-dir tmp/publish \
            --write-conf
          cp tmp/publish/ledger.json scripts/redirects/ga4-404-remediation-ledger.json
          batch_date=$(date -u +%Y-%m-%d)
          branch="ga4-404-remediation/${batch_date}-${GITHUB_RUN_ID}"
          git config user.name "zdoc ga4-404 bot"
          git config user.email "bot@zilliz.com"
          git checkout -b "$branch"
          git add deploy/en/nginx.conf scripts/redirects/ga4-404-remediation-ledger.json
          git commit -m "fix(redirects): GA4 404 remediation batch ${batch_date} (${direct} rules)"
          git push "https://x-access-token:${REST_UPSTREAM_REFRESH_PAT}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${branch}"
          GH_TOKEN="$REST_UPSTREAM_REFRESH_PAT" gh label create ga4-404-remediation --color D4C5F9 --description 'Automated GA4 404 remediation batch' 2>/dev/null || true
          # Truncate in node so a multibyte character is never split mid-sequence.
          # body_file is the bash-side name gh pr create reads below; BODY_FILE
          # only carries it into the node process.
          body_file="$RUNNER_TEMP/pr-body.md"
          rm -f "$body_file"
          BODY_FILE="$body_file" node -e 'const fs=require("fs");const b=fs.readFileSync("tmp/ga4-404-remediation/proposal.md","utf8");const body=b.length>60000?b.slice(0,60000)+"\n\n(Truncated at 60000 characters; the full proposal is in the run artifact ga4-404-remediation-"+process.env.GITHUB_RUN_ID+".)\n":b;fs.writeFileSync(process.env.BODY_FILE,body)'
          export GH_TOKEN="$REST_UPSTREAM_REFRESH_PAT"
          test -s "$body_file" || {
            echo "::error::proposal body file missing or empty at $body_file; refusing to open an empty PR."
            exit 1
          }
          pr_url=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base master --head "$branch" \
            --title "fix(redirects): GA4 404 remediation batch ${batch_date}" \
            --body-file "$body_file" \
            --label ga4-404-remediation) || {
            echo "::error::gh pr create failed (gh=$(gh --version | head -1), body bytes=$(wc -c < "$body_file"), branch=$branch, label present=$(gh label list --repo "$GITHUB_REPOSITORY" --search ga4-404-remediation --json name --jq 'length'))"
            exit 1
          }
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "pr_number=${pr_url##*/}" >> "$GITHUB_OUTPUT"
          if [ -f tmp/ga4-404-remediation/triage.md ]; then
            gh pr comment "$pr_url" --repo "$GITHUB_REPOSITORY" --body-file tmp/ga4-404-remediation/triage.md
          fi

  # PR3: read-only codex proposal. When the daily batch opened a remediation
  # PR that carries unresolved triage paths, the agent researches each path
  # (routes snapshot, content tree, git history) and posts an advisory
  # proposal comment for the operator. IAM-enforced non-writer: this job's
  # GITHUB_TOKEN holds no push scope, the push PAT never enters the job, and
  # the comment is authored by github-actions[bot] — an identity the reply
  # executor's allowlist rejects, on top of the proposal body never carrying
  # live reply markers (triage-agent.js strips them).
  triage_proposal:
    needs: remediation
    if: needs.remediation.outputs.pr_number != '' && needs.remediation.outputs.triage_count != '' && needs.remediation.outputs.triage_count != '0'
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the classified revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install agent dependencies
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install current tooling
        run: pnpm install --frozen-lockfile

      - name: Download remediation artifacts
        uses: actions/download-artifact@v7
        with:
          name: ga4-404-remediation-${{ github.run_id }}
          path: tmp/ga4-404-remediation

      - name: Run the codex triage proposal
        id: propose
        env:
          AGENTIC_PROVIDER_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AGENTIC_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          AGENTIC_TRANSLATION_MODEL: ${{ vars.AGENTIC_TRANSLATION_MODEL }}
          AGENTIC_REASONING_EFFORT: ${{ vars.AGENTIC_REASONING_EFFORT }}
        run: |
          if [ -z "$AGENTIC_PROVIDER_API_KEY" ] || [ -z "$AGENTIC_BASE_URL" ]; then
            echo "::notice::Agentic gateway is not configured (DEEPSEEK_API_KEY secret + DEEPSEEK_BASE_URL var); the codex triage proposal stays disabled."
            exit 0
          fi
          node scripts/redirects/triage-agent.js \
            --mode propose \
            --report tmp/ga4-404-remediation/report.json \
            --output tmp/ga4-404-proposal/proposal.md \
            --model "${AGENTIC_TRANSLATION_MODEL:-deepseek-flash}" \
            --base-url "$AGENTIC_BASE_URL" \
            --api-key-env AGENTIC_PROVIDER_API_KEY \
            --reasoning-effort "${AGENTIC_REASONING_EFFORT:-medium}" \
            --codex-home "$RUNNER_TEMP/triage-codex-home" \
            --working-directory "$GITHUB_WORKSPACE"
          echo "proposal=true" >> "$GITHUB_OUTPUT"

      - name: Post the proposal comment
        if: ${{ steps.propose.outputs.proposal == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.remediation.outputs.pr_number }}
        run: gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file tmp/ga4-404-proposal/proposal.md

  # Applies operator replies on the remediation PR to the PR branch. Every
  # gate fails closed to a no-op. Two reply forms reach the same apply path:
  # a structured ga4-404-reply-data block, or (PR3) free text that the codex
  # interpreter translates into one block first. The executor's own comments
  # are prefix-marked and marker-free — that prefix gate is the loop breaker,
  # because the apply-step comments are authored by the PAT identity, which
  # is necessarily on the allowlist (the interpreter's notices post as
  # github-actions[bot], which the allowlist rejects on top of the prefix
  # gate). The interpreter's scope source is only the batch's machine triage
  # comment, so a quoted or forged triage block in any later comment cannot
  # widen what codex may decide.
  apply_reply:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request != null
    # The interpreter's notices and rejections post as github-actions[bot]
    # under this token (issues: write, no push scope); the push PAT stays
    # confined to the apply step.
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    # The interpreter adds a codex turn plus a dependency install on top of
    # the structured path; 20 minutes covers the worst turn without letting a
    # runaway agent hang the runner.
    timeout-minutes: 20
    steps:
      - name: Gate the reply
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          PR_NUMBER: ${{ github.event.issue.number }}
          ALLOWLIST: ${{ vars.GA4_404_REMEDIATION_ALLOWLIST }}
        run: |
          comment_body="$RUNNER_TEMP/comment-body.md"
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" --jq '.body' > "$comment_body"
          if [ -z "$ALLOWLIST" ]; then
            echo "::notice::GA4_404_REMEDIATION_ALLOWLIST is not configured; the reply executor stays disabled."
            exit 0
          fi
          case ",${ALLOWLIST}," in
            *",${COMMENT_AUTHOR},"*) ;;
            *) echo "::notice::Commenter ${COMMENT_AUTHOR} is not on the remediation allowlist; ignoring."; exit 0;;
          esac
          if grep -q 'ga4-404-triage:v1' "$comment_body"; then
            echo "::notice::Comment carries the triage block (bot post or full quote); reply with your own edited ga4-404-reply-data block only."
            exit 0
          fi
          if grep -q 'ga4-404-triage-proposal:v1' "$comment_body"; then
            echo "::notice::Comment carries a codex triage proposal (bot post or full quote); copy the JSON you agree with into your own ga4-404-reply-data block."
            exit 0
          fi
          # Every executor-authored comment (confirmations, rejections,
          # interpreter notices) starts with one of these prefixes; matching
          # one here is what stops the agent from interpreting its own output.
          case "$(cat "$comment_body")" in
            "Reply applied"*|"The reply could not be applied"*|"Triage reply interpreter"*)
              echo "::notice::This comment is executor output; ignoring to break the reply loop."
              exit 0;;
          esac
          reply_mode=interpret
          if grep -q 'ga4-404-reply-data begin' "$comment_body"; then
            reply_mode=block
          else
            # Scope source: only the machine triage comment the batch posted
            # at PR creation (first match). Without this filter any commenter
            # could forge a later triage-data block and hijack the
            # interpreter's scope and prompt.
            triage_comment=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" --jq '[.[] | select(.body | startswith("<!-- ga4-404-triage:v1 -->")) | .body] | .[0] // empty')
            if [ -z "$triage_comment" ]; then
              echo "::notice::No ga4-404-reply-data block and no triage context on this PR; nothing to apply."
              exit 0
            fi
          fi
          pr_json=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels,headRefName)
          if ! echo "$pr_json" | grep -q '"ga4-404-remediation"'; then
            echo "::notice::This PR does not carry the ga4-404-remediation label; ignoring."
            exit 0
          fi
          pr_branch=$(echo "$pr_json" | jq -r '.headRefName')
          case "$pr_branch" in
            ga4-404-remediation/*) ;;
            *) echo "::notice::This PR is not a remediation branch; ignoring."; exit 0;;
          esac
          {
            echo "should_apply=true"
            echo "reply_mode=${reply_mode}"
            echo "pr_branch=${pr_branch}"
            echo "pr_number=${PR_NUMBER}"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the remediation PR branch
        if: ${{ steps.gate.outputs.should_apply == 'true' }}
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.gate.outputs.pr_branch }}
          persist-credentials: false

      - name: Set up Node.js
        if: ${{ steps.gate.outputs.should_apply == 'true' }}
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          # Zero-dependency tool: no package-manager cache (the repo-root
          # pnpm-lock.yaml would otherwise make setup-node require pnpm).
          package-manager-cache: false

      # Interpreter mode only: the codex SDK ships with the repository
      # dependencies, so the structured-block path never pays for the install.
      - name: Install agent dependencies
        if: ${{ steps.gate.outputs.should_apply == 'true' && steps.gate.outputs.reply_mode == 'interpret' }}
        uses: pnpm/action-setup@v5

      - name: Set up Node.js with the pnpm store cache
        if: ${{ steps.gate.outputs.should_apply == 'true' && steps.gate.outputs.reply_mode == 'interpret' }}
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          # pnpm/action-setup ran above, so the explicit pnpm store cache is
          # available and the interpreter's monorepo install stops paying a
          # full cold download on every free-text reply.
          cache: pnpm

      - name: Install current tooling
        if: ${{ steps.gate.outputs.should_apply == 'true' && steps.gate.outputs.reply_mode == 'interpret' }}
        run: pnpm install --frozen-lockfile

      # PR3: the codex interpreter is a translator, not a decider. It turns
      # the operator's free text into exactly one reply block; the apply step
      # below still runs the deterministic generator, and the confirmation
      # comment shows the interpreted decisions for review. The push PAT never
      # enters this step; its comments go out as github-actions[bot], which
      # the allowlist rejects.
      - name: Interpret the free-text reply
        id: interpret
        if: ${{ steps.gate.outputs.should_apply == 'true' && steps.gate.outputs.reply_mode == 'interpret' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AGENTIC_PROVIDER_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AGENTIC_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          AGENTIC_TRANSLATION_MODEL: ${{ vars.AGENTIC_TRANSLATION_MODEL }}
          AGENTIC_REASONING_EFFORT: ${{ vars.AGENTIC_REASONING_EFFORT }}
        run: |
          if [ -z "$AGENTIC_PROVIDER_API_KEY" ] || [ -z "$AGENTIC_BASE_URL" ]; then
            printf 'Triage reply interpreter: the agentic gateway is not configured (DEEPSEEK_API_KEY secret + DEEPSEEK_BASE_URL var); the free-text interpreter cannot run. Post a structured ga4-404-reply-data block instead.\n' > "$RUNNER_TEMP/interpreter-notice.md"
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/interpreter-notice.md"
            echo '::error::Agentic gateway is not configured (DEEPSEEK_API_KEY secret + DEEPSEEK_BASE_URL var); the free-text interpreter cannot run. Post a structured ga4-404-reply-data block instead.'
            exit 1
          fi
          # Scope source: only the first machine triage comment (see the gate
          # step for why the forge-proof filter exists).
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" --jq '[.[] | select(.body | startswith("<!-- ga4-404-triage:v1 -->")) | .body] | .[0] // empty' > "$RUNNER_TEMP/triage-comments.md"
          extract_log="$(node scripts/redirects/triage-agent.js \
            --mode extract-triage \
            --comment-file "$RUNNER_TEMP/triage-comments.md" \
            --output "$RUNNER_TEMP/triage-entries.json" 2>&1)" || {
            printf 'Triage reply interpreter: could not read the machine triage block on this PR; nothing applied.\n\n    %s\n' "$(printf '%s' "$extract_log" | head -3)" > "$RUNNER_TEMP/interpreter-notice.md"
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/interpreter-notice.md"
            echo "::error::extract-triage failed: $extract_log"
            exit 1
          }
          interpret_status=0
          interpret_log="$(node scripts/redirects/triage-agent.js \
            --mode interpret \
            --triage-file "$RUNNER_TEMP/triage-entries.json" \
            --comment-file "$RUNNER_TEMP/comment-body.md" \
            --ledger scripts/redirects/ga4-404-remediation-ledger.json \
            --output "$RUNNER_TEMP/interpreted-reply.md" \
            --model "${AGENTIC_TRANSLATION_MODEL:-deepseek-flash}" \
            --base-url "$AGENTIC_BASE_URL" \
            --api-key-env AGENTIC_PROVIDER_API_KEY \
            --reasoning-effort "${AGENTIC_REASONING_EFFORT:-medium}" \
            --codex-home "$RUNNER_TEMP/triage-codex-home" \
            --working-directory "$GITHUB_WORKSPACE" 2>&1)" || interpret_status=$?
          # Never echo the reply markers back: an executor comment carrying
          # one would re-trigger the executor for one spurious cycle.
          interpret_log="${interpret_log//ga4-404-reply-data begin/(reply marker elided)}"
          interpret_log="${interpret_log//ga4-404-reply-data end/(reply marker elided)}"
          if [ "$interpret_status" -eq 0 ] && printf '%s' "$interpret_log" | grep -q 'interpret_result=no_decisions'; then
            printf 'Triage reply interpreter: no actionable decision found in the comment; nothing applied.\n\nRun: %s\n' "$RUN_URL" > "$RUNNER_TEMP/interpreter-notice.md"
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/interpreter-notice.md"
            exit 0
          fi
          if [ "$interpret_status" -ne 0 ]; then
            REJECTION_BODY="$interpret_log" node -e 'const fs=require("fs");const log=(process.env.REJECTION_BODY||"").slice(0,1000);fs.writeFileSync(process.env.RUNNER_TEMP+"/rejection.md","The reply could not be applied:\n\n    "+log.split("\n").join("\n    ")+"\n\n(No conf or ledger change was made; fix the comment or reply with a structured ga4-404-reply-data block.)\n")'
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/rejection.md"
            exit 1
          fi
          echo "reply_file=$RUNNER_TEMP/interpreted-reply.md" >> "$GITHUB_OUTPUT"
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      # The reply goes through the same apply path (one generator, one ledger
      # merge) for both the structured block and the interpreted block.
      # Failures post the rejection reason and fail the run.
      - name: Apply the reply to the PR branch
        id: apply
        if: ${{ steps.gate.outputs.should_apply == 'true' && (steps.gate.outputs.reply_mode == 'block' || steps.interpret.outputs.proceed == 'true') }}
        env:
          GH_TOKEN: ${{ secrets.REST_UPSTREAM_REFRESH_PAT }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          PR_BRANCH: ${{ steps.gate.outputs.pr_branch }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          REPLY_MODE: ${{ steps.gate.outputs.reply_mode }}
          INTERPRETED_REPLY_FILE: ${{ steps.interpret.outputs.reply_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test -n "$GH_TOKEN" || {
            echo 'REST_UPSTREAM_REFRESH_PAT is not configured; the reply cannot be applied.' >&2
            exit 1
          }
          # Integrity guard: in interpret mode a full-access codex turn just
          # ran in this workspace, and the next commands execute its output.
          # Refuse to apply if any tracked file moved underneath the
          # generator, and never let a planted git hook run.
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo '::error::workspace is dirty after the interpreter turn; refusing to apply possibly tampered state.' >&2
            exit 1
          fi
          reply_file="$RUNNER_TEMP/comment-body.md"
          if [ "$REPLY_MODE" = "interpret" ]; then
            test -n "$INTERPRETED_REPLY_FILE" && test -s "$INTERPRETED_REPLY_FILE" || {
              echo '::error::the interpreter did not produce a reply file; refusing to apply an empty decision.'
              exit 1
            }
            reply_file="$INTERPRETED_REPLY_FILE"
          fi
          apply_log="$(node scripts/redirects/ga4-404-remediation.js \
            --mode apply \
            --reply-file "$reply_file" \
            --conf deploy/en/nginx.conf \
            --snapshot deploy/contracts/en-redirect-target-routes.json \
            --ledger scripts/redirects/ga4-404-remediation-ledger.json \
            --output-dir tmp/apply \
            --write-conf 2>&1)" || {
            # Never echo the reply markers back: a rejection comment carrying
            # one would re-trigger the executor for one spurious cycle.
            apply_log="${apply_log//ga4-404-reply-data begin/(reply marker elided)}"
            apply_log="${apply_log//ga4-404-reply-data end/(reply marker elided)}"
            REJECTION_BODY="$apply_log" node -e 'const fs=require("fs");const log=(process.env.REJECTION_BODY||"").slice(0,1000);fs.writeFileSync(process.env.RUNNER_TEMP+"/rejection.md","The reply could not be applied:\n\n    "+log.split("\n").join("\n    ")+"\n\n(No conf or ledger change was made; fix the block and reply again.)\n")'
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/rejection.md"
            exit 1
          }
          printf '%s\n' "$apply_log" > "$RUNNER_TEMP/apply-log.txt"
          rules=$(sed -n 's/^mode=apply rules=\([0-9][0-9]*\)/\1/p' "$RUNNER_TEMP/apply-log.txt")
          cp tmp/apply/ledger.json scripts/redirects/ga4-404-remediation-ledger.json
          git config user.name "zdoc ga4-404 bot"
          git config user.email "bot@zilliz.com"
          git add scripts/redirects/ga4-404-remediation-ledger.json
          if [ "${rules:-0}" != "0" ]; then
            git add deploy/en/nginx.conf
          fi
          if git diff --cached --quiet; then
            echo '::error::The reply produced no committed changes; nothing to push.'
            exit 1
          fi
          git commit --no-verify -m "chore(redirects): apply triage reply from @${COMMENT_AUTHOR} (${rules:-0} rules, ledger update)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${PR_BRANCH}"
          # Executor-authored comments are prefix-marked ("Reply applied") and
          # never carry reply markers; the interpreted decisions are echoed
          # as bare JSON so the operator reviews exactly what the agent
          # understood without arming the loop.
          if [ "$REPLY_MODE" = "interpret" ]; then
            # Node builds the whole body: a literal code fence in a shell
            # format string trips shellcheck SC2016 (same trap as PR2), and
            # \x60 keeps the backtick out of the single-quoted script.
            REPLY_FILE="$reply_file" \
            RULES="${rules:-0}" \
            AUTHOR="$COMMENT_AUTHOR" \
            RUN_URL="$RUN_URL" \
            CONFIRMATION_FILE="$RUNNER_TEMP/confirmation.md" \
            node -e 'const fs=require("fs");const {extractReplyBlock}=require("./scripts/redirects/reply.js");const extracted=extractReplyBlock(fs.readFileSync(process.env.REPLY_FILE,"utf8"));if(!extracted.ok){process.exit(1)}const fence="\x60\x60\x60";const body=["Reply applied (interpreted from your comment by the triage agent): "+process.env.RULES+" rule(s) + ledger update pushed to this PR by @"+process.env.AUTHOR+".","","Interpreted decisions (the commit below is the source of truth):","",fence+"json",extracted.payload,fence,"","Conf and ledger changes always come from the generator (scripts/redirects/); review the new commit as usual.","","Run: "+process.env.RUN_URL,""].join("\n");fs.writeFileSync(process.env.CONFIRMATION_FILE,body)'
          else
            printf 'Reply applied: %s rule(s) + ledger update pushed to this PR by @%s.\n\nConf and ledger changes always come from the generator (scripts/redirects/); review the new commit as usual.\n\nRun: %s\n' "${rules:-0}" "$COMMENT_AUTHOR" "$RUN_URL" > "$RUNNER_TEMP/confirmation.md"
          fi
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/confirmation.md"
