name: fetch shared guides sources

on:
  workflow_call:
    inputs:
      master_sha: { required: true, type: string }
      dev_baseline_sha: { required: true, type: string }
      artifact_retention_days: { required: false, type: number, default: 3 }
    outputs:
      status: { value: '${{ jobs.fetch.outputs.status }}' }
      artifact_name: { value: '${{ jobs.fetch.outputs.artifact_name }}' }
      table_matrix: { value: '${{ jobs.fetch.outputs.table_matrix }}' }
      table_count: { value: '${{ jobs.fetch.outputs.table_count }}' }
      source_valid: { value: '${{ jobs.fetch.outputs.source_valid }}' }
      media_valid: { value: '${{ jobs.fetch.outputs.media_valid }}' }
      cache_version: { value: '${{ jobs.fetch.outputs.cache_version }}' }
      cache_save_required: { value: '${{ jobs.fetch.outputs.cache_save_required }}' }
      assembly_decision_sha256: { value: '${{ jobs.fetch.outputs.assembly_decision_sha256 }}' }
    secrets:
      APP_ID: { required: true }
      APP_SECRET: { required: true }
      SPACE_ID: { required: true }
      FIGMA_API_KEY: { required: true }
      MODEL_API_KEY: { required: true }
      AWS_ACCESS_KEY_ID: { required: true }
      AWS_SECRET_ACCESS_KEY: { required: true }

permissions:
  actions: read
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      status: ${{ steps.result.outputs.status }}
      artifact_name: guides-sources-${{ github.run_id }}
      table_matrix: ${{ steps.table_matrix.outputs.matrix }}
      table_count: ${{ steps.table_matrix.outputs.count }}
      source_valid: ${{ steps.source_cache_result.outputs.source_valid }}
      media_valid: ${{ steps.source_cache_result.outputs.media_valid }}
      cache_version: ${{ steps.source_cache_result.outputs.cache_version }}
      cache_save_required: ${{ steps.source_cache_result.outputs.cache_save_required }}
      assembly_decision_sha256: ${{ steps.assembly_decision.outputs.assembly_decision_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.master_sha }}', fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Prepare immutable baseline
        run: |
          git fetch --no-tags origin "${{ inputs.dev_baseline_sha }}"
          git worktree add --detach "$RUNNER_TEMP/baseline" "${{ inputs.dev_baseline_sha }}"
          bash scripts/restore-generated-state.sh --exact --ref "${{ inputs.dev_baseline_sha }}"
      - id: source_cache_keys
        name: Compute Guides cache generation keys
        run: |
          snapshot=packages/docs-tooling/src/lark/meta/snapshots/guides-uat-last-success.json
          if [[ -f "$snapshot" ]]; then
            v4_restore_enabled=true
            generation=$(node scripts/docs-workflow/guides-source-cache-generation.js keys \
              --snapshot "$snapshot" \
              --run-id "${{ github.run_id }}" \
              --run-attempt "${{ github.run_attempt }}")
            v4_lookup=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).lookupKey)' "$generation")
            v4_prefix=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).prefix)' "$generation")
            v3=$(node scripts/docs-workflow/guides-source-cache.js key --snapshot "$snapshot" --version 3)
            v2=$(node scripts/docs-workflow/guides-source-cache.js key --snapshot "$snapshot" --version 2)
            v1=$(node scripts/docs-workflow/guides-source-cache.js key --snapshot "$snapshot" --version 1)
          else
            v4_restore_enabled=false
            v4_prefix=
            v4_lookup="guides-source-v4-no-snapshot-${{ github.run_id }}-${{ github.run_attempt }}"
            v3="guides-source-v3-bootstrap-${{ inputs.dev_baseline_sha }}"
            v2="guides-source-v2-bootstrap-${{ inputs.dev_baseline_sha }}"
            v1="guides-source-v1-bootstrap-${{ inputs.dev_baseline_sha }}"
          fi
          printf 'v4_restore_enabled=%s\nv4_lookup=%s\nv4_prefix=%s\nv3=%s\nv2=%s\nv1=%s\n' \
            "$v4_restore_enabled" "$v4_lookup" "$v4_prefix" "$v3" "$v2" "$v1" >> "$GITHUB_OUTPUT"
      - id: source_cache_v4
        name: Restore Guides v4 cache candidate
        if: ${{ steps.source_cache_keys.outputs.v4_restore_enabled == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: tmp/guides-source-cache-v4
          key: ${{ steps.source_cache_keys.outputs.v4_lookup }}
          restore-keys: ${{ steps.source_cache_keys.outputs.v4_prefix }}
      - id: source_cache_v4_check
        name: Validate and promote Guides v4 cache candidate
        run: |
          source_valid=false
          media_valid=false
          candidate_present=false
          snapshot=packages/docs-tooling/src/lark/meta/snapshots/guides-uat-last-success.json
          payload=tmp/guides-source-cache-v4
          staged="$RUNNER_TEMP/guides-source-cache-v4"
          rm -rf "$staged"
          [[ -e "$payload" || -L "$payload" ]] && candidate_present=true
          if [[ -d "$payload" && ! -L "$payload" && -f "$snapshot" ]]; then
            cp -a "$payload" "$staged"
            rm -rf tmp/guides-source-cache-v4
            if node scripts/docs-workflow/guides-source-cache-source-promotion.js validate \
              --payload "$staged" --snapshot "$snapshot" \
              --root-token Tg6mwbRGDitPQ3kLUQzc44I7nth; then
              if node scripts/docs-workflow/guides-source-cache.js validate-media \
                --source-dir "$staged/sources" --snapshot "$snapshot" \
                --manifest "$staged/source-manifest.json" \
                --media-manifest "$staged/media-manifest.json"; then
                if node scripts/docs-workflow/guides-source-cache-generation.js validate \
                  --payload "$staged" --snapshot "$snapshot" --root-token Tg6mwbRGDitPQ3kLUQzc44I7nth; then
                  node scripts/docs-workflow/guides-source-cache-generation.js promote \
                  --payload "$staged" --workspace "$GITHUB_WORKSPACE" \
                  --snapshot "$snapshot" --root-token Tg6mwbRGDitPQ3kLUQzc44I7nth
                  source_valid=true
                  media_valid=true
                fi
              else
                node scripts/docs-workflow/guides-source-cache-source-promotion.js promote \
                  --payload "$staged" --workspace "$GITHUB_WORKSPACE" \
                  --snapshot "$snapshot" --root-token Tg6mwbRGDitPQ3kLUQzc44I7nth
                source_valid=true
              fi
            fi
          fi
          rm -rf "$staged" tmp/guides-source-cache-v4
          if [[ "$source_valid" != true ]]; then
            node scripts/docs-workflow/guides-source-cache-source-promotion.js cleanup \
              --workspace "$GITHUB_WORKSPACE" --scope all
          fi
          printf 'source_valid=%s\nmedia_valid=%s\ncandidate_present=%s\n' \
            "$source_valid" "$media_valid" "$candidate_present" >> "$GITHUB_OUTPUT"
      - id: source_cache_v3
        name: Restore Guides v3 cache candidate
        if: ${{ steps.source_cache_v4_check.outputs.source_valid != 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/docs-tooling/src/lark/meta/sources/guides
            packages/docs-tooling/src/lark/meta/source-cache/guides-manifest.json
            packages/docs-tooling/src/lark/meta/media-cache/guides.json
          key: ${{ steps.source_cache_keys.outputs.v3 }}
      - id: source_cache_v3_check
        name: Validate Guides v3 cache candidate
        run: |
          source_valid=false
          media_valid=false
          candidate_present=false
          snapshot=packages/docs-tooling/src/lark/meta/snapshots/guides-uat-last-success.json
          manifest=packages/docs-tooling/src/lark/meta/source-cache/guides-manifest.json
          media=packages/docs-tooling/src/lark/meta/media-cache/guides.json
          if [[ "${{ steps.source_cache_v4_check.outputs.source_valid }}" == true ]]; then
            source_valid=true
            media_valid="${{ steps.source_cache_v4_check.outputs.media_valid }}"
          else
            [[ -e packages/docs-tooling/src/lark/meta/sources/guides || -L packages/docs-tooling/src/lark/meta/sources/guides || \
               -e "$manifest" || -L "$manifest" || -e "$media" || -L "$media" ]] && candidate_present=true
            if [[ -f "$snapshot" ]] && node scripts/docs-workflow/guides-source-cache-source-promotion.js validate-live-source \
              --workspace "$GITHUB_WORKSPACE" --snapshot "$snapshot" \
              --root-token Tg6mwbRGDitPQ3kLUQzc44I7nth --schemas 2; then
              source_valid=true
              if node scripts/docs-workflow/guides-source-cache-source-promotion.js validate-live-media \
                --workspace "$GITHUB_WORKSPACE" --snapshot "$snapshot"; then
                media_valid=true
              fi
            fi
            if [[ "$source_valid" != true ]]; then
              node scripts/docs-workflow/guides-source-cache-source-promotion.js cleanup \
                --workspace "$GITHUB_WORKSPACE" --scope all
            elif [[ "$media_valid" != true ]]; then
              node scripts/docs-workflow/guides-source-cache-source-promotion.js cleanup \
                --workspace "$GITHUB_WORKSPACE" --scope media
            fi
          fi
          printf 'source_valid=%s\nmedia_valid=%s\ncandidate_present=%s\n' \
            "$source_valid" "$media_valid" "$candidate_present" >> "$GITHUB_OUTPUT"
      - id: source_cache_v2
        name: Restore Guides v2 cache candidate
        if: ${{ steps.source_cache_v3_check.outputs.source_valid != 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/docs-tooling/src/lark/meta/sources/guides
            packages/docs-tooling/src/lark/meta/source-cache/guides-manifest.json
            packages/docs-tooling/src/lark/meta/media-cache/guides.json
          key: ${{ steps.source_cache_keys.outputs.v2 }}
      - id: source_cache_v2_check
        name: Validate Guides v2 cache candidate
        run: |
          source_valid=false
          media_valid=false
          candidate_present=false
          snapshot=packages/docs-tooling/src/lark/meta/snapshots/guides-uat-last-success.json
          manifest=packages/docs-tooling/src/lark/meta/source-cache/guides-manifest.json
          media=packages/docs-tooling/src/lark/meta/media-cache/guides.json
          if [[ "${{ steps.source_cache_v3_check.outputs.source_valid }}" == true ]]; then
            source_valid=true
            media_valid="${{ steps.source_cache_v3_check.outputs.media_valid }}"
          else
            [[ -e packages/docs-tooling/src/lark/meta/sources/guides || -L packages/docs-tooling/src/lark/meta/sources/guides || \
               -e "$manifest" || -L "$manifest" || -e "$media" || -L "$media" ]] && candidate_present=true
            if [[ -f "$snapshot" ]] && node scripts/docs-workflow/guides-source-cache-source-promotion.js validate-live-source \
              --workspace "$GITHUB_WORKSPACE" --snapshot "$snapshot" \
              --root-token Tg6mwbRGDitPQ3kLUQzc44I7nth --schemas 2; then
              source_valid=true
              if node scripts/docs-workflow/guides-source-cache-source-promotion.js validate-live-media \
                --workspace "$GITHUB_WORKSPACE" --snapshot "$snapshot"; then
                media_valid=true
              fi
            fi
            if [[ "$source_valid" != true ]]; then
              node scripts/docs-workflow/guides-source-cache-source-promotion.js cleanup \
                --workspace "$GITHUB_WORKSPACE" --scope all
            elif [[ "$media_valid" != true ]]; then
              node scripts/docs-workflow/guides-source-cache-source-promotion.js cleanup \
                --workspace "$GITHUB_WORKSPACE" --scope media
            fi
          fi
          printf 'source_valid=%s\nmedia_valid=%s\ncandidate_present=%s\n' \
            "$source_valid" "$media_valid" "$candidate_present" >> "$GITHUB_OUTPUT"
      - id: source_cache_v1
        name: Restore Guides v1 cache candidate
        if: ${{ steps.source_cache_v2_check.outputs.source_valid != 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/docs-tooling/src/lark/meta/sources/guides
            packages/docs-tooling/src/lark/meta/source-cache/guides-manifest.json
          key: ${{ steps.source_cache_keys.outputs.v1 }}
      - id: source_cache_v1_check
        name: Validate Guides v1 cache candidate
        run: |
          source_valid=false
          media_valid=false
          candidate_present=false
          snapshot=packages/docs-tooling/src/lark/meta/snapshots/guides-uat-last-success.json
          manifest=packages/docs-tooling/src/lark/meta/source-cache/guides-manifest.json
          if [[ "${{ steps.source_cache_v2_check.outputs.source_valid }}" == true ]]; then
            source_valid=true
            media_valid="${{ steps.source_cache_v2_check.outputs.media_valid }}"
          else
            [[ -e packages/docs-tooling/src/lark/meta/sources/guides || -L packages/docs-tooling/src/lark/meta/sources/guides || \
               -e "$manifest" || -L "$manifest" ]] && candidate_present=true
            if [[ -f "$snapshot" ]] && node scripts/docs-workflow/guides-source-cache-source-promotion.js validate-live-source \
              --workspace "$GITHUB_WORKSPACE" --snapshot "$snapshot" \
              --root-token Tg6mwbRGDitPQ3kLUQzc44I7nth --schemas 1,2; then
              source_valid=true
            fi
            if [[ "$source_valid" != true ]]; then
              node scripts/docs-workflow/guides-source-cache-source-promotion.js cleanup \
                --workspace "$GITHUB_WORKSPACE" --scope all
            fi
          fi
          printf 'source_valid=%s\nmedia_valid=%s\ncandidate_present=%s\n' \
            "$source_valid" "$media_valid" "$candidate_present" >> "$GITHUB_OUTPUT"
      - id: source_cache_check
        name: Select validated Guides cache candidate
        run: |
          source_valid=false
          media_valid=false
          cache_version=none
          cache_state=missing
          if [[ "${{ steps.source_cache_v4_check.outputs.source_valid }}" == true ]]; then
            source_valid=true
            cache_version=v4
            media_valid="${{ steps.source_cache_v4_check.outputs.media_valid }}"
            if [[ "$media_valid" == true ]]; then
              cache_state=valid
            else
              cache_state=invalid
            fi
          elif [[ "${{ steps.source_cache_v3_check.outputs.source_valid }}" == true ]]; then
            source_valid=true
            cache_version=v3
            cache_state=legacy
          elif [[ "${{ steps.source_cache_v2_check.outputs.source_valid }}" == true ]]; then
            source_valid=true
            cache_version=v2
            cache_state=legacy
          elif [[ "${{ steps.source_cache_v1_check.outputs.source_valid }}" == true ]]; then
            source_valid=true
            cache_version=v1
            cache_state=legacy
          elif [[ "${{ steps.source_cache_v4_check.outputs.candidate_present }}" == true || \
                  "${{ steps.source_cache_v3_check.outputs.candidate_present }}" == true || \
                  "${{ steps.source_cache_v2_check.outputs.candidate_present }}" == true || \
                  "${{ steps.source_cache_v1_check.outputs.candidate_present }}" == true ]]; then
            cache_state=invalid
          fi
          printf 'source_valid=%s\nmedia_valid=%s\ncache_version=%s\ncache_state=%s\n' \
            "$source_valid" "$media_valid" "$cache_version" "$cache_state" >> "$GITHUB_OUTPUT"
          echo "[source-cache] source=$source_valid media=$media_valid version=$cache_version state=$cache_state"
      - name: Fetch shared guides sources
        run: |
          args=(--group guides --stage source)
          if [[ "${{ steps.source_cache_check.outputs.source_valid }}" != true ]]; then
            echo "[source-cache] Source graph unavailable; forcing full bootstrap fetch."
            args+=(--force-full-fetch)
          fi
          node scripts/docs-workflow/run-content-group.js "${args[@]}"
        env:
          DOCS_BUILD_ENV: uat
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          FEISHU_HOST: ${{ vars.FEISHU_HOST }}
          SPACE_ID: ${{ secrets.SPACE_ID }}
          FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
          MODEL_API_BASE_URL: ${{ vars.MODEL_API_BASE_URL }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          MODEL_ID: ${{ vars.MODEL_ID }}
      - id: media_prefetch
        name: Prefetch shared guides media
        run: |
          args=(
            --source-dir packages/docs-tooling/src/lark/meta/sources/guides
            --output packages/docs-tooling/src/lark/meta/media-cache/guides.json
            --snapshot packages/docs-tooling/src/lark/meta/reports/guides-source-snapshot-candidate.json
            --report packages/docs-tooling/src/lark/meta/reports/guides-media-prefetch.json
            --bootstrap-docs docs,docs-byoc
            --concurrency 4
          )
          if [[ "${{ steps.source_cache_check.outputs.media_valid }}" == true ]]; then
            mode=incremental
            cache_state=valid
            args+=(
              --mode incremental
              --cache-state valid
              --plan packages/docs-tooling/src/lark/meta/reports/guides-incremental-fetch-plan.json
              --previous-manifest packages/docs-tooling/src/lark/meta/media-cache/guides.json
            )
          else
            echo "[source-cache] Media cache unavailable; rebuilding complete canonical media coverage."
            mode=recovery
            cache_state="${{ steps.source_cache_check.outputs.cache_state }}"
            [[ "$cache_state" =~ ^(invalid|missing|legacy)$ ]] || cache_state=missing
            args+=(--mode recovery --cache-state "$cache_state")
          fi
          node scripts/docs-workflow/guides-media-prefetch.js "${args[@]}"
          printf 'mode=%s\ncache_state=%s\n' "$mode" "$cache_state" >> "$GITHUB_OUTPUT"
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          FEISHU_HOST: ${{ vars.FEISHU_HOST }}
          FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
          AWS_BUCKET: ${{ vars.AWS_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          IMAGE_BED_URL: ${{ vars.IMAGE_BED_URL }}
          GUIDES_FIGMA_MAX_CONCURRENT: '1'
          GUIDES_FIGMA_MIN_TIME_MS: '1000'
      - id: source_cache_result
        name: Finalize Guides cache generation state
        run: |
          candidate=packages/docs-tooling/src/lark/meta/reports/guides-source-snapshot-candidate.json
          baseline=packages/docs-tooling/src/lark/meta/snapshots/guides-uat-last-success.json
          cache_version="${{ steps.source_cache_check.outputs.cache_version }}"
          cache_save_required=$(node scripts/docs-workflow/guides-cache-save-decision.js decide \
            --cache-version "$cache_version" \
            --prefetch-mode "${{ steps.media_prefetch.outputs.mode }}" \
            --candidate "$candidate" \
            --baseline "$baseline")
          printf 'source_valid=true\nmedia_valid=true\ncache_version=%s\ncache_save_required=%s\n' \
            "$cache_version" "$cache_save_required" >> "$GITHUB_OUTPUT"
      - id: table_matrix
        name: Build Guides table render matrix
        run: |
          matrix=$(node scripts/docs-workflow/guides-tables.js matrix \
            --plan packages/docs-tooling/src/lark/meta/reports/guides-incremental-fetch-plan.json \
            --snapshot packages/docs-tooling/src/lark/meta/reports/guides-source-snapshot-candidate.json)
          count=$(node -e 'const value=JSON.parse(process.argv[1]);process.stdout.write(String(value.length))' "$matrix")
          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - id: assembly_decision
        name: Evaluate Guides assembly reuse
        run: |
          baseline_source_sha=$(git -C "$RUNNER_TEMP/baseline" rev-parse HEAD)
          [[ "$baseline_source_sha" == "${{ inputs.dev_baseline_sha }}" ]] || { echo 'Exact Guides baseline SHA mismatch' >&2; exit 1; }
          node scripts/docs-workflow/guides-assembly-identity.js decide \
            --repository-root "$GITHUB_WORKSPACE" \
            --baseline-root "$RUNNER_TEMP/baseline" \
            --candidate-snapshot packages/docs-tooling/src/lark/meta/reports/guides-source-snapshot-candidate.json \
            --incremental-plan packages/docs-tooling/src/lark/meta/reports/guides-incremental-fetch-plan.json \
            --baseline-descriptor packages/docs-tooling/src/lark/meta/assembly/guides.json \
            --baseline-saas-sidebar config/generated/guides.sidebar.js \
            --baseline-byoc-sidebar config/generated/guides-byoc.sidebar.js \
            --master-sha "${{ inputs.master_sha }}" \
            --dev-baseline-sha "${{ inputs.dev_baseline_sha }}" \
            --baseline-source-sha "$baseline_source_sha" \
            --table-count "${{ steps.table_matrix.outputs.count }}" \
            --output packages/docs-tooling/src/lark/meta/reports/guides-assembly-decision.json
          node scripts/docs-workflow/guides-assembly-identity.js validate-decision \
            --repository-root "$GITHUB_WORKSPACE" \
            --input packages/docs-tooling/src/lark/meta/reports/guides-assembly-decision.json \
            --expected-master-sha "${{ inputs.master_sha }}" \
            --expected-dev-baseline-sha "${{ inputs.dev_baseline_sha }}"
          decision_sha=$(node scripts/docs-workflow/guides-assembly-identity.js decision-sha \
            --repository-root "$GITHUB_WORKSPACE" \
            --input packages/docs-tooling/src/lark/meta/reports/guides-assembly-decision.json \
            --expected-master-sha "${{ inputs.master_sha }}" \
            --expected-dev-baseline-sha "${{ inputs.dev_baseline_sha }}")
          echo "assembly_decision_sha256=$decision_sha" >> "$GITHUB_OUTPUT"
      - name: Create Guides progress metadata
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/docs-progress-metadata"
          node -e 'const fs=require("node:fs");const value={schemaVersion:1,runId:Number(process.env.GITHUB_RUN_ID),guidesTableTotal:Number(process.argv[1])};fs.writeFileSync(process.argv[2],`${JSON.stringify(value)}\n`)' "${{ steps.table_matrix.outputs.count }}" "$RUNNER_TEMP/docs-progress-metadata/progress-metadata.json"
      - name: Upload Guides progress metadata
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: docs-progress-metadata-${{ github.run_id }}
          path: ${{ runner.temp }}/docs-progress-metadata/progress-metadata.json
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: ignore
      - name: Create shared source artifact
        run: |
          node scripts/docs-workflow/guides-source-cache.js create --source-dir packages/docs-tooling/src/lark/meta/sources/guides --snapshot packages/docs-tooling/src/lark/meta/reports/guides-source-snapshot-candidate.json --output "$RUNNER_TEMP/guides-source-manifest.json" --media-manifest packages/docs-tooling/src/lark/meta/media-cache/guides.json --root-token Tg6mwbRGDitPQ3kLUQzc44I7nth
          node scripts/docs-workflow/guides-stage-artifact.js --operation create --stage source --workspace "$GITHUB_WORKSPACE" --baseline-dir "$RUNNER_TEMP/baseline" --output "$RUNNER_TEMP/guides-source" --master-sha "${{ inputs.master_sha }}" --dev-baseline-sha "${{ inputs.dev_baseline_sha }}" --snapshot-candidate packages/docs-tooling/src/lark/meta/reports/guides-source-snapshot-candidate.json --root-token Tg6mwbRGDitPQ3kLUQzc44I7nth
          tar -cf "$RUNNER_TEMP/guides-source.tar" -C "$RUNNER_TEMP" guides-source
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: guides-sources-${{ github.run_id }}
          path: ${{ runner.temp }}/guides-source.tar
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error
      - id: result
        if: ${{ always() }}
        run: echo "status=${{ steps.upload.outcome == 'success' && 'artifact_ready' || 'failed' }}" >> "$GITHUB_OUTPUT"
      - if: ${{ always() }}
        run: git worktree remove --force "$RUNNER_TEMP/baseline" || true
