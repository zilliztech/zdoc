name: fetch shared guides sources

on:
  workflow_call:
    inputs:
      master_sha: { required: true, type: string }
      dev_baseline_sha: { required: true, type: string }
      artifact_retention_days: { required: false, type: number, default: 3 }
    outputs:
      status: { value: '${{ jobs.fetch.outputs.status }}' }
      artifact_name: { value: '${{ jobs.fetch.outputs.artifact_name }}' }
      table_matrix: { value: '${{ jobs.fetch.outputs.table_matrix }}' }
      table_count: { value: '${{ jobs.fetch.outputs.table_count }}' }
    secrets:
      APP_ID: { required: true }
      APP_SECRET: { required: true }
      SPACE_ID: { required: true }
      FIGMA_API_KEY: { required: true }
      MODEL_API_KEY: { required: true }
      AWS_ACCESS_KEY_ID: { required: true }
      AWS_SECRET_ACCESS_KEY: { required: true }

permissions:
  actions: read
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      status: ${{ steps.result.outputs.status }}
      artifact_name: guides-sources-${{ github.run_id }}
      table_matrix: ${{ steps.table_matrix.outputs.matrix }}
      table_count: ${{ steps.table_matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.master_sha }}', fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Prepare immutable baseline
        run: |
          git fetch --no-tags origin "${{ inputs.dev_baseline_sha }}"
          git worktree add --detach "$RUNNER_TEMP/baseline" "${{ inputs.dev_baseline_sha }}"
          bash scripts/restore-generated-state.sh --exact --ref "${{ inputs.dev_baseline_sha }}"
      - id: source_cache_keys
        name: Compute Guides source cache keys
        run: |
          snapshot=plugins/lark-docs/meta/snapshots/guides-uat-last-success.json
          if [[ -f "$snapshot" ]]; then
            v2=$(node scripts/docs-workflow/guides-source-cache.js key --snapshot "$snapshot" --version 2)
            v1=$(node scripts/docs-workflow/guides-source-cache.js key --snapshot "$snapshot" --version 1)
          else
            v2="guides-source-v2-bootstrap-${{ inputs.dev_baseline_sha }}"
            v1="guides-source-v1-bootstrap-${{ inputs.dev_baseline_sha }}"
          fi
          printf 'v2=%s\nv1=%s\n' "$v2" "$v1" >> "$GITHUB_OUTPUT"
      - id: source_cache_v2
        uses: actions/cache/restore@v4
        with:
          path: |
            plugins/lark-docs/meta/sources/guides
            plugins/lark-docs/meta/source-cache/guides-manifest.json
            plugins/lark-docs/meta/media-cache/guides.json
          key: ${{ steps.source_cache_keys.outputs.v2 }}
      - id: source_cache_v1
        if: ${{ steps.source_cache_v2.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            plugins/lark-docs/meta/sources/guides
            plugins/lark-docs/meta/source-cache/guides-manifest.json
          key: ${{ steps.source_cache_keys.outputs.v1 }}
      - id: source_cache_check
        name: Validate restored guides source cache
        run: |
          source_valid=false
          media_valid=false
          cache_version=none
          snapshot=plugins/lark-docs/meta/snapshots/guides-uat-last-success.json
          manifest=plugins/lark-docs/meta/source-cache/guides-manifest.json
          media=plugins/lark-docs/meta/media-cache/guides.json

          if [[ "${{ steps.source_cache_v2.outputs.cache-hit }}" == true ]]; then
            cache_version=v2
          elif [[ "${{ steps.source_cache_v1.outputs.cache-hit }}" == true ]]; then
            cache_version=v1
          fi

          if [[ "$cache_version" != none && -f "$snapshot" && -f "$manifest" ]]; then
            schemas=2
            [[ "$cache_version" == v1 ]] && schemas=1,2
            if node scripts/docs-workflow/guides-source-cache.js validate-source \
              --source-dir plugins/lark-docs/meta/sources/guides \
              --snapshot "$snapshot" \
              --manifest "$manifest" \
              --root-token Tg6mwbRGDitPQ3kLUQzc44I7nth \
              --schemas "$schemas"; then
              source_valid=true
            fi
          fi

          if [[ "$source_valid" == true && "$cache_version" == v2 && -f "$media" ]]; then
            if node scripts/docs-workflow/guides-source-cache.js validate-media \
              --source-dir plugins/lark-docs/meta/sources/guides \
              --snapshot "$snapshot" \
              --manifest "$manifest" \
              --media-manifest "$media"; then
              media_valid=true
            fi
          fi

          if [[ "$source_valid" != true ]]; then
            rm -rf plugins/lark-docs/meta/sources/guides plugins/lark-docs/meta/source-cache
          fi
          if [[ "$media_valid" != true ]]; then
            rm -rf plugins/lark-docs/meta/media-cache
          fi
          printf 'source_valid=%s\nmedia_valid=%s\ncache_version=%s\n' \
            "$source_valid" "$media_valid" "$cache_version" >> "$GITHUB_OUTPUT"
          echo "[source-cache] source=$source_valid media=$media_valid version=$cache_version"
      - name: Fetch shared guides sources
        run: |
          args=(--group guides --stage source)
          if [[ "${{ steps.source_cache_check.outputs.source_valid }}" != true ]]; then
            echo "[source-cache] Source graph unavailable; forcing full bootstrap fetch."
            args+=(--force-full-fetch)
          fi
          node scripts/docs-workflow/run-content-group.js "${args[@]}"
        env:
          DOCS_BUILD_ENV: uat
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          FEISHU_HOST: ${{ vars.FEISHU_HOST }}
          SPACE_ID: ${{ secrets.SPACE_ID }}
          FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
          MODEL_API_BASE_URL: ${{ vars.MODEL_API_BASE_URL }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          MODEL_ID: ${{ vars.MODEL_ID }}
      - name: Prefetch shared guides media
        run: |
          node scripts/docs-workflow/guides-media-prefetch.js \
            --source-dir plugins/lark-docs/meta/sources/guides \
            --output plugins/lark-docs/meta/media-cache/guides.json \
            --plan plugins/lark-docs/meta/reports/guides-incremental-fetch-plan.json \
            --snapshot plugins/lark-docs/meta/reports/guides-source-snapshot-candidate.json \
            --previous-manifest plugins/lark-docs/meta/media-cache/guides.json \
            --bootstrap-docs docs,docs-byoc \
            --reuse-existing "${{ steps.source_cache_check.outputs.source_valid != 'true' }}" \
            --concurrency 4
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          FEISHU_HOST: ${{ vars.FEISHU_HOST }}
          FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
          AWS_BUCKET: ${{ vars.AWS_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          IMAGE_BED_URL: ${{ vars.IMAGE_BED_URL }}
          GUIDES_FIGMA_MAX_CONCURRENT: '1'
          GUIDES_FIGMA_MIN_TIME_MS: '1000'
      - id: table_matrix
        name: Build Guides table render matrix
        run: |
          matrix=$(node scripts/docs-workflow/guides-tables.js matrix \
            --plan plugins/lark-docs/meta/reports/guides-incremental-fetch-plan.json \
            --snapshot plugins/lark-docs/meta/reports/guides-source-snapshot-candidate.json)
          count=$(node -e 'const value=JSON.parse(process.argv[1]);process.stdout.write(String(value.length))' "$matrix")
          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Create Guides progress metadata
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/docs-progress-metadata"
          node -e 'const fs=require("node:fs");const value={schemaVersion:1,runId:Number(process.env.GITHUB_RUN_ID),guidesTableTotal:Number(process.argv[1])};fs.writeFileSync(process.argv[2],`${JSON.stringify(value)}\n`)' "${{ steps.table_matrix.outputs.count }}" "$RUNNER_TEMP/docs-progress-metadata/progress-metadata.json"
      - name: Upload Guides progress metadata
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: docs-progress-metadata-${{ github.run_id }}
          path: ${{ runner.temp }}/docs-progress-metadata/progress-metadata.json
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: ignore
      - name: Create shared source artifact
        run: |
          node scripts/docs-workflow/guides-source-cache.js create --source-dir plugins/lark-docs/meta/sources/guides --snapshot plugins/lark-docs/meta/reports/guides-source-snapshot-candidate.json --output "$RUNNER_TEMP/guides-source-manifest.json" --media-manifest plugins/lark-docs/meta/media-cache/guides.json --root-token Tg6mwbRGDitPQ3kLUQzc44I7nth
          node scripts/docs-workflow/guides-stage-artifact.js --operation create --stage source --workspace "$GITHUB_WORKSPACE" --baseline-dir "$RUNNER_TEMP/baseline" --output "$RUNNER_TEMP/guides-source" --master-sha "${{ inputs.master_sha }}" --dev-baseline-sha "${{ inputs.dev_baseline_sha }}" --snapshot-candidate plugins/lark-docs/meta/reports/guides-source-snapshot-candidate.json --root-token Tg6mwbRGDitPQ3kLUQzc44I7nth
          tar -cf "$RUNNER_TEMP/guides-source.tar" -C "$RUNNER_TEMP" guides-source
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: guides-sources-${{ github.run_id }}
          path: ${{ runner.temp }}/guides-source.tar
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error
      - id: result
        if: ${{ always() }}
        run: echo "status=${{ steps.upload.outcome == 'success' && 'artifact_ready' || 'failed' }}" >> "$GITHUB_OUTPUT"
      - if: ${{ always() }}
        run: git worktree remove --force "$RUNNER_TEMP/baseline" || true
