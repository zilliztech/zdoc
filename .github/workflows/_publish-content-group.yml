name: publish docs content group

on:
  workflow_call:
    inputs:
      group:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      commit_message:
        required: true
        type: string
      should_publish:
        required: true
        type: boolean
      master_sha:
        required: true
        type: string
      validate_command:
        required: false
        type: string
        default: node "$GITHUB_WORKSPACE/scripts/validate-generated-sidebars.js"
      baseline_artifact_name:
        required: false
        type: string
        default: ''
      target_branch:
        required: false
        type: string
        default: dev
      translation_batch_number: { required: false, type: number, default: 0 }
      translation_batch_count: { required: false, type: number, default: 0 }
    outputs:
      status:
        description: Publication result
        value: ${{ jobs.publish.outputs.status }}
      commit_sha:
        description: Published or current target commit
        value: ${{ jobs.publish.outputs.commit_sha }}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      status: ${{ steps.result.outputs.status }}
      commit_sha: ${{ steps.result.outputs.commit_sha }}
    env:
      GROUP: ${{ inputs.group }}
      MASTER_SHA: ${{ inputs.master_sha }}
      ARTIFACT_NAME: ${{ inputs.artifact_name }}
      COMMIT_MESSAGE: ${{ inputs.commit_message }}
      TARGET_BRANCH: ${{ inputs.target_branch }}
      VALIDATE_COMMAND: ${{ inputs.validate_command }}
      TRANSLATION_BATCH_NUMBER: ${{ inputs.translation_batch_number }}
      TRANSLATION_BATCH_COUNT: ${{ inputs.translation_batch_count }}
    steps:
      - name: Initialize temporary paths
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${RUNNER_TEMP:-}" && "$RUNNER_TEMP" == /* ]] || { echo "RUNNER_TEMP must be a non-empty absolute path" >&2; exit 1; }
          printf '%s\n' \
            "DOWNLOAD_DIR=$RUNNER_TEMP/download" \
            "EXTRACT_DIR=$RUNNER_TEMP/checkpoint-extracted" \
            "ARTIFACT_DIR=$RUNNER_TEMP/checkpoint-extracted/checkpoint-group" \
            "BASELINE_DOWNLOAD_DIR=$RUNNER_TEMP/baseline-download" \
            "BASELINE_EXTRACT_DIR=$RUNNER_TEMP/baseline-extracted" \
            "BASELINE_DIR=$RUNNER_TEMP/baseline-extracted/checkpoint-group" \
            "PUBLISH_OUTPUT=$RUNNER_TEMP/publication-output.txt" >> "$GITHUB_ENV"

      - name: Validate publisher inputs
        if: ${{ inputs.should_publish }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          if (!/^[0-9a-f]{40}$/.test(process.env.MASTER_SHA)) throw new Error('master_sha must be a lowercase 40-character Git SHA')
          for (const [name, value] of [['artifact_name', process.env.ARTIFACT_NAME], ['commit_message', process.env.COMMIT_MESSAGE], ['validate_command', process.env.VALIDATE_COMMAND]]) {
            if (!value || /[\r\n]/.test(value)) throw new Error(`${name} must be non-empty and single-line`)
          }
          const number = Number(process.env.TRANSLATION_BATCH_NUMBER), count = Number(process.env.TRANSLATION_BATCH_COUNT)
          if ((number === 0) !== (count === 0) || !Number.isSafeInteger(number) || !Number.isSafeInteger(count) || number < 0 || count < number) throw new Error('translation batch inputs are invalid')
          NODE
          git check-ref-format --branch "$TARGET_BRANCH"

      - name: Check out immutable publisher tooling
        if: ${{ inputs.should_publish }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.master_sha }}
          fetch-depth: 0

      - name: Validate content group contract
        if: ${{ inputs.should_publish }}
        run: |
          node - <<'NODE'
          const group = require('./scripts/docs-workflow/content-groups.js').getContentGroup(process.env.GROUP)
          const number = Number(process.env.TRANSLATION_BATCH_NUMBER), count = Number(process.env.TRANSLATION_BATCH_COUNT)
          const allowed = number > 0 ? `i18n(${process.env.GROUP}): publish batch ${number} of ${count}` : `i18n(${process.env.GROUP}): publish translations`
          if (process.env.COMMIT_MESSAGE !== group.commitMessage && process.env.COMMIT_MESSAGE !== allowed) throw new Error('commit_message must equal a permitted content group message')
          NODE

      - uses: pnpm/action-setup@v4
        if: ${{ inputs.should_publish }}
        with:
          version: 9

      - name: Set up Node.js
        if: ${{ inputs.should_publish }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        if: ${{ inputs.should_publish }}
        run: pnpm install --frozen-lockfile

      - name: Download checkpoint artifact
        if: ${{ inputs.should_publish }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/download

      - name: Download baseline artifact
        if: ${{ inputs.should_publish && inputs.baseline_artifact_name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.baseline_artifact_name }}
          path: ${{ runner.temp }}/baseline-download

      - name: Safely extract checkpoint artifact
        if: ${{ inputs.should_publish }}
        shell: bash
        run: |
          set -euo pipefail
          extract_checkpoint_archive() {
            local archive=$1 extract_dir=$2 artifact_dir=$3 label=$4
            local paths_file="$RUNNER_TEMP/${label}-archive-paths.txt"
            local types_file="$RUNNER_TEMP/${label}-archive-types.txt"
            [[ -f "$archive" ]]
            tar -tf "$archive" > "$paths_file"
            tar -tvf "$archive" > "$types_file"
            ARCHIVE_PATHS_FILE="$paths_file" ARCHIVE_TYPES_FILE="$types_file" node - <<'NODE'
          const fs = require('node:fs')
          const paths = fs.readFileSync(process.env.ARCHIVE_PATHS_FILE, 'utf8').split('\n').filter(Boolean)
          if (!paths.length) throw new Error('Checkpoint archive is empty')
          for (const archiveName of paths) {
            const name = archiveName.endsWith('/') ? archiveName.slice(0, -1) : archiveName
            if (!name || name.startsWith('/') || name.split('/').some(part => part === '..' || part === '')) throw new Error(`Unsafe archive path: ${archiveName}`)
            if (name !== 'checkpoint-group' && !name.startsWith('checkpoint-group/')) throw new Error(`Unexpected archive root: ${archiveName}`)
          }
          const lines = fs.readFileSync(process.env.ARCHIVE_TYPES_FILE, 'utf8').split('\n').filter(Boolean)
          for (const line of lines) if (!['-', 'd'].includes(line[0])) throw new Error(`Unsafe archive entry type: ${line}`)
          NODE
            mkdir -p "$extract_dir"
            tar -xf "$archive" -C "$extract_dir"
            [[ $(find "$extract_dir" -mindepth 1 -maxdepth 1 -print | wc -l) -eq 1 ]]
            [[ -d "$artifact_dir" && ! -L "$artifact_dir" ]]
          }
          extract_checkpoint_archive "$DOWNLOAD_DIR/checkpoint-group.tar" "$EXTRACT_DIR" "$ARTIFACT_DIR" checkpoint
          if [[ -n "${{ inputs.baseline_artifact_name }}" ]]; then
            extract_checkpoint_archive "$BASELINE_DOWNLOAD_DIR/checkpoint-group.tar" "$BASELINE_EXTRACT_DIR" "$BASELINE_DIR" baseline
          fi

      - name: Validate checkpoint identity
        if: ${{ inputs.should_publish }}
        run: |
          node scripts/docs-workflow/validate-checkpoint-artifact.js --artifact "$ARTIFACT_DIR" --group "$GROUP" --master-sha "$MASTER_SHA"
          node - <<'NODE'
          const { validateCheckpointArtifact } = require('./scripts/docs-workflow/validate-checkpoint-artifact.js')
          validateCheckpointArtifact(process.env.ARTIFACT_DIR).then(manifest => {
            const number = Number(process.env.TRANSLATION_BATCH_NUMBER), count = Number(process.env.TRANSLATION_BATCH_COUNT)
            if (number > 0 && (manifest.batch?.batchNumber !== number || manifest.batch?.batchCount !== count)) throw new Error('checkpoint translation batch identity mismatch')
            if (number === 0 && manifest.batch !== undefined) throw new Error('unexpected checkpoint translation batch identity')
          }).catch(error => { console.error(error.message); process.exit(1) })
          NODE

      - name: Validate baseline artifact payload
        id: baseline_validation
        if: ${{ inputs.should_publish && inputs.baseline_artifact_name != '' }}
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs/promises')
          const path = require('node:path')
          const { validateCheckpointArtifact } = require('./scripts/docs-workflow/validate-checkpoint-artifact.js')
          validateCheckpointArtifact(process.env.BASELINE_DIR).then(async manifest => {
            const baselineDir = path.join(manifest.resolvedDir, 'payload')
            const cache = path.join(baselineDir, '.translation-cache/ja-JP.json')
            const stat = await fs.lstat(cache)
            if (!stat.isFile() || stat.isSymbolicLink()) throw new Error('Baseline translation cache must be a regular file')
            await fs.appendFile(process.env.GITHUB_OUTPUT, `baseline_dir=${baselineDir}\n`)
          }).catch(error => { console.error(error.message); process.exit(1) })
          NODE

      - name: Publish checkpoint
        id: publisher
        if: ${{ inputs.should_publish }}
        shell: bash
        env:
          BASELINE_PAYLOAD_DIR: ${{ steps.baseline_validation.outputs.baseline_dir }}
        run: |
          set -o pipefail
          baseline_args=()
          if [[ -n "${{ inputs.baseline_artifact_name }}" ]]; then
            baseline_args=(--baseline-dir "$BASELINE_PAYLOAD_DIR")
          fi
          bash scripts/docs-workflow/publish-checkpoint.sh \
            --artifact "$ARTIFACT_DIR" \
            --branch "$TARGET_BRANCH" \
            --message "$COMMIT_MESSAGE" \
            --max-attempts 10 \
            --validate-command "$VALIDATE_COMMAND" \
            "${baseline_args[@]}" | tee "$PUBLISH_OUTPUT"

      - name: Emit final publication result
        id: result
        if: ${{ always() }}
        shell: bash
        run: |
          status=failed
          commit_sha=
          if [[ "${{ inputs.should_publish }}" != true ]]; then
            status=skipped
          elif [[ "${{ steps.publisher.outcome }}" == success && -f "$PUBLISH_OUTPUT" ]]; then
            status=$(sed -n 's/^status=//p' "$PUBLISH_OUTPUT" | tail -1)
            commit_sha=$(sed -n 's/^commit_sha=//p' "$PUBLISH_OUTPUT" | tail -1)
            [[ "$status" == published || "$status" == no_changes ]] || status=failed
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"

      - name: Upload publication diagnostics
        if: ${{ always() && inputs.should_publish }}
        uses: actions/upload-artifact@v4
        with:
          name: publication-${{ inputs.group }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/publication-output.txt
            ${{ runner.temp }}/*-archive-paths.txt
            ${{ runner.temp }}/*-archive-types.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Fail unsuccessful publication
        if: ${{ always() && steps.result.outputs.status == 'failed' }}
        run: exit 1
